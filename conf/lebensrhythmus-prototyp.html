document.addEventListener('change',e=>{
  const el=e.target; const f=el.dataset.field||'';
  if(f==='areaName'){const x=S.areas.find(y=>y.id===el.dataset.id); if(x){x.name=el.value; save()}}
  else if(f==='areaColor'){const x=S.areas.find(y=>y.id===el.dataset.id); if(x){x.color=el.value; save(); render(); toast('Eigene Farbe gesetzt.')}}
  else if(f==='phColor'){ui.phColor=el.value; save(); render()}
  else if(f==='motto'){(S.motto||(S.motto={}))[el.dataset.year]=el.value.trim(); save(); render()}
  else if(f==='liveOn'){S.settings.liveSync.on=el.checked; save(); startSync(); render()}
  else if(f==='liveInterval'){S.settings.liveSync.interval=+el.value; save(); startSync(); render()}
  else if(f==='slotS'){S.settings.slotTimes[el.dataset.slot].s=el.value||slotWin(+el.dataset.slot).s; save(); render()}
  else if(f==='slotE'){S.settings.slotTimes[el.dataset.slot].e=el.value||slotWin(+el.dataset.slot).e; save(); render()}
  else if(f==='weekJump'){
    const v=el.value||'';
    const m=v.match(/^(\d{4})-(\d{2})/);
    if(m){ui.anchor=mondayOf(new Date(+m[1],+m[2]-1,1)); ui.mobileDay=0; render(); toast('Gesprungen: '+MONNAMES[+m[2]-1]+' '+m[1]+' — Woche ab '+fmtDate(ui.anchor)+'.')}
  }
  else if(f==='wdCal'){const c=wdCfg(); c.cal=el.value; save(); render(); toast('Kalender gewählt — Live-Sync kann jetzt laufen.')}
  else if(f==='kanState'){setKan(el.dataset.tid,el.value); render()}
  else if(f==='wdCal2'){const c=wdCfg(); c.cal2=el.value||''; save(); render(); toast(el.value?'Phasen-Kalender gewählt — Phasen werden transparent geführt.':'Phasen laufen im Hauptkalender.')}
  else if(f==='typeName'){const x=S.types.find(y=>y.id===el.dataset.id); if(x){x.name=el.value; save()}}
  else if(f==='typeAmpel'){const x=S.types.find(y=>y.id===el.dataset.id); if(x){x.ampel=el.value; save()}}
  else if(f==='typeAsAppt'){const x=S.types.find(y=>y.id===el.dataset.id); if(x){x.asAppt=!!el.checked; save(); render(); toast(x.asAppt?'Blöcke dieses Typs erscheinen jetzt auch bei Termine.':'Typ zählt wieder als Block.')}}
  else if(f==='projName'){const x=projOf(el.dataset.id); if(x){x.name=el.value; save()}}
  else if(f==='aid'){S.settings.aids[el.dataset.id]=el.checked; save(); render()}
});

    render();
    const ni=document.getElementById('inb-q');
    if(ni){ni.focus(); try{ni.setSelectionRange(pos,pos)}catch(x){}}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target;
  if(el&&el.dataset&&el.dataset.enter){
    const parts=el.dataset.enter.split('|');
    if(ACT[parts[0]])ACT[parts[0]](parts.slice(1).join('|'),el);
  }
});
document.addEventListener('dragstart',e=>{
  const el=e.target.closest('[data-drag]');
  if(el&&e.dataTransfer){e.dataTransfer.setData('text/plain',el.dataset.drag); e.dataTransfer.effectAllowed='move'}
});
document.addEventListener('dragover',e=>{
  const el=e.target.closest('[data-drop]');
  if(el){e.preventDefault(); el.classList.add('drop')}
});
document.addEventListener('dragleave',e=>{
  const el=e.target.closest('[data-drop]');
  if(el)el.classList.remove('drop');
});
document.addEventListener('drop',e=>{
  const el=e.target.closest('[data-drop]');
  if(!el)return;
  e.preventDefault();
  el.classList.remove('drop');
  const data=e.dataTransfer.getData('text/plain');
  if(!data)return;
  const drop=el.dataset.drop;
  if(drop[0]==='w'&&data.startsWith('block:')){
    const from=data.slice(6).split('|');
    const to=drop.slice(1).match(/(\d)s(\d)/);
    if(!to)return;
    const fd=+from[0], fs=+from[1], td=+to[1], ts=+to[2];
    if(slotOccupied(td,ts)){toast('Ziel belegt.'); return}
    const bl=getBlocks()[fd+'|'+fs]; if(!bl)return;
    delete getBlocks()[fd+'|'+fs];
    getBlocks()[td+'|'+ts]=bl;
    if(bl.todoId){const f=findTodo(bl.todoId); if(f)f.t.planned={wk:wk(),day:td,slot:ts}}
    save(); render(); toast('Verschoben nach '+fmtDaySlot(td,ts));
  }else if(drop==='g'&&data.startsWith('gtodo:')){
    const tid=data.slice(6).split('|')[1];
    const f=findTodo(tid);
    if(f){
      f.t.start=el.dataset.date;
      save(); render(); toast('Start verschoben: '+fmtDate(parseISO(el.dataset.date))+' — die Deadline (▼) bleibt fix.');
    }
  }else if(drop.startsWith('k')&&data.startsWith('todo:')){
    const tid=data.slice(5).split('|')[1];
    const col=drop.slice(1);
    ACT.kanMove({tid:tid,c:col});
  }else if(drop.startsWith('reorder:')&&data.startsWith('reorder:')){
    const tp=drop.split(':'), sp=data.split(':');
    if(tp[1]===sp[1]){
      const map={area:'areas',type:'types'};
      const arr=S[map[tp[1]]]; if(!arr)return;
      const from=+sp[2], to=+tp[2];
      if(from!==to&&from>=0&&to>=0&&from<arr.length&&to<arr.length){
        const mv=arr.splice(from,1)[0];
        arr.splice(to,0,mv);
        save(); render();
      }
    }
  }
});

/* ================= Start ================= */
const savedState=load();
S=(savedState&&savedState.meta&&savedState.meta.v===4)?normalizeState(savedState):seedFrom(savedState);
ui.year=new Date().getFullYear();
ui.mobileDay=dayIdx(new Date());
render();
/* Live-Sync automatisch starten, wenn Zugangsdaten vorhanden sind */
if(wdCfg().url&&wdCfg().user&&wdCfg().pass)setTimeout(syncCycle,700);
startSync();
</script>
