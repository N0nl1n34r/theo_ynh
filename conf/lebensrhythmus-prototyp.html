<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo — Alpha</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<meta name="theme-color" content="#FBF9F2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./theo-icon.png">
<script>
/* PWA: Service-Worker nur über HTTP(S) registrieren (nicht als Datei, nicht in Sandbox-Vorschauen) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('./sw.js').catch(function(){})}catch(e){}}
</script>
<style>
:root{
  --bg:#F6F3ED; --panel:#FFFFFF; --ink:#3A362D; --sub:#8A8478; --line:#E7E1D4; --soft:#F1EDE3;
  --rot:#D96A5B; --orange:#E09B4C; --gelb:#D8B44C; --gruen:#7CA982; --neutral:#B5AFA4;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.45}
button{font:inherit; color:inherit}
h1{font-size:23px; font-weight:600; letter-spacing:-.01em; margin:0}
h3{font-size:16.5px; margin:0 0 2px}
.sub{color:var(--sub); font-size:13px}
.dim{color:var(--sub); font-style:italic}
.strike{text-decoration:line-through; opacity:.55}

/* ---------- Layout ---------- */
#wrap{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh}
#nav{background:#F2EEE5; border-right:1px solid var(--line); padding:18px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px}
.logo{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; padding:4px 10px 16px}
.logo .leaf{font-size:20px}
.navbtn{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border:none; background:transparent; border-radius:12px; cursor:pointer; font-size:14.5px; position:relative}
.navbtn:hover{background:#EAE5D9}
.navbtn.on{background:#FFF; box-shadow:0 1px 3px rgba(80,70,40,.08); font-weight:600}
.navdot{width:7px; height:7px; border-radius:50%; background:#9BB89A; position:absolute; right:12px}
.navfoot{margin-top:auto; padding:10px 12px; font-size:11.5px; color:var(--sub); line-height:1.5}
#main{padding:26px 30px 70px; max-width:1210px; width:100%}
#topbar{display:none}

.vhead{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.hbtns{display:flex; gap:6px}
.crumb{color:var(--sub); font-size:13px; cursor:pointer; margin-bottom:6px}
.crumb:hover{color:var(--ink)}

/* ---------- Buttons & inputs ---------- */
.btn{background:#FFF; border:1px solid #DCD5C6; border-radius:11px; padding:9px 15px; cursor:pointer; font-size:14px}
.btn:hover{background:#FBF9F4}
.btn.primary{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
.btn.primary:hover{background:#3B372F}
.btn.ghost{background:transparent; border-color:transparent; color:var(--sub)}
.btn.ghost:hover{color:var(--ink); background:#EFEAE0}
.btn.danger{border-color:#E4B9B2; color:#A44B3F}
.btn.mini{padding:5px 11px; font-size:12.5px; border-radius:9px}
.inp{width:100%; border:1px solid #DCD5C6; border-radius:11px; padding:9px 12px; font:inherit; font-size:14px; background:#FFF; color:var(--ink)}
.inp:focus{outline:2px solid #C8D8C4; outline-offset:1px}
.inp.slim{width:auto; padding:7px 9px; font-size:13px}
.inp.grow{flex:1}
.inp.big{font-size:16.5px; font-weight:600}
label.f{display:block; font-size:12.5px; color:var(--sub); margin:12px 0 5px}
.row2{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.checkrow{display:flex; align-items:center; gap:9px; margin:12px 0; font-size:14px; cursor:pointer}

/* ---------- Chips & dots ---------- */
.chip{display:inline-flex; align-items:center; gap:7px; background:#FFF; border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer}
.chip:hover{background:#FBF9F4}
.chip.mini{padding:3px 10px; font-size:12px}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0}
.dot{width:11px; height:11px; border-radius:50%; display:inline-block; border:2px solid #FFF; box-shadow:0 0 0 1.5px rgba(60,55,40,.12); flex:none}
.dot.rot{background:var(--rot)} .dot.orange{background:var(--orange)} .dot.gelb{background:var(--gelb)} .dot.gruen{background:var(--gruen)} .dot.none{background:var(--neutral)}
.ampRow{display:flex; gap:7px; flex-wrap:wrap}
.ampB{display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid #E3DCCD; border-radius:12px; background:#FFF; cursor:pointer; font-size:13.5px}
.ampB.sel{border-color:#7E8F79; box-shadow:0 0 0 1.5px #7E8F79 inset; background:#F4F6F1}
.legend{display:flex; align-items:center; gap:9px; flex-wrap:wrap; color:var(--sub); font-size:12px; margin-top:18px}
.legend .dot{width:9px; height:9px}

/* ---------- Orientierungshilfen ---------- */
.orient{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.orient .mini2{border:none; background:#F1EDE3; border-radius:7px; padding:2px 8px; cursor:pointer; font-size:12px}
.orient .mini2:hover{background:#E7E1D4}

/* ---------- Wochenraster ---------- */
.sugg{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:#EEF4EC; border:1px solid #D6E4D4; border-radius:14px; padding:12px 15px; font-size:13.5px; margin-bottom:12px}
.intro{background:#FDFBF6; border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:13.5px; margin-bottom:14px}
.intro ul{margin:8px 0 10px; padding-left:18px; color:#5C564A}
.wgrid{display:grid; grid-template-columns:88px repeat(7,minmax(0,1fr)); gap:7px}
.dh{font-size:12.5px; font-weight:600; color:#6F6A5F; padding:5px 4px; text-align:center; border-radius:10px}
.dh.today{background:#EFEAE0}
.sl{font-size:11.5px; color:var(--sub); padding:8px 4px; text-align:right}
.sl .ico{font-size:15px; display:block; text-align:center; margin-bottom:3px}
.slot{min-height:106px; border-radius:14px; position:relative; display:flex; flex-direction:column; gap:6px}
.slot.free{border:1.6px dashed #D9D3C6; align-items:center; justify-content:center; color:#A49E91; cursor:pointer; background:rgba(255,255,255,.4); gap:2px}
.slot.free:hover{border-color:#B9B2A2; color:#75705F; background:#FFF}
.slot.free .plus{font-size:17px; line-height:1}
.slot.free .fl{font-size:11px}
.slot.drop{outline:2px solid #9BC4A9; outline-offset:2px}
.card{background:#FFF; border:1px solid #ECE6D9; border-radius:14px; padding:10px 12px; box-shadow:0 1px 2px rgba(80,70,40,.05); font-size:13.5px}
.card.appt.stacked{margin-top:6px; border-left:3px solid #B7AE9C; background:#FDFBF6; font-size:12.5px; padding:8px 10px}
.block{border-left:3px solid var(--ac,#C9C2B2); cursor:pointer; flex:1}
.block.done{opacity:.5}
.appt{background:#FBF8F1; cursor:pointer; flex:1}
.brow{display:flex; align-items:center; gap:8px}
.bico{font-size:15px}
.bttl{font-weight:600; flex:1}
.btime{font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums}
.bnote{font-size:12px; color:var(--sub); margin-top:4px}
.bsrc{font-size:11px; color:#A49E91; margin-top:4px}
.tchip{display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12.5px; cursor:pointer}
.noamp{font-size:11px; color:#A49E91; border:1px dashed #D9D3C6; border-radius:8px; padding:1px 7px}
.wmobile{display:none}
.daychips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px}
.daychips .chip{flex:none}
.daychips .chip.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
.mdayView .slot{min-height:88px; margin-bottom:10px}
.mslotLabel{font-size:12px; color:var(--sub); margin:14px 0 5px; display:flex; gap:7px; align-items:center}

/* ---------- Jahresansicht ---------- */
.ygrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:12px}
.mcard{padding:12px}
.mname{font-weight:600; font-size:13.5px; margin-bottom:7px}
.mrow{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:3px}
.mwd{font-size:9px; color:#A9A394; text-align:center}
.mcell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:10.5px; border-radius:5px; color:#75705F}
.mcell.ph{color:#3D3A33}
.mcell.today{box-shadow:inset 0 0 0 1.6px #8A8578; font-weight:700}
.phchip{display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 13px; background:#FFF; cursor:pointer; margin-bottom:8px; text-align:left}
.phchip:hover{background:#FBF9F4}
.phbar{width:15px; height:15px; border-radius:4.5px; background:var(--c); flex:none}
.phmeta{font-size:11.5px; color:var(--sub)}
.phlist{margin-top:16px}
.swatches{display:flex; gap:5px; flex-wrap:wrap}
.sw{width:19px; height:19px; border-radius:6px; border:none; background:var(--c); cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw.sel{outline:2px solid #4A453C; outline-offset:1.5px}

/* ---------- Bereiche & Projekte ---------- */
.areaGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; margin-bottom:18px}
.area{border-left:3px solid var(--ac); padding:13px 14px}
.ahead{display:flex; align-items:center; gap:9px; margin-bottom:8px}
.aemo{font-size:19px}
.aname{font-weight:600; flex:1}
.acount{font-size:11.5px; color:var(--sub)}
.chip.proj{border-left:3px solid var(--c)}
.pc{color:var(--sub); font-size:11px}
.phead{display:flex; align-items:center; gap:10px; margin-top:2px}
.emoBtn{border:1px solid var(--line); background:#FFF; border-radius:11px; font-size:17px; padding:7px 10px; cursor:pointer}
.tabs{display:flex; gap:6px; margin:12px 0; flex-wrap:wrap}
.tab{border:1px solid var(--line); background:#FFF; border-radius:999px; padding:6px 14px; cursor:pointer; font-size:13px}
.tab.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
.tab.off{color:var(--sub); border-style:dashed; cursor:default; background:transparent}
.trow{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid #F0EBE0; flex-wrap:wrap}
.trow:last-child{border-bottom:none}
.tt{flex:1; min-width:140px}
.xbtn{border:none; background:transparent; color:#B3AC9D; cursor:pointer; font-size:13px; padding:4px 7px; border-radius:8px}
.xbtn:hover{background:#F0EBE0; color:#8A8478}
.note{background:#F7F4EC; border-radius:10px; padding:9px 12px; font-size:13px; margin:10px 0; color:#5C564A}

/* ---------- Kanban ---------- */
.kscroll{overflow-x:auto; padding-bottom:6px}
.kb{display:grid; grid-template-columns:repeat(5,minmax(186px,1fr)); gap:12px; min-width:930px}
.kcol{background:var(--soft); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:150px}
.kcol.drop{outline:2px solid #9BC4A9; outline-offset:2px}
.kname{font-size:12.5px; font-weight:600; color:#6F6A5F; display:flex; justify-content:space-between; padding:0 3px}
.kcard{cursor:grab}
.kadd{background:transparent; border:1px dashed #D9D3C6; border-radius:11px; padding:8px 10px; font:inherit; font-size:13px; color:var(--ink); width:100%}
.chip.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
/* ---------- Gantt ---------- */
.ganttWrap{overflow-x:auto; padding-bottom:8px}
.gantt{min-width:fit-content}
.gcap{font-size:12px; color:var(--sub); margin:8px 0 4px; display:flex; gap:14px; flex-wrap:wrap}
.gcap .gi{display:inline-flex; align-items:center; gap:6px}
.ghead{display:flex; align-items:flex-end}
.gheadLbl{width:220px; flex:none; font-size:11px; color:var(--sub); padding:4px}
.gheadTrack{display:flex}
.gday{width:36px; flex:none; text-align:center; font-size:9.5px; color:#A9A394; padding:3px 0; border-left:1px solid #F0EBE0}
.gday.wknd{background:#F4F1E9}
.gday.today{color:#8A6B5C; font-weight:700}
.grow{display:flex; align-items:center; border-top:1px solid #F0EBE0}
.growLbl{width:220px; flex:none; font-size:12.5px; padding:6px 8px; display:flex; align-items:center; gap:6px; min-height:38px}
.growTrack{position:relative; height:38px}
.gcell{position:absolute; top:0; bottom:0; width:36px; border-left:1px solid #F4F0E7}
.gcell.wknd{background:#F7F4EC}
.gbar{position:absolute; top:8px; height:22px; border-radius:8px; background:#CBB389; cursor:grab; display:flex; align-items:center; padding:0 8px; font-size:11px; color:#3A362D; white-space:nowrap; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.gbar .gbt{pointer-events:none}
.gtoday{position:absolute; top:0; bottom:0; width:2px; background:#C98D76; opacity:.75; pointer-events:none}
.gdue{position:absolute; top:11px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:9px solid #4A453C; pointer-events:none; transform:translateX(-6px)}
.gmove{display:flex; gap:3px; margin-left:auto}
.gmove .xbtn{padding:2px 6px}

/* ---------- Eingangskiste ---------- */
.capCard{padding:14px 16px; margin-bottom:14px}
.capKinds{display:flex; gap:6px; margin-bottom:9px; flex-wrap:wrap}
.capKinds .chip.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
.inbItem{margin-bottom:9px}
.inbKind{font-size:11.5px; color:var(--sub); margin-bottom:2px}
.inbText{font-size:14px}
.inbActs{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}

/* ---------- Konfiguration ---------- */
.cfgList{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
.cfgRow{display:flex; align-items:center; gap:9px; background:#FFF; border:1px solid #ECE6D9; border-radius:13px; padding:9px 12px; flex-wrap:wrap}
.fh{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#9B9587; margin:20px 0 8px}
.fh2{font-size:13px; font-weight:600; color:#6F6A5F; margin:10px 0 2px}
.sw2{width:20px; height:20px; border-radius:6px; border:none; background:var(--c); cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw2.sel{outline:2px solid #4A453C; outline-offset:1.5px}
.emogrid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-top:12px}
.emogrid button{font-size:19px; padding:7px; border:1px solid var(--line); background:#FFF; border-radius:10px; cursor:pointer}
.emogrid button:hover{background:#F4F0E7}
.statusline{background:#F4F1E9; border-radius:11px; padding:10px 13px; font-size:13px; margin-bottom:10px; color:#5C564A}

/* ---------- Sheets & Toast ---------- */
#overlay{position:fixed; inset:0; background:rgba(45,40,30,.38); display:none; align-items:center; justify-content:center; z-index:50; padding:16px}
#overlay.on{display:flex}
.sheet{background:#FDFCF8; border-radius:18px; width:100%; max-width:560px; max-height:87vh; overflow:auto; padding:20px 22px; box-shadow:0 14px 44px rgba(40,35,20,.2)}
.shead{margin-bottom:6px}
.stack{display:flex; flex-direction:column; gap:7px; margin-top:10px}
.typeB{display:flex; align-items:center; gap:11px; width:100%; padding:11px 13px; border:1px solid #E7E1D4; border-radius:13px; background:#FFF; cursor:pointer; text-align:left; font-size:14px}
.typeB:hover{background:#F7F4EC}
.sheetBtns{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.daySec{margin-top:14px}
.daySecT{font-size:13px; font-weight:600; color:#6F6A5F; margin-bottom:6px}
.pickRow{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid #F0EBE0; font-size:13.5px}
.pickRow .lbl{width:130px; color:var(--sub); font-size:12.5px}
.pickRow .st{flex:1; font-size:12.5px; color:#B3AC9D}
#toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(16px); background:#3A362D; color:#F7F4EC; border-radius:12px; padding:11px 17px; font-size:13.5px; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:92vw}
#toast.show{opacity:1; transform:translateX(-50%)}

/* ---------- Deadlines & Anstehend ---------- */
.duechip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:8px;padding:2px 8px;background:#F4F1E9;color:#6F6A5F;border:1px solid #E7E1D4;cursor:pointer;flex:none}
.duechip.past{background:#F3E9E4;color:#8A6B5C;border-color:#E4CFC4}
.upcard{margin-top:16px}
.uprow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #F0EBE0;flex-wrap:wrap}
.uprow:last-child{border-bottom:none}
.upT{flex:1;min-width:150px}
.upP{font-size:11px;color:var(--sub)}
.firstStep{font-size:12px;color:var(--sub);font-style:italic}
code{background:#F1EDE3;border-radius:5px;padding:1px 5px;font-size:11.5px}
/* ---------- Jahres-Klick (Airbnb-Stil) ---------- */
.mcell{cursor:pointer}
.mcell:hover{filter:brightness(.96)}
.mcell.sel{box-shadow:inset 0 0 0 2px #4A453C;font-weight:700;color:#3D3A33}
.yhint{background:#FDF6E7;border:1px solid #EAD9A6;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
/* ---------- Suche & Filter ---------- */
.capTools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.capTools .inp{flex:1;min-width:160px;max-width:320px}
/* ---------- Sortieren in der Konfiguration ---------- */
.grip{color:#B3AC9D;font-size:14px;cursor:grab;user-select:none;padding:0 2px}
.arrows{display:flex;gap:3px}
.arrows .xbtn{padding:3px 6px}
.cfgRow.drop{outline:2px solid #9BC4A9;outline-offset:2px}
.colorInp{width:27px;height:27px;border:1px solid var(--line);border-radius:7px;padding:1px;background:#FFF;cursor:pointer;flex:none}
.mottoInp{border:none;background:transparent;border-bottom:1.5px dashed #D9D3C6;font-size:15px;font-weight:600;color:var(--ink);padding:3px 4px;width:240px;max-width:100%;font-family:inherit}
.mottoInp:focus{outline:none;border-bottom-color:#B9B2A2}
.agRow{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid #F0EBE0;flex-wrap:wrap;cursor:pointer;border-radius:8px}
.agRow:hover{background:#FBF9F4}
.agD{font-size:12px;color:var(--sub);width:88px;flex:none;font-variant-numeric:tabular-nums}
.agT{flex:1;min-width:140px}
.lbl{font-size:12px;color:var(--sub);width:96px;flex:none}
.wdStatus{background:#F4F1E9;border-radius:11px;padding:10px 13px;font-size:13px;color:#5C564A;margin-bottom:10px;line-height:1.5}
.spancont{border:1.5px dashed #E0D9CA;color:#B3AC9D;font-size:11px;align-items:flex-start;justify-content:flex-start;padding:9px 11px;background:rgba(255,255,255,.35);cursor:default}

/* ---------- Responsive ---------- */
@media(max-width:940px){
  #wrap{grid-template-columns:1fr}
  #nav{position:fixed; top:0; left:0; right:0; z-index:40; transform:translateY(-108%); transition:transform .25s ease; height:auto; border-right:none; border-bottom:1px solid var(--line); box-shadow:0 10px 26px rgba(40,35,20,.12); padding:14px 16px 12px}
  #nav.open{transform:none}
  .logo{padding:2px 10px 10px}
  .navfoot{display:none}
  #topbar{display:flex; position:fixed; top:0; left:0; right:0; height:54px; align-items:center; justify-content:space-between; padding:0 14px; background:rgba(246,243,237,.94); backdrop-filter:blur(8px); z-index:35; border-bottom:1px solid var(--line)}
  #topbar .burger{border:1px solid var(--line); background:#FFF; border-radius:11px; padding:7px 12px; cursor:pointer; font-size:15px}
  #main{padding:70px 16px 60px; max-width:640px}
  .wgrid{display:none}
  .wmobile{display:block}
  .sheet{max-height:82vh; border-radius:18px 18px 8px 8px}
  #overlay{align-items:flex-end}
  .kb{min-width:560px}
}
</style>
</head>
<body>
<div id="topbar">
  <div style="display:flex;align-items:center;gap:8px;font-weight:700"><span style="font-size:18px">🐣</span> Theo</div>
  <button class="burger" data-act="toggleMenu">☰</button>
</div>
<div id="wrap">
  <nav id="nav">
    <div class="logo"><span class="leaf">🐣</span> Theo</div>

'use strict';
/* ================= Hilfsfunktionen ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const MONNAMES=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DAYSHORT=['Mo','Di','Mi','Do','Fr','Sa','So'];
function dayIdx(d){return (d.getDay()+6)%7}
function mondayOf(d){const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-dayIdx(x)); return x}
function addDays(d,n){const x=new Date(d); x.setDate(x.getDate()+n); return x}
function fmtDate(d){return DAYSHORT[dayIdx(d)]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'}
function fmtDateLong(d){return DAYSHORT[dayIdx(d)]+', '+d.getDate()+'. '+MONNAMES[d.getMonth()]}
function isoWeek(d){const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+3-dayIdx(x)); const w1=new Date(x.getFullYear(),0,4); return 1+Math.round(((x-w1)/86400000-3+dayIdx(w1))/7)}
function parseISO(s){const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2])}

function kanOf(t){if(t.done)return 'fertig'; return (t.kanban&&t.kanban!=='fertig')?t.kanban:'offen'}

function seed(){
  /* Ab Rev 8: keine Demo-Daten mehr — Theo startet leer und zeigt nur, was wirklich synchronisiert wird.

function seedFrom(old){
  /* Neuer leerer Start — aber Verbindungseinstellungen (URL/Nutzer/App-Passwort/Kalender) bleiben erhalten,
     damit nach dem Leeren alles über den Live-Sync aus dem echten Kalender zurückkommt. */

}

/* ================= Datenhelfer ================= */
function wk(){return iso(ui.anchor)}
function projOf(id){return S.projects.find(p=>p.id===id)||null}
function areaOfId(id){return S.areas.find(a=>a.id===id)||null}
function areaOf(p){return areaOfId(p&&p.areaId)}
function typeOf(id){return S.types.find(t=>t.id===id)||null}
function findTodo(tid){for(const p of S.projects){const t=p.todos.find(x=>x.id===tid); if(t)return {t:t,p:p}} return null}
function blocksFor(w){return S.blocks[w]||(S.blocks[w]={})}
function apsFor(w){return S.appts[w]||(S.appts[w]={})}
function mitOf(d){return S.mit[d]||null}
function relDue(due){
  if(!due)return '';
  const t=todayISO();
  if(due===t)return 'heute';
  if(due===iso(addDays(new Date(),1)))return 'morgen';
  if(due<t)return 'seit '+fmtDate(parseISO(due));
  return fmtDate(parseISO(due));
}
function dueChip(due,extra){
  const r=relDue(due); if(!r)return '';
  return '<button class="duechip'+(due<todayISO()?' past':'')+'" '+(extra||'')+'>🕐 '+esc(r)+'</button>';
}
function allDeadlineItems(){
  const out=[];
  for(const p of S.projects)for(const t of p.todos){if(t.due&&!t.done&&!t.delegated&&!t.planned)out.push({kind:'todo',t:t,p:p})}
  for(const t of S.tasks){if(t.due&&!t.done&&!t.delegated&&!t.planned)out.push({kind:'task',t:t,p:null})}
  out.sort((a,b)=>a.t.due<b.t.due?-1:1);
  return out;
}
function plannedWithDue(){
  let n=0;
  for(const p of S.projects)n+=p.todos.filter(t=>t.due&&!t.done&&!t.delegated&&t.planned).length;
  n+=S.tasks.filter(t=>t.due&&!t.done&&!t.delegated&&t.planned).length;
  return n;
}
function delegatedCount(){
  let n=0;
  for(const p of S.projects)n+=p.todos.filter(t=>t.delegated).length;
  n+=S.tasks.filter(t=>t.delegated).length;
  return n;
}
function icsUid(kind,id){return 'theo-'+kind+'-'+id+'@theo-app'}
/* Blockzeitfenster im Kalender (konfigurierbar) */
function slotWin(s){
  const st=(S&&S.settings&&S.settings.slotTimes)||{};
  return st[s]||{s:['09:00','14:00','19:00'][s],e:['12:00','17:00','22:00'][s]};
}
function parseClock(t){
  if(!t)return null;
  const m=String(t).match(/(\d{1,2}):(\d{2})\s*[–—-]\s*(\d{1,2}):(\d{2})/);
  if(m)return [pad(+m[1])+':'+m[2],pad(+m[3])+':'+m[4]];
  const m2=String(t).match(/(\d{1,2}):(\d{2})/);
  if(m2)return [pad(+m2[1])+':'+m2[2],null];
  return null;
}
function toMin(hm){return +hm.slice(0,2)*60+ +hm.slice(3,5)}
function mapSlotForTime(start,end){
  let best=-1,bestOv=0;
  for(let s=0;s<3;s++){
    const w=slotWin(s);
    const cs=start?toMin(start):toMin(w.s);
    const ce=end?toMin(end):toMin(w.e);
    const ov=Math.max(0,Math.min(toMin(w.e),ce)-Math.max(toMin(w.s),cs));
    if(ov>bestOv){bestOv=ov;best=s}
  }
  return best;
}
function evTimes(date,slot,span,time){
  const sw=slotWin(slot);
  const pc=parseClock(time);
  const lastSlot=Math.min(2,slot+(span||1)-1);
  const ew=slotWin(lastSlot);
  const st=pc?pc[0]:sw.s;
  const en=pc?(pc[1]||sw.e):ew.e;
  return {start:icsD(date)+'T'+st.replace(':','')+'00',end:icsD(date)+'T'+en.replace(':','')+'00'};
}
function icsEsc(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsD(dstr){return String(dstr).replace(/-/g,'')}
function icsStats(){let nb=0,na=0,nf=0;for(const w in S.blocks){for(const k in S.blocks[w]){nb++;if(S.blocks[w][k].fb)nf++}}for(const w in S.appts){for(const k in S.appts[w]){na++;if(S.appts[w][k].fb)nf++}}return 'Enthalten: '+nb+' Blöcke · '+na+' Termine · '+Object.keys(S.mit).length+' MITs · '+S.phases.length+' Phasen · '+nf+' Rückmeldung(en) — als VEVENTs mit Kategorien LR-* und X-LR-Feldern (inkl. X-LR-SPAN, X-LR-FB, X-LR-FBNOTE für spätere Auswertung).'}
function buildEvents(only){
  const stamp=iso(new Date()).replace(/-/g,'')+'T120000Z';
  const evs=[];
  function ev(o){
    if(only==='phases'&&o.cat[0]!=='LR-PHASE')return;
    if(only==='main'&&o.cat[0]==='LR-PHASE')return;
    const L=['BEGIN:VEVENT','UID:'+o.uid,'DTSTAMP:'+stamp];
    if(o.dtstart)L.push('DTSTART:'+o.dtstart,'DTEND:'+o.dtend);
    else L.push('DTSTART;VALUE=DATE:'+icsD(o.start),'DTEND;VALUE=DATE:'+icsD(o.end));
    L.push('SUMMARY:'+icsEsc(o.sum));
    if(o.transp)L.push('TRANSP:TRANSPARENT');
    if(o.desc)L.push('DESCRIPTION:'+icsEsc(o.desc));
    L.push('CATEGORIES:'+o.cat.join(','));
    for(const k in o.x)L.push('X-LR-'+k+':'+icsEsc(o.x[k]));
    L.push('END:VEVENT');
    evs.push({uid:o.uid.split('@')[0],lines:L});
  }
  for(const w in S.blocks){const bs=S.blocks[w];
    for(const k in bs){const bl=bs[k];const p=k.split('|');
      const date=iso(addDays(parseISO(w),+p[0]));
      const cat=['LR-BLOCK']; if(bl.ampel)cat.push('LR-'+String(bl.ampel).toUpperCase());
      const tm=evTimes(date,+p[1],bl.span||1,bl.t0?apTimeStr(bl.t0,bl.t1):null);
      ev({uid:icsUid('block',w+'-'+p[0]+'-'+p[1]),dtstart:tm.start,dtend:tm.end,
        sum:(bl.title||'Block')+' · '+SLOTS[+p[1]].label,
        desc:(bl.note||'')+(bl.done?' (erledigt)':''),cat:cat,
        x:{KIND:bl.kind||'typ',SLOT:p[1],SPAN:String(bl.span||1),DATE:date,WEEK:w,DAY:p[0],PROJECT:bl.projectId||'',TODO:bl.todoId||'',TYPE:bl.typeId||'',FB:bl.fb||'',FBNOTE:bl.fbNote||''}});
    }
  }
  for(const w in S.appts){const aps=S.appts[w];
    for(const k in aps){const ap=aps[k];
      if(ap.remoteUid)continue;
      const date=iso(addDays(parseISO(w),+ap.day));
      const cat=['LR-APPT']; if(ap.ampel)cat.push('LR-'+String(ap.ampel).toUpperCase());
      const tm=evTimes(date,+ap.slot,ap.span||1,ap.time);
      ev({uid:icsUid('appt',w+'-'+ap.day+'-'+ap.slot),dtstart:tm.start,dtend:tm.end,
        sum:ap.title,desc:'Uhrzeit: '+ap.time,cat:cat,
        x:{KIND:'appt',SLOT:String(ap.slot),SPAN:String(ap.span||1),DATE:date,WEEK:w,DAY:String(ap.day),TIME:ap.time,SRC:ap.src||'',FB:ap.fb||'',FBNOTE:ap.fbNote||''}});
    }
  }
  for(const d in S.mit){const m=S.mit[d];
    ev({uid:icsUid('mit',d),start:d,end:iso(addDays(parseISO(d),1)),sum:'MIT: '+m.text,desc:'',transp:true,cat:['LR-MIT'],x:{KIND:'mit',DATE:d,MITDONE:m.done?'1':'0'}});
  }
  for(const p of S.phases){
    ev({uid:icsUid('phase',p.id),start:p.start,end:iso(addDays(parseISO(p.end),1)),sum:p.title,desc:p.desc||'',transp:true,cat:['LR-PHASE'],x:{KIND:'phase',START:p.start,END:p.end,COLOR:p.color}});
  }
  return evs.map(e=>({uid:e.uid,text:'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Theo//Prototyp//DE\r\nCALSCALE:GREGORIAN\r\n'+e.lines.join('\r\n')+'\r\nEND:VCALENDAR'}));
}
function buildICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Theo//Prototyp//DE','CALSCALE:GREGORIAN','X-WR-CALNAME:Theo'];
  buildEvents().forEach(e=>{e.text.split('\r\n').slice(4).forEach(l=>L.push(l))});
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
/* Gespiegelte Fremdtermine: bei Zeit-Änderung in Theo wird das Original im CalDAV-Server aktualisiert */
function mirrorICS(ap,date){
  const tm=evTimes(date,ap.slot,ap.span||1,ap.t0&&ap.t1?ap.t0+'–'+ap.t1:(ap.t0||ap.time));
  const stamp=iso(new Date()).replace(/-/g,'')+'T'+pad(new Date().getUTCHours())+pad(new Date().getUTCMinutes())+'00Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Theo//Prototyp//DE','BEGIN:VEVENT','UID:'+ap.remoteUid,'DTSTAMP:'+stamp,'DTSTART:'+tm.start,'DTEND:'+tm.end,'SUMMARY:'+icsEsc(ap.title),'TRANSP:OPAQUE','CATEGORIES:LR-MIRROR','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
async function wdPutRemote(ap,date){
  const c=wdCfg();
  if(!ap.remoteUid||!c.cal)return;
  try{
    const r=await wdFetch(c.cal+encodeURIComponent(ap.remoteUid)+'.ics',{method:'PUT',headers:{'Content-Type':'text/calendar; charset=utf-8'},body:mirrorICS(ap,date)});
    toast(r.ok?'Aktualisierung im Kalender übernommen.':'Kalender-Update scheiterte (HTTP '+r.status+').');
  }catch(e){toast('Kalender-Update nicht möglich (Netzwerk).')}
}
/* Fremde Einträge automatisch in die Woche einsortieren.
   Regel (R9): Die Zuordnung darf NIE scheitern — ist kein Slot frei, teilt sich der Eintrag
   einen belegten Slot (er hat echte Uhrzeiten und verdrängt nichts). */
function autoAssign(f){
  const w=iso(mondayOf(parseISO(f.date))), d=dayIdx(parseISO(f.date));
  const pc=parseClock(f.time);
  const prefer=pc?mapSlotForTime(pc[0],pc[1]):-1;
  const order=prefer>=0?[prefer,0,1,2].filter((v,i,a)=>a.indexOf(v)===i):[0,1,2];
  for(const s of order){
    if(!apsFor(w)[d+'|'+s]&&!blocksFor(w)[d+'|'+s])return {w:w,d:d,s:s};
  }
  return {w:w,d:d,s:prefer>=0?prefer:0,stack:true};
}
function stackAppt(w,d,s,ap){
  const key=d+'|'+s;
  let occ=apsFor(w)[key]||blocksFor(w)[key];
  if(!occ){const cov=coveredByW(w,d,s); if(cov){occ=apsFor(w)[d+'|'+cov.slot]||blocksFor(w)[d+'|'+cov.slot]; if(occ)s=cov.slot}}
  if(occ){occ.stack=occ.stack||[]; occ.stack.push(ap)}
  else apsFor(w)[key]=ap;
  return s;
}
function takeRemote(f,place,srcLabel){
  const pc=parseClock(f.time);
  const ap={id:uid(),day:place.d,slot:place.s,title:f.title,time:f.time||'—',ampel:null,src:'',areaId:null,span:1,typeId:null,remoteUid:f.uid};
  if(pc){ap.t0=pc[0]; if(pc[1])ap.t1=pc[1]}
  if(place.stack)stackAppt(place.w,place.d,place.s,ap);
  else apsFor(place.w)[place.d+'|'+place.s]=ap;
  S.mapped[f.uid]={w:place.w,day:place.d,slot:place.s,auto:1};
  wdAssignWriteback(ap,String(place.s),true);
}
/* Zuordnung in den Kalender zurückschreiben: das FREMDE Event selbst bekommt
   CATEGORIES:LR-ASSIGNED + X-LR-SLOT — Summary und Uhrzeiten bleiben exakt gleich. */
async function wdAssignWriteback(ap,slotTag,quiet){
  const c=wdCfg(); if(!ap.remoteUid||!c.cal)return;
  try{
    const href=c.cal+encodeURIComponent(ap.remoteUid)+'.ics';
    const r=await wdFetch(href,{method:'GET'});
    if(!r.ok){if(!quiet)toast('Markierung im Kalender nicht möglich (HTTP '+r.status+').'); return}
    const lines=(await r.text()).replace(/\r/g,'').split('\n');
    const out=[]; let inEv=false, hasCat=false, touched=false;
    for(const l of lines){
      const tr=l.trim();
      if(tr==='BEGIN:VEVENT'){inEv=true; hasCat=false; out.push(l); continue}
      if(tr==='END:VEVENT'){
        out.push('X-LR-SLOT:'+slotTag);
        if(!hasCat)out.push('CATEGORIES:LR-ASSIGNED');
        inEv=false; out.push(l); touched=true; continue}
      if(inEv){
        if(/^CATEGORIES/i.test(l)){hasCat=true; out.push(/LR-ASSIGNED/i.test(l)?l:l+',LR-ASSIGNED'); continue}
        if(/^X-LR-SLOT/i.test(l))continue;
      }
      out.push(l);
    }
    if(!touched){if(!quiet)toast('Eintrag für die Markierung nicht gefunden.'); return}
    const p=await wdFetch(href,{method:'PUT',headers:{'Content-Type':'text/calendar; charset=utf-8'},body:out.join('\r\n')});
    if(!quiet)toast(p.ok?'Zuordnung im Kalender markiert — Titel und Uhrzeiten unverändert.':'Markierung nicht möglich (HTTP '+p.status+').');
  }catch(e){if(!quiet)toast('Markierung nicht möglich (Netzwerk).')}
}
function processRemote(txt){
  let placed=0,queued=0;
  for(const f of classifyRemote(txt)){

function parseICSAll(text){

    else if(tr.indexOf('END:')===0){const v=tr.slice(4).trim().toUpperCase(); if(cur){if(v==='VEVENT')evs.push(cur); else if(v==='VTODO')todos.push(cur); else if(v==='VJOURNAL')journals.push(cur)} cur=null}

  if(est.simple)return 'S:'+(+est.simple||0);

function todoSig(t){

function applyServerTodo(t,e){

  const kan=(e['X-LR-KAN']||'').trim();

  else{t.done=false; t.kanban=kan&&KCOLS.some(k=>k[0]===kan)?kan:(/IN-PROCESS/i.test(e.STATUS||'')?'arbeit':'offen')}

  else if(isTheo)t.delegated=null;

function processTodos(text){
  const res=parseICSAll(text); let upd=0,imp=0;
  for(const e of res.todos){
    const u=(e.UID||'').trim(); if(!u)continue;
    if(tombDead(u)){wdDeleteUid(u); continue} /* Grabstein: gelöscht — Import überspringen, DELETE wiederholen */
    let t=null, inTasks=false;
    const m=u.match(/^theo-todo-(.+)@theo-app$/);
    if(m){const f=findTodo(m[1]); if(f)t=f.t; else{const st=S.tasks.find(x=>x.id===m[1]); if(st){t=st; inTasks=true}}}
    if(!t){t=S.tasks.find(x=>x.remoteUid===u)||null;
      if(!t)for(const p of S.projects){const tt=p.todos.find(x=>x.remoteUid===u); if(tt){t=tt; break}}}
    if(t){
      if(applyServerTodo(t,e))upd++;

    }
    else if(m){

         bereits synchronisierte/alte Leichen ohne LR-TODO nicht wiederbeleben */
      if(!/LR-TODO/i.test(e.CATEGORIES||'')||S.synced['theo-todo-'+m[1]])continue;
      const nt={id:m[1],title:'Aufgabe',done:false,planned:null};
      applyServerTodo(nt,e);
      const pid=(e['X-LR-PROJECT']||'').trim();
      const prj=pid?projOf(pid):null;
      if(prj)prj.todos.push(nt); else S.tasks.push(nt);
      S.synced['theo-todo-'+m[1]]=1;
      imp++;
    }
    else{
      let due=''; for(const k in e){if(k.toUpperCase().indexOf('DUE')===0)due=e[k]}
      const dsc=e.DESCRIPTION?icsUnesc(e.DESCRIPTION):'';
      const nt={id:uid(),title:e.SUMMARY?icsUnesc(e.SUMMARY):'Aufgabe (aus Kalender)',done:/COMPLETED/i.test(e.STATUS||''),planned:null,due:fromIcsDate(due)||null,remoteUid:u};
      if(nt.done)nt.kanban='fertig';
      const fs=dsc.replace(/^Erster Schritt:\s*/,'').trim();
      if(fs)nt.firstStep=fs;
      S.tasks.push(nt); imp++;
    }
  }
  return {updated:upd,imported:imp};
}

    }else if((m=uid.match(/^theo-appt-(\d{4}-\d{2}-\d{2})-(\d)-(\d)$/))){

const SYNC={timer:null,running:false,last:null,msg:'',capJson:null,capMode:null,capFor:null};
function resetCapCache(cal){if(SYNC.capFor!==cal){SYNC.capFor=cal; SYNC.capMode=null}}
async function putCapsule(cal,cobj){
  resetCapCache(cal);
  const body=capsuleICS(cobj), hdr={'Content-Type':'text/calendar; charset=utf-8'}, fn=encodeURIComponent(CAP_UID)+'.ics';
  if(SYNC.capMode!=='sub'){
    const r=await wdFetch(cal+fn,{method:'PUT',headers:hdr,body:body});
    if(r.ok||r.status===201||r.status===204){SYNC.capMode='direct'; return {ok:true,status:r.status,text:'',sub:false}}
    const txt=await wdBody(r);
    const compRej=r.status===400||r.status===415||r.status===501||(r.status===403&&!/throttl|brute|zu viele/i.test(txt));
    if(!compRej)return {ok:false,status:r.status,text:txt,sub:false};
  }
  const sub=capCalHref(cal);
  if(!sub)return {ok:false,status:403,text:'Kalender akzeptiert kein VJOURNAL.',sub:false};
  const r2=await wdFetch(sub+fn,{method:'PUT',headers:hdr,body:body});
  if(r2.ok||r2.status===201||r2.status===204){SYNC.capMode='sub'; return {ok:true,status:r2.status,text:'',sub:true}}
  const t2=await wdBody(r2);
  if(r2.status===404||r2.status===409||r2.status===400||r2.status===403){
    const mkXml='<?xml version="1.0" encoding="utf-8"?><c:mkcalendar xmlns:d="DAV:" xmlns:c="urn:ietf:params:xml:ns:caldav"><d:set><d:prop><d:displayname>Theo Kapsel</d:displayname><c:supported-calendar-component-set><c:comp name="VJOURNAL"/></c:supported-calendar-component-set></d:prop></d:set></c:mkcalendar>';
    const mk=await wdFetch(sub,{method:'MKCALENDAR',headers:{'Content-Type':'application/xml; charset=utf-8'},body:mkXml});
    if(mk.ok||mk.status===201||mk.status===405){
      const r3=await wdFetch(sub+fn,{method:'PUT',headers:hdr,body:body});
      if(r3.ok||r3.status===201||r3.status===204){SYNC.capMode='sub'; return {ok:true,status:r3.status,text:'',sub:true}}
      return {ok:false,status:r3.status,text:await wdBody(r3),sub:true};
    }
    return {ok:false,status:mk.status,text:await wdBody(mk),sub:true};
  }
  return {ok:false,status:r2.status,text:t2,sub:true};
}
async function pullCapsule(cal,exportTxt){
  resetCapCache(cal);
  const cp=processCapsule(exportTxt);
  if(cp.ts>0){SYNC.capMode='direct'; return {adopted:cp.adopted,ts:cp.ts,checked:true,sub:false}}
  if(SYNC.capMode==='direct')return {adopted:false,ts:0,checked:true,sub:false};
  const sub=capCalHref(cal);
  if(!sub)return {adopted:false,ts:0,checked:true,sub:false};
  try{
    const r=await wdFetch(sub+encodeURIComponent(CAP_UID)+'.ics',{method:'GET'});
    if(r.ok){
      const cp2=processCapsule(await r.text());
      if(cp2.ts>0){SYNC.capMode='sub'; return {adopted:cp2.adopted,ts:cp2.ts,checked:true,sub:true}}
      return {adopted:false,ts:0,checked:true,sub:false};
    }
    if(r.status===404)return {adopted:false,ts:0,checked:true,sub:false};
    return {adopted:false,ts:0,checked:false,sub:false};
  }catch(e){return {adopted:false,ts:0,checked:false,sub:false}}
}

/* Schreibt den aktuellen Zustand (VEVENTs, VTODOs, Kapsel, Aufräumen) — nur Push, kein Pull */
async function pushAll(){
  const c=wdCfg(); const cal=c.cal;
  const cal2=(c.cal2&&c.cal2!==c.cal)?c.cal2:null;
  const main=buildEvents('main'), ph=buildEvents('phases'), tds=buildTodos();
  const allUids=main.concat(ph,tds).map(e=>String(e.uid).split('@')[0]);
  let ok=0, fail=0;
  await pruneSynced(allUids);
  for(const ev of main){try{const r=await wdFetch(cal+encodeURIComponent(ev.uid)+'.ics',{method:'PUT',headers:{'Content-Type':'text/calendar; charset=utf-8'},body:ev.text}); if(r.ok)ok++; else fail++}catch(e){fail++}}
  if(ph.length)for(const ev of ph){const href=cal2||cal; try{const r=await wdFetch(href+encodeURIComponent(ev.uid)+'.ics',{method:'PUT',headers:{'Content-Type':'text/calendar; charset=utf-8'},body:ev.text}); if(r.ok)ok++; else fail++}catch(e){fail++}}
  for(const ev of tds){try{const r=await wdFetch(cal+encodeURIComponent(ev.uid)+'.ics',{method:'PUT',headers:{'Content-Type':'text/calendar; charset=utf-8'},body:ev.text}); if(r.ok)ok++; else fail++}catch(e){fail++}}
  registerSynced(main); registerSynced(ph); registerSynced(tds);
  try{
    const cobj=capsuleJson(); const cstr=JSON.stringify(cobj);
    /* Neugeräte-Schutz: wer noch nie aus dem Kalender gelesen hat, darf seine
       (leere) Kapsel nicht über die volle Server-Kapsel schreiben. */
    if(S.meta.pulled!==false&&cstr!==SYNC.capJson){
      const cr=await putCapsule(cal,cobj);
      if(cr.ok){SYNC.capJson=cstr; ok++}
      else fail++;
    }
  }catch(e){fail++}
  if(fail===0&&S.meta.dirty){S.meta.dirty=false; saveQuiet()}
  return {ok:ok, fail:fail};
}
/* Direkter Push: jede Änderung (save()) schreibt nach kurzer Entprellung sofort */
let pushTimer=null;
function schedulePush(){
  const c=wdCfg();
  if(!c.url||!c.user||!c.pass||!c.cal)return;
  if(pushTimer)clearTimeout(pushTimer);
  pushTimer=setTimeout(async function(){
    pushTimer=null;
    if(SYNC.running){schedulePush(); return}
    SYNC.running=true;
    try{
      const r=await pushAll();
      SYNC.last=new Date();
      SYNC.msg='⏏ direkt gepusht '+r.ok+(r.fail?' / ✖ '+r.fail:'');
      if(!$('#overlay').classList.contains('on'))render();
    }catch(e){SYNC.msg='Push-Fehler: '+String(e&&e.message||e)}
    finally{SYNC.running=false}
  },2500);
}
async function syncCycle(){
  if(SYNC.running)return;
  const c=wdCfg();
  if(!c.url||!c.user||!c.pass||!c.cal)return;
  const cal=c.cal;
  const cal2=(c.cal2&&c.cal2!==c.cal)?c.cal2:null;
  SYNC.running=true;
  try{
    const base=wdBase();
    const px=await detectProxy();
    if(px&&px.target&&base.toLowerCase().indexOf(px.target.toLowerCase())!==0){
      SYNC.msg='Companion-Ziel ('+px.target+') ≠ eingetragene URL — bitte anpassen'; return;
    }
    const rev=S.capsuleTs||0;
    let m='';
    /* Neugeräte-Schutz: ein frisch verbundenes Gerät ist zwar „dirty“ (nur durch
       das Speichern der Verbindung) — aber es darf nicht VOR dem ersten Lesen
       seine leere Kapsel hochschreiben, sonst plättet sie die volle Server-Kapsel. */
    if(S.meta.dirty && S.meta.pulled!==false){
      const pr=await pushAll();
      m='geschrieben '+pr.ok+(pr.fail?' / ✖ '+pr.fail:'');
      if((S.capsuleTs||0)!==rev)S.meta.dirty=true; /* während des Pushes weitereditiert */
    }
    if((S.capsuleTs||0)!==rev){
      /* Pull würde frische lokale Änderungen mit dem alten Serverstand überschreiben — nächsten Zyklus warten */
      SYNC.last=new Date();
      SYNC.msg=(m?m+' · ':'')+'Pull übersprungen — lokale Änderungen werden zuerst gepusht';
      return;
    }
    const r=await wdFetch(cal+'?export',{method:'GET'});
    if(r.ok){
      const txt=await r.text();
      importICS(txt);
      const pr=processRemote(txt);
      const cp=await pullCapsule(cal,txt);
      const tr=processTodos(txt);
      if(!S.meta.pulled&&cp.checked)S.meta.pulled=true; /* ab jetzt darf dieses Gerät schreiben */
      if(!cp.ts&&cp.checked&&S.meta.pulled&&SYNC.capJson===null&&hasCapsuleContent())S.meta.dirty=true; /* Erst-Nachschub für Quellgerät, falls Server noch keine Kapsel hat */
      let txt2='';
      if(cal2){const r2=await wdFetch(cal2+'?export',{method:'GET'}); if(r2.ok){txt2=await r2.text(); importICS(txt2)}}
      reconcileDeleted([txt,txt2]);
      SYNC.last=new Date();
      m=(m?m+' · ':'')+'gelesen'+(pr.placed?' · '+pr.placed+' eingeordnet':'')+(pr.queued?' · 📥 '+pr.queued+' zuzuordnen':'')+(tr.updated?' · '+tr.updated+' To-dos aktualisiert':'')+(tr.imported?' · '+tr.imported+' Aufgaben aus Kalender':'')+(cp.adopted?' · Kapsel übernommen':'');
      saveQuiet();
      if(S.meta.dirty && S.meta.pulled!==false){ /* Erstverbindung / fehlende Server-Kapsel: Nachzieh-Schreiben im selben Zyklus */
        const pr2=await pushAll();
        m=(m?m+' · ':'')+'geschrieben '+pr2.ok+(pr2.fail?' / ✖ '+pr2.fail:'');
      }
      SYNC.msg=m;
      if(!$('#overlay').classList.contains('on'))render();
    }else{
      SYNC.msg='Lesen scheiterte (HTTP '+r.status+')';
    }
  }catch(e){SYNC.msg='Sync-Fehler: '+String(e&&e.message||e)}
  finally{SYNC.running=false}
}

function parseCals(xml){
  const out=[]; if(!xml)return out;
  const parts=xml.split(/<(?:[A-Za-z0-9]+:)?response[>\s]/i);
  for(const b of parts){
    const rt=b.search(/<(?:[A-Za-z0-9]+:)?resourcetype/i);
    if(rt<0)continue;
    if(!/<(?:[A-Za-z0-9]+:)?calendar\s*\/?>/i.test(b.slice(rt)))continue;
    const href=(b.match(/<(?:[A-Za-z0-9]+:)?href>\s*([^<]+?)\s*<\//i)||[])[1];
    if(!href||/\.ics$/i.test(href)||/\/theo-kapsel\/?$/i.test(href))continue;
    const name=(b.match(/<(?:[A-Za-z0-9]+:)?displayname>\s*([^<]+?)\s*<\//i)||[])[1];
    out.push({href:href.endsWith('/')?href:href+'/',name:name||decodeURIComponent((href.replace(/\/+$/,'').split('/').pop()||'Kalender'))});
  }
  return out;
}

function renderGantt(p){
  const items=[];
  for(const t of p.todos){
    if(t.done)continue;
    const E=estDays(t);
    const span=Math.max(1,Math.ceil(E)||1);
    const st=t.start||todayISO();
    const en=iso(addDays(parseISO(st),span-1));
    items.push({t:t,st:st,en:en,du:t.due||null,span:span,E:E});
  }
  const today=todayISO();
  let min=today, max=today;
  items.forEach(it=>{
    if(it.st<min)min=it.st; if(it.en>max)max=it.en;
    if(it.du){if(it.du>max)max=it.du; if(it.du<min)min=it.du}
    if(it.st>max)max=it.st;
  });
  let s0=iso(addDays(parseISO(min),-2)), s1=iso(addDays(parseISO(max),4));
  if(!items.length){s0=iso(addDays(new Date(),-2)); s1=iso(addDays(new Date(),17))}
  const N=Math.min(140,Math.round((parseISO(s1)-parseISO(s0))/86400000)+1);
  const D=36, LW=220;
  let h='<div class="gcap"><span class="gi"><span style="display:inline-block;width:26px;height:10px;border-radius:5px;background:#CBB389"></span> geschätzte Dauer</span><span class="gi" style="color:#4A453C">▼ Deadline (bleibt fix)</span><span class="gi"><span style="display:inline-block;width:2px;height:12px;background:#C98D76"></span> heute</span><span class="gi">Leiste ziehen (Desktop) oder ‹ › — verschiebt nur den Start.</span></div>';
  h+='<div class="ganttWrap"><div class="gantt" style="width:'+(LW+N*D)+'px">';
  h+='<div class="ghead"><div class="gheadLbl">Vorhaben</div><div class="gheadTrack" style="width:'+(N*D)+'px">';
  for(let i=0;i<N;i++){
    const dstr=iso(addDays(parseISO(s0),i)), dt=parseISO(dstr);
    h+='<div class="gday'+(dayIdx(dt)>=5?' wknd':'')+(dstr===today?' today':'')+'">'+dt.getDate()+'<br>'+DAYSHORT[dayIdx(dt)]+'</div>';
  }
  h+='</div></div>';
  if(!items.length)h+='<div class="grow"><div class="growLbl sub" style="width:'+LW+'px">Noch keine offenen Vorhaben — Zeitachse leer.</div><div class="growTrack" style="width:'+(N*D)+'px"></div></div>';
  items.forEach(it=>{
    const i0=Math.round((parseISO(it.st)-parseISO(s0))/86400000);
    const len=it.span;
    const ar=areaOf(p);
    h+='<div class="grow"><div class="growLbl"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1" title="'+esc(it.t.title)+'">'+esc(it.t.title)+'</span><span class="pc">'+(it.E?'≈'+(Math.round(it.E*10)/10)+' T':'—')+(it.t.delegated?' · ↗':'')+'</span><span class="gmove"><button class="xbtn" data-act="ganttMove" data-pid="'+p.id+'" data-tid="'+it.t.id+'" data-d="-1" title="1 Tag früher">‹</button><button class="xbtn" data-act="ganttMove" data-pid="'+p.id+'" data-tid="'+it.t.id+'" data-d="1" title="1 Tag später">›</button></span></div>'+
      '<div class="growTrack" style="width:'+(N*D)+'px">';
    for(let i=0;i<N;i++){
      const dstr=iso(addDays(parseISO(s0),i));
      h+='<div class="gcell'+(dayIdx(parseISO(dstr))>=5?' wknd':'')+'" style="left:'+(i*D)+'px" data-drop="g" data-date="'+dstr+'"></div>';
    }
    h+='<div class="gbar" style="left:'+(i0*D+2)+'px;width:'+(len*D-4)+'px;background:'+(ar?ar.color:'#CBB389')+'" draggable="true" data-drag="gtodo:'+p.id+'|'+it.t.id+'" data-act="editTodoSheet" data-kind="todo" data-id="'+it.t.id+'" title="Klicken: Vorhaben bearbeiten · ziehen oder ‹ ›: Start verschieben"><span class="gbt">'+esc(it.t.title.slice(0,Math.max(0,Math.floor((len*D-20)/6.2))))+'</span></div>';
    if(it.du){
      const iD=Math.round((parseISO(it.du)-parseISO(s0))/86400000);
      if(iD>=0&&iD<N)h+='<div class="gdue" style="left:'+((iD+1)*D-8)+'px"></div>';
    }
    if(today>=s0&&today<=s1){
      const iT=Math.round((parseISO(today)-parseISO(s0))/86400000);
      h+='<div class="gtoday" style="left:'+(iT*D+D/2)+'px"></div>';
    }
    h+='</div></div>';
  });
  h+='</div></div>';
  h+='<div class="sub" style="margin-top:8px">Die Balkenlänge folgt deiner <b>Zeitschätzung</b> (Vorhaben-Editor: einfach in Tagen oder <b>PERT: (to + 4·tm + tp) / 6</b>) — nicht der Deadline. Ohne Schätzung zählt ein Tag als Minimalmarke. Verschieben ändert <b>nur das Startdatum</b>; die ▼-Deadline bleibt stehen (überfällig wird sie weiter als Marke gezeigt).</div>';
  return h;
}

function renderAgenda(){
  const t=todayISO();
  const w0=iso(mondayOf(new Date())), wEnd=iso(addDays(parseISO(w0),6));
  const mon=t.slice(0,7);
  if(!ui.agRange)ui.agRange='woche';
  const items=allApptItems();
  const monEnd=iso(new Date(new Date().getFullYear(),new Date().getMonth()+1,0));
  /* Zähler und Filter verwenden dieselben (inklusiven) Zeiträume — die Zahl am Chip ist immer exakt das, was die Liste zeigt */
  const inRange=(d,r)=>{
    if(r==='heute')return d===t;
    if(r==='woche')return d>=w0&&d<=wEnd;
    if(r==='monat')return d.slice(0,7)===mon;
    return d>monEnd;
  };
  const counts={heute:0,woche:0,monat:0,spaeter:0};
  items.forEach(it=>{const d=it.date; for(const r in counts)if(inRange(d,r))counts[r]++});
  const inR=it=>inRange(it.date,ui.agRange);
  let h='<div class="card upcard"><div class="fh2" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span>📅 Termine</span><span class="pc">alle Kalendereinträge im Blick</span></div>';
  const phsT=activePhases(todayISO());
  if(phsT.length)h+='<div class="sub" style="margin:0 0 8px">🍂 Aktive Phase'+(phsT.length>1?'n (überlappend)':'')+': <b>'+esc(phsT.map(x=>x.title).join(' | '))+'</b></div>';
  h+='<div class="chips">'+[['heute','Heute'],['woche','Woche'],['monat','Monat'],['spaeter','Später']].map(r=>'<button class="chip'+(ui.agRange===r[0]?' on':'')+'" data-act="agRange" data-r="'+r[0]+'">'+r[1]+' ('+counts[r[0]]+')</button>').join('')+'</div>';
  const vis=items.filter(inR);
  if(!vis.length)h+='<div class="sub">Keine Termine in diesem Zeitraum — ruhig hier.</div>';
  vis.forEach(it=>{
    if(it.bl){
      const ty=it.bl.typeId?typeOf(it.bl.typeId):null;
      const blTitle=it.bl.kind==='projekt'&&projOf(it.bl.projectId)?projOf(it.bl.projectId).name:(it.bl.title||'Block');
      h+='<div class="agRow" data-act="openBlockW" data-w="'+it.w+'" data-day="'+it.day+'" data-slot="'+it.slot+'"><span class="agD">'+esc(fmtDate(parseISO(it.date)))+'</span><span class="agT">'+(ty?ty.emoji+' ':'')+esc(blTitle)+'</span>'+ampDot(it.bl.ampel)+'<span class="pc">'+(it.bl.t0?esc(apTimeStr(it.bl.t0,it.bl.t1)):SLOTS[it.slot].ico+' '+slotWin(it.slot).s+'–'+slotWin(it.slot).e)+(it.bl.span>1?' · '+it.bl.span+' Blöcke':'')+'</span></div>';
    }else{
      h+='<div class="agRow" data-act="openAppt" data-id="'+it.ap.id+'"><span class="agD">'+esc(fmtDate(parseISO(it.date)))+'</span><span class="agT">'+esc(it.ap.title)+'</span>'+ampDot(it.ap.ampel)+'<span class="pc">'+esc(it.ap.time||'')+(it.ap.span>1?' · '+it.ap.span+' Blöcke':'')+'</span></div>';
    }
  });
  h+='<div class="sheetBtns"><button class="btn" data-act="newAppt">＋ Termin (auch später)</button></div></div>';
  return h;
}

function allApptItems(){
  const out=[];
  for(const w in S.appts){
    const aps=S.appts[w];
    for(const k in aps){
      const ap=aps[k];
      const date=iso(addDays(parseISO(w),ap.day));
      out.push({w:w,day:ap.day,slot:ap.slot,ap:ap,date:date});
      if(ap.stack)ap.stack.forEach(sa=>out.push({w:w,day:sa.day,slot:sa.slot,ap:sa,date:date}));
    }
  }
  /* Blocktypen mit „wie Termin“-Flag (z. B. 1:1-Termin) erscheinen ebenfalls bei Termine */
  for(const w in S.blocks){
    const bs=S.blocks[w];
    for(const k in bs){
      const bl=bs[k];
      const ty=bl.typeId?typeOf(bl.typeId):null;
      if(!ty||!ty.asAppt)continue;
      const p=k.split('|');
      const date=iso(addDays(parseISO(w),+p[0]));
      out.push({w:w,day:+p[0],slot:+p[1],bl:bl,date:date});
    }
  }
  out.sort((x,y)=>x.date<y.date?-1:(x.date>y.date?1:(x.slot-y.slot)));
  return out;
}

function slotCell(d,s,cur,tI,mobile){
  const key=d+'|'+s;
  const ap=getAppts()[key], bl=getBlocks()[key];
  const stack=[].concat((ap&&ap.stack)||[],(bl&&bl.stack)||[]);
  if(ap){
    let h='<div class="slot">'+apptCard(ap);
    stack.forEach(sa=>{h+=stackCard(sa)});
    return h+'</div>';
  }
  if(bl){
    let h='<div class="slot" data-drop="w'+d+'s'+s+'">'+blockCard(bl,d,s);
    stack.forEach(sa=>{h+=stackCard(sa)});
    return h+'</div>';

  const cov=coveredByW(wk(),d,s);
  if(cov)return '<div class="slot spancont">┃ belegt durch „'+esc(cov.title)+'“ ('+SLOTS[cov.slot].label+')</div>';
  return '<div class="slot free" data-drop="w'+d+'s'+s+'" data-act="openSlot" data-day="'+d+'" data-slot="'+s+'" role="button"><span class="plus">＋</span><span class="fl">belegen</span></div>';

        '<select class="inp slim" data-field="kanState" data-tid="'+t.id+'" title="Status — Liste und Kanban sind gekoppelt">'+KCOLS.map(k=>'<option value="'+k[0]+'"'+(kanOf(t)===k[0]?' selected':'')+'>'+k[1]+'</option>').join('')+'</select>'+
        (t.firstStep&&!t.done?'<span class="firstStep" style="flex-basis:100%">→ '+esc(t.firstStep)+'</span>':'')+
        dueChip(t.due,'data-act="editTodoSheet" data-kind="todo" data-id="'+t.id+'"')+
        (t.planned?'<button class="chip mini" data-act="unplanTodo" data-id="'+t.id+'" title="Planung lösen">📅 '+esc(fmtPlanChip(t.planned))+' ✕</button>':'<button class="chip mini" data-act="planTodo" data-id="'+t.id+'">📅 in Block planen</button>')+
        '<button class="xbtn" data-act="delTodo" data-id="'+t.id+'">✕</button></div>';

  }else if(tab==='kanban'){
    h+='<div class="kscroll"><div class="kb">';

      h+='<div class="kcol" data-drop="k'+col+'"><div class="kname"><span>'+c[1]+'</span><span class="pc">'+items.length+'</span></div>';
      items.forEach(t=>{
        h+='<div class="card kcard" draggable="true" data-drag="todo:'+p.id+'|'+t.id+'" data-act="kanCard" data-tid="'+t.id+'"><div class="brow"><span class="bttl">'+esc(t.title)+'</span>'+(t.planned?'<span class="btime">📅</span>':'')+'</div>'+
          (t.delegated?'<div class="bnote">↗ '+esc(t.delegated)+'</div>':'')+
          (t.planned?'<div class="bnote">📅 '+esc(fmtPlanChip(t.planned))+'</div>':'')+
          (fmtEst(t)?'<div class="bnote">'+fmtEst(t)+(t.due?' · 🕐 '+esc(relDue(t.due)):'')+'</div>':'')+'</div>';
      });

    h+=renderGantt(p);

  return h;
}

function renderInbox(){
  let h='<div class="vhead"><div><h1>Eingangskiste</h1><div class="sub">Hier darf alles liegen, was im Kopf herumläuft. Sortieren kann warten — nichts wird „fällig".</div></div></div>';
  h+='<div class="card capCard"><div class="capKinds">'+Object.keys(INBKINDS).map(k=>'<button class="chip'+(ui.inbKind===k?' on':'')+'" data-act="inbKind" data-k="'+k+'">'+INBKINDS[k][0]+' '+INBKINDS[k][1]+'</button>').join('')+'</div>'+
    '<input class="inp" id="inb-inp" placeholder="Gedanke, Aufgabe, Idee, Alltagskram …" data-enter="inbAdd"><div class="sub" style="margin-top:8px">Enter oder unten ablegen. Nichts hier muss je sortiert werden.</div>'+
    '<div class="sheetBtns"><button class="btn primary" data-act="inbAdd">Ablegen</button></div></div>';
  const kinds=[['alle','Alles']].concat(Object.keys(INBKINDS).map(k=>[k,INBKINDS[k][1]]));
  const cnt=f=>f==='alle'?S.inbox.length:S.inbox.filter(i=>i.kind===f).length;
  h+='<div class="capTools"><input class="inp" id="inb-q" placeholder="🔍 Durchsuchen …" value="'+esc(ui.inbQ)+'" data-field="inbQ"><div class="chips" style="margin:0">'+kinds.map(k=>'<button class="chip'+(ui.inbF===k[0]?' on':'')+'" data-act="inbFilter" data-f="'+k[0]+'">'+k[1]+' ('+cnt(k[0])+')</button>').join('')+'</div></div>';
  const q=ui.inbQ.trim().toLowerCase();
  const items=S.inbox.filter(it=>(ui.inbF==='alle'||it.kind===ui.inbF)&&(!q||it.text.toLowerCase().includes(q)));
  if(!S.inbox.length)h+='<div class="card"><div class="sub">Alles abgeflossen oder gerade nichts Neues — beides ist okay. 🌿</div></div>';
  else if(!items.length)h+='<div class="card"><div class="sub">Nichts gefunden — Filter lockern oder Suchbegriff ändern?</div></div>';
  items.forEach(it=>{
    h+='<div class="card inbItem"><div class="inbKind">'+INBKINDS[it.kind][0]+' '+INBKINDS[it.kind][1]+' · '+esc(it.ts||'')+'</div><div class="inbText">'+esc(it.text)+'</div>'+
      '<div class="inbActs"><button class="btn mini" data-act="inbEdit" data-id="'+it.id+'" title="bearbeiten">✎</button><button class="btn mini" data-act="inbConvert" data-id="'+it.id+'" data-target="task" title="mit Einstellungen umwandeln">→ Aufgabe</button><button class="btn mini" data-act="inbConvert" data-id="'+it.id+'" data-target="todo">→ Projekt-To-do</button><button class="btn mini" data-act="inbConvert" data-id="'+it.id+'" data-target="block">→ Block</button><button class="xbtn" data-act="inbDel" data-id="'+it.id+'" title="weglassen">✕</button></div></div>';
  });
  return h;
}

  return h;
}

function closeModal(){$('#overlay').classList.remove('on'); $('#overlay').innerHTML=''; ui.ampCtx=null; ui.ampSel=null; ui.ampSelK=null}
function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800)}

function sheetTypeAppt(d,s,tid,span){
  const t=typeOf(tid); if(!t)return;
  let h='<div class="shead"><h3>'+t.emoji+' '+esc(t.name)+'</h3><div class="sub">'+esc(fmtDaySlot(d,s))+' — dieser Typ ist „wie ein Termin“: er erscheint auch unten bei Termine.</div></div>';
  h+='<label class="f">Titel</label><input class="inp" id="ta-title" value="'+esc(t.name)+'">';
  h+='<label class="f">Uhrzeit (optional — ohne Angabe zählt das Blockfenster)</label><div class="row2"><input class="inp slim" type="time" id="ta-t0" style="flex:1;min-width:110px"><span class="pc">–</span><input class="inp slim" type="time" id="ta-t1" style="flex:1;min-width:110px"></div>';
  h+='<label class="f">Dauer</label><select class="inp slim" id="ta-span">'+[1,2,3].map(v=>'<option value="'+v+'"'+(v===span?' selected':'')+'>'+(v===1?'1 Block':(v===2?'2 Blöcke':'3 Blöcke — ganzer Tag'))+'</option>').join('')+'</select>';
  h+='<div class="sheetBtns"><button class="btn primary" data-act="typeApptSave" data-day="'+d+'" data-slot="'+s+'" data-tid="'+tid+'">Eintragen</button><button class="btn ghost" data-act="closeModal">Abbrechen</button></div>';
  openSheet(h);
}

function sheetSlot(d,s){
  let h='<div class="shead"><h3>Block belegen</h3><div class="sub">'+esc(fmtDaySlot(d,s))+' — ein Block, normalerweise ein Schwerpunkt.</div></div>';
  h+='<div class="stack">'+S.types.map(t=>'<button class="typeB" data-act="fillType" data-day="'+d+'" data-slot="'+s+'" data-tid="'+t.id+'"><span class="bico">'+t.emoji+'</span><span style="flex:1">'+esc(t.name)+'</span>'+(t.ampel&&t.ampel!=='none'?ampDot(t.ampel):'')+'</button>').join('')+'</div>';
  h+='<label class="f">Dauer</label><select class="inp slim" id="f-span"><option value="1">1 Block</option><option value="2">2 Blöcke (z. B. Vormittag + Mittag)</option><option value="3">3 Blöcke — ganzer Tag (z. B. Workshop)</option></select>';
  h+='<div class="fh">Projekt</div>';
  S.areas.forEach(a=>{
    const ps=S.projects.filter(p=>p.areaId===a.id);
    if(!ps.length)return;
    h+='<div class="fh2">'+a.emoji+' '+esc(a.name)+'</div><div class="chips">'+ps.map(p=>'<button class="chip" data-act="fillProject" data-day="'+d+'" data-slot="'+s+'" data-pid="'+p.id+'">'+(p.emoji||'📋')+' '+esc(p.name)+'</button>').join('')+'</div>';
  });
  const loose=S.projects.filter(p=>!p.areaId);
  if(loose.length)h+='<div class="chips">'+loose.map(p=>'<button class="chip" data-act="fillProject" data-day="'+d+'" data-slot="'+s+'" data-pid="'+p.id+'">'+(p.emoji||'📋')+' '+esc(p.name)+'</button>').join('')+'</div>';
  h+='<div class="fh">Termin eintragen — auch für spätere Wochen &amp; Monate</div>';
  h+='<input class="inp" id="ap-title" placeholder="Titel des Termins">';
  h+='<div class="row2"><input class="inp slim" type="date" id="ap-date" value="'+iso(addDays(ui.anchor,d))+'" style="flex:1;min-width:145px"><input class="inp slim" type="time" id="ap-t0" style="flex:1;min-width:100px"><span class="pc">–</span><input class="inp slim" type="time" id="ap-t1" style="flex:1;min-width:100px"><select class="inp slim" id="f-span" style="flex:1;min-width:100px"><option value="1">1 Block</option><option value="2">2 Blöcke</option><option value="3">3 Blöcke</option></select></div>';
  h+='<div class="row2"><select class="inp slim" id="ap-ampel" style="flex:1;min-width:150px"><option value="">Ampel: keine</option>'+AMPKEYS.map(v=>'<option value="'+v+'">'+AMP[v].label+'</option>').join('')+'</select><select class="inp slim" id="ap-type" style="flex:1;min-width:150px"><option value="">Typ: keiner</option>'+S.types.map(t=>'<option value="'+t.id+'">'+t.emoji+' '+esc(t.name)+'</option>').join('')+'</select></div>';
  h+='<div class="sheetBtns"><button class="btn" data-act="addAppt" data-day="'+d+'" data-slot="'+s+'">Termin hinzufügen</button><button class="btn ghost" data-act="closeModal">Abbrechen</button></div>';
  openSheet(h);
}

function sheetBlock(d,s,w){
  const W=w||wk();
  const bl=blocksFor(W)[d+'|'+s]; if(!bl)return;
  const p=bl.projectId?projOf(bl.projectId):null;
  const td=bl.todoId?findTodo(bl.todoId):null;
  const ty=bl.typeId?typeOf(bl.typeId):null;
  let h='<div class="shead"><h3>'+esc(bl.kind==='projekt'&&p?p.name:bl.title)+'</h3><div class="sub">'+esc(fmtDaySlotW(W,d,s))+' · '+(bl.kind==='projekt'?'Projektblock'+(p?' — '+esc(p.name):''):(bl.kind==='task'?'Aufgabenblock':'Blocktyp: '+(ty?esc(ty.name):'frei definiert')))+(bl.span>1?' · über '+bl.span+' Blöcke':'')+'</div></div>';
  if(bl.kind==='projekt'){
    h+='<label class="f">Erster Schritt — macht den Einstieg billiger (optional)</label><input class="inp" id="b-note" value="'+esc(bl.note||'')+'" placeholder="z. B. nur die Überschrift schreiben, erst Materialsammlung">';
  }else{
    h+='<label class="f">Titel — frei benennbar</label><input class="inp" id="b-title" value="'+esc(bl.title||'')+'" placeholder="z. B. Spazieren am Aasee, lesen, schwimmen">';
    h+='<label class="f">Erster Schritt — macht den Einstieg billiger (optional)</label><input class="inp" id="b-note" value="'+esc(bl.note||'')+'" placeholder="Was genau? z. B. erst Kaffee, dann 30 Min. lesen">';
  }
  h+='<label class="f">Blocktyp (optional — beim Speichern gibt er einen Ampel-Vorschlag)</label><select class="inp" id="b-type"><option value="">— frei definiert —</option>'+S.types.map(t=>'<option value="'+t.id+'"'+(bl.typeId===t.id?' selected':'')+'>'+t.emoji+' '+esc(t.name)+'</option>').join('')+'</select>';
  if(ty&&ty.asAppt){
    h+='<label class="f">Start-/Endzeit (optional — „wie Termin“: ohne Angabe zählt das Blockfenster)</label><div class="row2"><input class="inp slim" type="time" id="b-t0" value="'+esc(bl.t0||'')+'" style="flex:1;min-width:110px"><span class="pc">–</span><input class="inp slim" type="time" id="b-t1" value="'+esc(bl.t1||'')+'" style="flex:1;min-width:110px"></div>';
  }
  const tk=bl.taskId?S.tasks.find(x=>x.id===bl.taskId):null;
  if(tk)h+='<label class="checkrow"><input type="checkbox" data-act="toggleTaskBox" data-id="'+tk.id+'"'+(tk.done?' checked':'')+'><span>Aufgabe erledigt: '+esc(tk.title)+'</span></label>';
  h+='<div class="fh">Ampel — wird beim Speichern übernommen</div>'+ampRowSel(bl.ampel||'none','block');
  const fb=bl.fb||null;
  h+='<div class="fh">Rückmeldung — optional, für den späteren Blick</div><div class="ampRow">'+
    '<button class="ampB'+(fb==='ok'?' sel':'')+'" data-act="fbSet" data-v="ok">✔ hat funktioniert</button>'+
    '<button class="ampB'+(fb==='bad'?' sel':'')+'" data-act="fbSet" data-v="bad">✖ hat nicht funktioniert</button>'+
    '<button class="ampB'+(fb==='none'?' sel':'')+'" data-act="fbSet" data-v="none">— nichts Besonderes</button></div>';
  h+='<input class="inp" id="b-fbnote" style="margin-top:8px" value="'+esc(bl.fbNote||'')+'" placeholder="Was war anders? Freitext — landet im Export (X-LR-FBNOTE) und kann später z. B. per KI ausgewertet werden.">';
  if(td)h+='<label class="checkrow"><input type="checkbox" data-act="toggleTodoBox" data-id="'+td.t.id+'"'+(td.t.done?' checked':'')+'><span>Aufgabe erledigt: '+esc(td.t.title)+'</span></label>';
  h+='<div class="sheetBtns"><button class="btn primary" data-act="blockSave" data-day="'+d+'" data-slot="'+s+'" data-w="'+W+'">Speichern</button>'+
    (td?'':'<button class="btn" data-act="blockDone" data-day="'+d+'" data-slot="'+s+'" data-w="'+W+'">'+(bl.done?'Wieder öffnen':'Als erledigt markieren')+'</button>')+
    '<button class="btn" data-act="moveBlock" data-day="'+d+'" data-slot="'+s+'" data-w="'+W+'">Verschieben</button>'+
    '<button class="btn danger" data-act="freeSlot" data-day="'+d+'" data-slot="'+s+'" data-w="'+W+'">🗑 Löschen</button></div>';
  h+='<div class="sub" style="margin-top:10px">🔒 Kalenderspiegel: <code>VEVENT '+icsUid('block',W+'-'+d+'-'+s)+'</code> · Kategorie LR-BLOCK'+(bl.ampel?' · LR-'+String(bl.ampel).toUpperCase():'')+(bl.span>1?' · X-LR-SPAN:'+bl.span:'')+' — liegt als Standardobjekt im offenen Kalender (CalDAV), unabhängig von dieser App.</div>';
  h+='<div class="sheetBtns"><button class="btn ghost" data-act="closeModal">Schließen</button></div>';
  ui.ampCtx={t:'block',d:d,s:s,w:W};
  openSheet(h);
}

function sheetAppt(id){
  const aps=getAppts(); let ap=null, key=null;
  for(const k in aps){
    const o=aps[k];
    if(o.id===id){ap=o; key=k; break}
    if(o.stack)for(const sa of o.stack)if(sa.id===id){ap=sa; key=k; break}
    if(ap)break;
  }
  if(!ap)return;
  ui.ampCtx={t:'appt',d:ap.day,s:ap.slot,id:ap.id};
  const ar=ap.areaId?areaOfId(ap.areaId):null;
  let h='<div class="shead"><h3>Termin</h3><div class="sub">'+esc(fmtDate(addDays(ui.anchor,ap.day)))+' · '+esc(ap.time)+(ap.span>1?' · über '+ap.span+' Blöcke':'')+(ar?' · '+esc(ar.name):'')+'</div></div>';
  h+='<label class="f">Titel</label><input class="inp" id="a-title" value="'+esc(ap.title||'')+'">';
  h+='<div class="fh">Ampel — wird beim Speichern übernommen</div>'+ampRowSel(ap.ampel||'none','appt');
  const apc=parseClock(ap.time);
  h+='<label class="f">Uhrzeit (optional — ohne Angabe zählt das Blockfenster)</label><div class="row2"><input class="inp slim" type="time" id="a-t0" value="'+(apc?apc[0]:'')+'" style="flex:1;min-width:110px"><span class="pc">–</span><input class="inp slim" type="time" id="a-t1" value="'+(apc&&apc[1]?apc[1]:'')+'" style="flex:1;min-width:110px"></div>';
  h+='<label class="f">Typ (optional — schlägt beim Speichern eine passende Ampel vor)</label><select class="inp" id="a-type"><option value="">— keiner —</option>'+S.types.map(t=>'<option value="'+t.id+'"'+(ap.typeId===t.id?' selected':'')+'>'+t.emoji+' '+esc(t.name)+'</option>').join('')+'</select>';
  const fb=ap.fb||null;
  h+='<div class="fh">Rückmeldung — optional, für den späteren Blick</div><div class="ampRow">'+
    '<button class="ampB'+(fb==='ok'?' sel':'')+'" data-act="fbSet" data-v="ok">✔ hat funktioniert</button>'+
    '<button class="ampB'+(fb==='bad'?' sel':'')+'" data-act="fbSet" data-v="bad">✖ hat nicht funktioniert</button>'+
    '<button class="ampB'+(fb==='none'?' sel':'')+'" data-act="fbSet" data-v="none">— nichts Besonderes</button></div>';
  h+='<input class="inp" id="a-fbnote" style="margin-top:8px" value="'+esc(ap.fbNote||'')+'" placeholder="Was war anders? Freitext — landet im Export (X-LR-FBNOTE).">';
  h+='<div class="sheetBtns"><button class="btn primary" data-act="apptSave" data-id="'+ap.id+'">Speichern</button><button class="btn danger" data-act="apptDel" data-id="'+ap.id+'">🗑 Löschen</button></div>';
  h+='<div class="sub" style="margin-top:10px">🔒 Kalenderspiegel: <code>VEVENT '+icsUid('appt',wk()+'-'+key)+'</code> · Kategorie LR-APPT'+(ap.ampel?' · LR-'+String(ap.ampel).toUpperCase():'')+' — Termine liegen ohnehin als CalDAV-Objekte im Server-Kalender; die Ampel ist ein lokales Overlay.</div>';
  h+='<div class="sheetBtns"><button class="btn ghost" data-act="closeModal">Schließen</button></div>';
  openSheet(h);
}

function slotPickerSheet(title){
  if(!ui.pickerWeek)ui.pickerWeek=wk();
  ui.pickerTitle=title;
  const pw=ui.pickerWeek;
  const realW=iso(mondayOf(new Date()));
  let h='<div class="shead"><h3>'+esc(title)+'</h3><div class="sub">Freie Blöcke — Woche wechseln mit ‹ ›, auch in anderen Wochen und Monaten.</div></div>';
  h+='<div class="daychips" style="margin-bottom:8px"><button class="chip" data-act="pickerPrev">‹ eine Woche zurück</button><span class="chip" style="cursor:default">KW '+isoWeek(parseISO(pw))+' · '+fmtDate(parseISO(pw))+' – '+fmtDate(addDays(parseISO(pw),6))+'</span><button class="chip" data-act="pickerNext">eine Woche vor ›</button></div>';
  for(let d=0;d<7;d++){
    const dt=addDays(parseISO(pw),d);
    if(pw===realW&&d<dayIdx(new Date()))continue;
    h+='<div class="daySec"><div class="daySecT">'+fmtDate(dt)+(iso(dt)===todayISO()?' · heute':'')+'</div>';
    for(let s=0;s<3;s++){
      const bl=blocksFor(pw)[d+'|'+s], ap=apsFor(pw)[d+'|'+s];
      h+='<div class="pickRow"><span class="lbl">'+SLOTS[s].ico+' '+SLOTS[s].label+'</span>';
      if(ap)h+='<span class="st">Termin: '+esc(ap.title)+'</span>';
      else if(bl)h+='<span class="st">Block: '+esc(bl.title||'')+'</span>';
      else h+='<button class="btn mini" data-act="pickSlot" data-week="'+pw+'" data-day="'+d+'" data-slot="'+s+'">→ hier einplanen</button>';
      h+='</div>';
    }
    h+='</div>';
  }
  h+='<div class="sheetBtns"><button class="btn ghost" data-act="closeModal">Abbrechen</button></div>';
  openSheet(h);
}

function sheetPhase(id,preStart,preEnd){
  const p=(id&&id!=='new')?S.phases.find(x=>x.id===id):null;
  if(!ui.phIdx)ui.phIdx=1;
  ui.phColor=p?p.color:PHC[(ui.phIdx++)%PHC.length];
  const st=p?p.start:(preStart||ui.year+'-01-01');
  const en=p?p.end:(preEnd||ui.year+'-01-31');
  let h='<div class="shead"><h3>'+(p?'Phase: '+esc(p.title):'Neue Phase')+'</h3><div class="sub">'+(p?'Zeitraum, Ausrichtung und Farbe frei anpassbar.':'Eine Intention für einen Zeitraum — ohne Verpflichtung, ohne Zuordnung.')+'</div></div>';
  if(p&&p.desc)h+='<div class="note">'+esc(p.desc)+'</div>';
  h+='<label class="f">Titel (Thema)</label><input class="inp" id="ph-title" value="'+esc(p?p.title:'')+'" placeholder="z. B. Fundament legen">';
  h+='<label class="f">Beschreibung</label><textarea class="inp" id="ph-desc" rows="2" placeholder="Worin besteht die Ausrichtung?">'+esc(p?p.desc||'':'')+'</textarea>';
  h+='<div class="row2"><div style="flex:1;min-width:150px"><label class="f">Beginn</label><input class="inp" type="date" id="ph-start" value="'+st+'"></div><div style="flex:1;min-width:150px"><label class="f">Ende</label><input class="inp" type="date" id="ph-end" value="'+en+'"></div></div>';
  h+='<label class="f">Farbe — Palette oder eigene Farbe wählen</label><div class="swatches">'+PHC.map(c=>'<button class="sw2'+(ui.phColor===c?' sel':'')+'" style="--c:'+c+'" data-act="phaseColor" data-c="'+c+'"></button>').join('')+'</div><input type="color" class="colorInp" id="ph-color" data-field="phColor" value="'+esc(ui.phColor)+'" title="Eigene Farbe wählen" style="margin-top:8px">';
  h+='<div class="sheetBtns"><button class="btn primary" data-act="phaseSave" data-id="'+(id||'new')+'">Speichern</button>'+(p?'<button class="btn danger" data-act="phaseDel" data-id="'+p.id+'">Löschen</button>':'')+'<button class="btn ghost" data-act="closeModal">Abbrechen</button></div>';
  openSheet(h);
}

function sheetAssign(){
  let h='<div class="shead"><h3>📥 Kalender-Einträge zuordnen</h3><div class="sub">Fremde Einträge aus der Nextcloud bekommen ihre Zuordnung von Theo — und Theo <b>markiert sie im Kalender selbst</b> (Kategorie <code>LR-ASSIGNED</code> + eingetragener Slot; Titel und Uhrzeiten bleiben exakt gleich). <b>Kein Eintrag kann mehr scheitern:</b> Ist ein Slot belegt, teilt sich der Eintrag den Block — beide Karten bleiben sichtbar. Vorschlag (dunkel markiert) aus den Uhrzeiten bzw. dem Blockraster; ganztägige Einträge ohne Uhrzeit darfst du frei einordnen — auch „Abend", wenn es nachts wirklich ums Abendleben geht.</div></div>';
  if(!S.unmapped.length)h+='<div class="sub">Alles zugeordnet oder keine fremden Einträge gefunden. 🌿</div>';
  S.unmapped.forEach(it=>{
    const pc=parseClock(it.time);

/* ================= Logik ================= */
function nextFree(day,slot){
  const curW=wk(), cur=isCurrentWeek(), tI=dayIdx(new Date());
  for(let off=0;off<4;off++){
    const w=iso(addDays(parseISO(curW),7*off));
    for(let d=0;d<7;d++){
      if(off===0&&cur&&d<tI)continue;
      let s0=0;
      if(off===0&&d===day)s0=slot+1;
      for(let s=s0;s<3;s++){if(!slotOccW(w,d,s))return {week:w,day:d,slot:s}}
    }
  }
  return null;
}
function offerRegen(day,slot){
  const t=nextFree(day,slot);
  if(!t){toast('Keine freien Blöcke mehr diese Woche — Regeneration gern nächste Woche einplanen 🌿'); return}
  ui.suggestion={target:t};
}
function toggleTodo(id,val){
  const f=findTodo(id); if(!f)return;
  f.t.done=val;
  f.t.kanban=val?'fertig':(f.t.kanban==='fertig'?'offen':f.t.kanban);
  if(f.t.planned){const bl=getBlocksW(f.t.planned.wk)[f.t.planned.day+'|'+f.t.planned.slot]; if(bl)bl.done=val}
  save();
}
function setBlock(d,s,bl){getBlocks()[d+'|'+s]=bl; save()}

  nav(a){ui.route={view:a.v}; ui.menuOpen=false; render()},

    if(want>avail){toast('Hier ist nur '+(avail===1?'1 Block':'sind '+avail+' Blöcke')+' frei — Dauer anpassen oder anderen Start wählen.'); return}

  },
  typeApptSave(a){
    const t=typeOf(a.tid); if(!t)return;
    const d=+a.day, s=+a.slot;
    const title=((document.getElementById('ta-title')||{}).value||'').trim()||t.name;
    const t0=(document.getElementById('ta-t0')||{}).value||'';
    const t1=(document.getElementById('ta-t1')||{}).value||'';

      t.classList.add('sel'); ui.tmpAmpel=a.v; return;

    const t0=(document.getElementById('ap-t0')||{}).value||'';

      }

    }

    const c=wdCfg();
    if(ap.remoteUid){
      if(c.cal){try{wdFetch(c.cal+encodeURIComponent(ap.remoteUid)+'.ics',{method:'DELETE'}).catch(()=>{})}catch(e){}}

      tombMark(uid);
      wdDeleteUid(uid);
    }
    if(ap.remoteUid)tombMark(ap.remoteUid);

  pickSlot(a){

    if(c.type==='move'){
      const key=c.from.day+'|'+c.from.slot;
      const srcW=c.from.w||wk();
      const bl=blocksFor(srcW)[key]; if(!bl)return;
      const spn=bl.span||1;
      if(!spanRoomW(W,d,s,spn)){toast('Ziel hat nicht genug Platz für '+spn+' Blöcke.'); return}
      delete blocksFor(srcW)[key];
      blocksFor(W)[d+'|'+s]=bl;
      if(bl.todoId){const f=findTodo(bl.todoId); if(f)f.t.planned={wk:W,day:d,slot:s}}
      toast('Verschoben nach '+fmtDaySlotW(W,d,s));
    }else if(c.type==='todo'){
      const f=findTodo(c.id); if(!f)return;
      f.t.planned={wk:W,day:d,slot:s};
      setBlockW(W,d,s,{id:uid(),kind:'projekt',projectId:f.p.id,todoId:c.id,title:f.p.name,ampel:'gelb',note:f.t.firstStep||'',done:false});
      toast('„'+f.t.title+'“ geplant: '+fmtDaySlotW(W,d,s));
    }else if(c.type==='task'){
      const t=S.tasks.find(x=>x.id===c.id); if(!t)return;
      t.planned={wk:W,day:d,slot:s};
      setBlockW(W,d,s,{id:uid(),kind:'task',taskId:t.id,typeId:null,title:t.title,ampel:'none',note:t.firstStep||'',done:false});
      toast('Aufgabe geplant: '+fmtDaySlotW(W,d,s));
    }else if(c.type==='inbox'){
      const it=S.inbox.find(x=>x.id===c.id);
      const f=c.fields||{};
      setBlockW(W,d,s,{id:uid(),kind:'typ',typeId:null,title:f.title||(it?it.text:'Gedanke'),ampel:'none',note:f.note||'',done:false});
      if(it)S.inbox=S.inbox.filter(x=>x.id!==c.id);
      toast('Aus der Eingangskiste geplant — schön, dass es einen Platz hat.');
    }else if(c.type==='regen'){
      setBlockW(W,d,s,{id:uid(),kind:'typ',typeId:'ty1',title:'Regeneration',ampel:'gruen',note:'',done:false});
      toast('Regeneration eingeplant 🌿');
    }

  async wdPush(){
    const c=wdCfg(); const cal=c.cal;
    if(!cal){toast('Bitte zuerst verbinden und einen Kalender wählen.'); return}
    const cal2=(c.cal2&&c.cal2!==c.cal)?c.cal2:null;
    const main=buildEvents('main'), ph=buildEvents('phases'), tds=buildTodos();
    const allUids=main.concat(ph,tds).map(e=>String(e.uid).split('@')[0]);
    await pruneSynced(allUids);
    let ok=0, fail=0, lastS=0, lastT='';
    ui.wdMsg='⏳ Schreibe '+(main.length+ph.length+tds.length)+' Objekte'+(cal2?' (Phasen in zweiten Kalender)':'')+' …';
    render();
    async function putAll(evs,href){
      for(const ev of evs){
        try{
          const r=await wdFetch(href+encodeURIComponent(ev.uid)+'.ics',{method:'PUT',headers:{'Content-Type':'text/calendar; charset=utf-8'},body:ev.text});
          if(r.ok||r.status===201||r.status===204)ok++;
          else{fail++; if(!lastS){lastS=r.status; lastT=await wdBody(r)}}
        }catch(e){fail++}
      }
    }
    await putAll(main,cal);
    if(ph.length)await putAll(ph,cal2||cal);
    if(tds.length)await putAll(tds,cal);
    registerSynced(main); registerSynced(ph); registerSynced(tds); saveQuiet();
    let capSkip=false, capSub=false;
    try{
      const cobj=capsuleJson(); const cstr=JSON.stringify(cobj);
      if(S.meta.pulled===false){capSkip=true} /* Erstverbindung: erst lesen, dann schreiben */
      else if(cstr!==SYNC.capJson){
        const cr=await putCapsule(cal,cobj);
        if(cr.ok){ok++; SYNC.capJson=cstr; capSub=!!cr.sub}
        else{fail++; if(!lastS){lastS=cr.status; lastT=cr.text}}
      }
    }catch(e){fail++}
    if(ok)ui.wdMsg='✔ '+ok+' Objekte geschrieben (per UID überschrieben — wiederholtes Schreiben ist gefahrlos).'+(cal2?' Phasen liegen im zweiten Kalender und sind dort transparent (nicht „besetzt").':'')+' To-dos als VTODO, Kapsel (Motto/Kiste/Struktur) als VJOURNAL'+(capSub||SYNC.capMode==='sub'?' (in eigener VJOURNAL-Sammlung <code>theo-kapsel</code>)':'')+'.'+(fail?' ✖ '+fail+' fehlgeschlagen: '+wdHuman(lastS,lastT):'');
    else ui.wdMsg='✖ Schreiben nicht möglich. '+wdHuman(lastS||0,lastT);
    if(capSkip)ui.wdMsg+=' Kapsel (Motto/Kiste/Bereiche/Typen) bewusst übersprungen — dieses Gerät hat noch nie aus dem Kalender gelesen; nach dem ersten Lesen wird sie automatisch mitgeschrieben (Schutz vor Überschreiben).';
    render();
  },
  async wdPull(){
    const c=wdCfg(); const cal=c.cal;
    if(!cal){toast('Bitte zuerst verbinden und einen Kalender wählen.'); return}
    ui.wdMsg='⏳ Lese Kalender …';
    render();
    try{
      const r=await wdFetch(cal+'?export',{method:'GET'});
      if(!r.ok){ui.wdMsg='✖ Lesen scheitert. '+wdHuman(r.status,await wdBody(r)); render(); return}
      const txt=await r.text();
      const res=importICS(txt);
      const cp=await pullCapsule(cal,txt);
      const tr=processTodos(txt);
      if(!S.meta.pulled&&cp.checked)S.meta.pulled=true; /* ab jetzt darf dieses Gerät schreiben */
      let txt2='';
      if(c.cal2&&c.cal2!==c.cal){const r2=await wdFetch(c.cal2+'?export',{method:'GET'}); if(r2.ok){txt2=await r2.text(); const p2=importICS(txt2); res.phases+=p2.phases}}
      reconcileDeleted([txt,txt2]);
      let added=0;
      for(const f of classifyRemote(txt)){
        if(!S.unmapped.some(x=>x.uid===f.uid)){S.unmapped.push(f); added++}
      }
      saveQuiet(); render();
      ui.wdMsg='✔ Gelesen: '+res.blocks+' Blöcke, '+res.appts+' Termine, '+res.mits+' MITs, '+res.phases+' Phasen'+(tr.updated?', '+tr.updated+' To-dos aktualisiert':'')+(tr.imported?', '+tr.imported+' Aufgaben aus VTODO':'')+(cp.adopted?', Kapsel übernommen (Motto/Kiste/Struktur'+(cp.sub?' aus theo-kapsel':'')+')':'')+(added?' · 📥 '+added+' fremde Einträge warten auf Zuordnung':'')+ '.';
      render();
    }catch(e){
      ui.wdMsg='✖ Lesen nicht möglich (Netzwerk/CORS) — siehe Hinweis unten.';
      render();
    }
  },
