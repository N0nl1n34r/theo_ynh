<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo — Beta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<meta name="theme-color" content="#FBF9F2">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/theo-icon.png">
<script>
/* PWA: Service-Worker nur über HTTP(S) registrieren (nicht als Datei, nicht in Sandbox-Vorschauen) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('/app/sw.js').catch(function(){})}catch(e){}}
</script>
<style>
:root{
  --bg:#F6F3ED; --panel:#FFFFFF; --ink:#3A362D; --sub:#8A8478; --line:#E7E1D4; --soft:#F1EDE3;
  --rot:#D96A5B; --orange:#E09B4C; --gelb:#D8B44C; --gruen:#7CA982; --neutral:#B5AFA4;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.45}
button{font:inherit; color:inherit}
h1{font-size:23px; font-weight:600; letter-spacing:-.01em; margin:0}
h3{font-size:16.5px; margin:0 0 2px}
.sub{color:var(--sub); font-size:13px}
.dim{color:var(--sub); font-style:italic}
.strike{text-decoration:line-through; opacity:.55}

/* ---------- Layout ---------- */
#wrap{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh}
#nav{background:#F2EEE5; border-right:1px solid var(--line); padding:18px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px}
.logo{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; padding:4px 10px 16px}
.logo .leaf{font-size:20px}
.navbtn[hidden]{display:none!important}
.navbtn{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border:none; background:transparent; border-radius:12px; cursor:pointer; font-size:14.5px; position:relative}
.navbtn:hover{background:#EAE5D9}
.navbtn.on{background:#FFF; box-shadow:0 1px 3px rgba(80,70,40,.08); font-weight:600}
.navdot{width:7px; height:7px; border-radius:50%; background:#9BB89A; position:absolute; right:12px}
.navfoot{margin-top:auto; padding:10px 12px; font-size:11.5px; color:var(--sub); line-height:1.5}
#main{padding:26px 30px 70px; max-width:1210px; width:100%}
#topbar{display:none}
.mobileMenuClose{display:none}
@media(max-width:940px){.mobileMenuClose{display:block}}

.vhead{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.hbtns{display:flex; gap:6px}
.crumb{color:var(--sub); font-size:13px; cursor:pointer; margin-bottom:6px}
.crumb:hover{color:var(--ink)}

/* ---------- Buttons & inputs ---------- */
.btn{background:#FFF; border:1px solid #DCD5C6; border-radius:11px; padding:9px 15px; cursor:pointer; font-size:14px}
.btn:hover{background:#FBF9F4}
.btn.primary{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
.btn.primary:hover{background:#3B372F}
.btn.ghost{background:transparent; border-color:transparent; color:var(--sub)}
.btn.ghost:hover{color:var(--ink); background:#EFEAE0}
.btn.danger{border-color:#E4B9B2; color:#A44B3F}
.btn.mini{padding:5px 11px; font-size:12.5px; border-radius:9px}
.inp{width:100%; border:1px solid #DCD5C6; border-radius:11px; padding:9px 12px; font:inherit; font-size:14px; background:#FFF; color:var(--ink)}
.inp:focus{outline:2px solid #C8D8C4; outline-offset:1px}
.inp.slim{width:auto; padding:7px 9px; font-size:13px}
.inp.grow{flex:1}
.inp.big{font-size:16.5px; font-weight:600}
label.f{display:block; font-size:12.5px; color:var(--sub); margin:12px 0 5px}
.row2{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.checkrow{display:flex; align-items:center; gap:9px; margin:12px 0; font-size:14px; cursor:pointer}

/* ---------- Chips & dots ---------- */
.chip{display:inline-flex; align-items:center; gap:7px; background:#FFF; border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer}
.chip:hover{background:#FBF9F4}
.chip.mini{padding:3px 10px; font-size:12px}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0}
.dot{width:11px; height:11px; border-radius:50%; display:inline-block; border:2px solid #FFF; box-shadow:0 0 0 1.5px rgba(60,55,40,.12); flex:none}
.dot.rot{background:var(--rot)} .dot.orange{background:var(--orange)} .dot.gelb{background:var(--gelb)} .dot.gruen{background:var(--gruen)} .dot.none{background:var(--neutral)}
.ampRow{display:flex; gap:7px; flex-wrap:wrap}
.ampB{display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid #E3DCCD; border-radius:12px; background:#FFF; cursor:pointer; font-size:13.5px}
.ampB.sel{border-color:#7E8F79; box-shadow:0 0 0 1.5px #7E8F79 inset; background:#F4F6F1}
.legend{display:flex; align-items:center; gap:9px; flex-wrap:wrap; color:var(--sub); font-size:12px; margin-top:18px}
.legend .dot{width:9px; height:9px}

/* ---------- Orientierungshilfen ---------- */
.orient{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.orient .mini2{border:none; background:#F1EDE3; border-radius:7px; padding:2px 8px; cursor:pointer; font-size:12px}
.orient .mini2:hover{background:#E7E1D4}

/* ---------- Wochenraster ---------- */
.sugg{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:#EEF4EC; border:1px solid #D6E4D4; border-radius:14px; padding:12px 15px; font-size:13.5px; margin-bottom:12px}
.intro{background:#FDFBF6; border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:13.5px; margin-bottom:14px}
.intro ul{margin:8px 0 10px; padding-left:18px; color:#5C564A}
.wgrid{display:grid; grid-template-columns:88px repeat(7,minmax(0,1fr)); gap:7px}
.dh{font-size:12.5px; font-weight:600; color:#6F6A5F; padding:5px 4px; text-align:center; border-radius:10px}
.dh.today{background:#EFEAE0}
.sl{font-size:11.5px; color:var(--sub); padding:8px 4px; text-align:right}
.sl .ico{font-size:15px; display:block; text-align:center; margin-bottom:3px}
.slot{min-height:106px; min-width:0; border-radius:14px; position:relative; display:flex; flex-direction:column; gap:6px}
.slot.free{border:1.6px dashed #D9D3C6; align-items:center; justify-content:center; color:#A49E91; cursor:pointer; background:rgba(255,255,255,.4); gap:2px}
.slot.free:hover{border-color:#B9B2A2; color:#75705F; background:#FFF}
.slot.free .plus{font-size:17px; line-height:1}
.slot.free .fl{font-size:11px}
.slot.drop{outline:2px solid #9BC4A9; outline-offset:2px}
.card{background:#FFF; border:1px solid #ECE6D9; border-radius:14px; padding:9px 10px; box-shadow:0 1px 2px rgba(80,70,40,.05); font-size:13.5px; min-width:0; max-width:100%; box-sizing:border-box; overflow:hidden}
.card.appt.stacked{margin-top:6px; border-left:3px solid #B7AE9C; background:#FDFBF6; font-size:12.5px; padding:8px 10px}
.block{border-left:3px solid var(--ac,#C9C2B2); cursor:pointer; flex:1; min-width:0}
.block.done{opacity:.5}
.appt{background:#FBF8F1; cursor:pointer; flex:1; min-width:0}
[draggable="true"]{cursor:grab}
[draggable="true"]:active{cursor:grabbing}
.apList{display:flex; flex-direction:column; gap:4px; min-width:0}
.apHead{display:flex; align-items:center; justify-content:space-between; gap:4px; font-size:11px; color:var(--sub); padding:1px 2px; min-width:0; flex-wrap:wrap}
.apAct{border:1px solid #DFD9CA; background:#FFF; border-radius:7px; padding:1px 6px; font-size:10.5px; color:#5C564A; cursor:pointer}
.apAct:hover{background:#F4F0E7}
.apWarn{color:#9E6230; font-weight:600}
.apRow{display:flex; align-items:center; gap:6px; background:#FBF8F1; border:1px solid #ECE6D9; border-left:3px solid #B7AE9C; border-radius:10px; padding:5px 8px; font-size:12.5px; cursor:pointer; min-width:0}
.apRow:hover{background:#F6F1E4}
.apRow .apTm{font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; flex:none}
.apRow .apTt{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.apBadge{font-size:10.5px; color:#7A7466; background:#EFEAE0; border-radius:6px; padding:1px 5px; white-space:nowrap; flex:none}
.slotSubBtn{border:1px dashed #DFD9CA; background:rgba(255,255,255,.45); border-radius:9px; padding:3px 8px; font-size:11px; color:#8A8478; cursor:pointer; text-align:center}
.slotSubBtn:hover{background:#FFF; border-color:#B9B2A2; color:#5C564A}
.slotAddBlk{position:absolute; right:7px; bottom:7px; z-index:2; border:1px solid #DDD6C6; background:rgba(253,252,248,.96); border-radius:999px; padding:2px 8px; font-size:11px; color:#5C564A; cursor:pointer; box-shadow:0 1px 4px rgba(50,45,30,.1); display:inline-flex; align-items:center; gap:3px; line-height:1.3}
.slotAddBlk:hover{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
@media (hover:hover) and (pointer:fine){
  .slotAddBlk{opacity:0; pointer-events:none; transition:opacity .14s ease}
  .slot:hover .slotAddBlk,.slot:focus-within .slotAddBlk{opacity:1; pointer-events:auto}
}
@media (hover:none),(pointer:coarse){
  .slotAddBlk{width:24px; height:24px; padding:0; justify-content:center; font-size:13px; background:#F3EFE5; border-color:#DFD9CA; color:#6F6A5F; opacity:.85}
  .slotAddBlk .addLbl{display:none}
}
.brow{display:flex; align-items:flex-start; gap:5px; min-width:0; width:100%}
.brow>.dot,.brow>.noampDot{margin-top:3px; flex:none}
.bico{font-size:13.5px; line-height:1.35; flex:none}
.bttl{font-weight:600; font-size:13px; flex:1; min-width:0; line-height:1.3; overflow-wrap:anywhere; word-break:break-word; hyphens:auto}
.btime{font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bnote{font-size:12px; color:var(--sub); margin-top:4px; overflow-wrap:anywhere; word-break:break-word}
.bsrc{font-size:11px; color:#A49E91; margin-top:4px; overflow-wrap:anywhere; word-break:break-word}
.tchip{display:flex; align-items:flex-start; gap:6px; margin-top:6px; font-size:12.5px; cursor:pointer; min-width:0}
.tchip span{min-width:0; overflow-wrap:anywhere; word-break:break-word}
.noamp{font-size:11px; color:#A49E91; border:1px dashed #D9D3C6; border-radius:8px; padding:1px 7px; white-space:nowrap}
.noampDot{width:11px; height:11px; border-radius:50%; border:1.4px dashed #D2CBB9; display:inline-block; flex:none}
.cfgTpl{width:100%; background:#FAF7F0; border-top:1px dashed #E8E2D4; margin-top:6px; padding-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px}
.cfgNav{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 12px}
.dragTrashCell{display:flex; align-items:center; justify-content:center; min-height:30px}
.dragTrash{display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:10px; border:1.5px dashed #D5B8AE; background:#FBF3F0; color:#9E5B49; font-size:11.5px; font-weight:600; opacity:0; pointer-events:none; transform:scale(.9); transition:opacity .14s ease,transform .14s ease,background .12s ease,border-color .12s ease; user-select:none}
body.dragging-ev .dragTrash{opacity:1; pointer-events:auto; transform:scale(1)}
.dragTrash.drop{background:#F1D6CE; border-color:#B85B45; color:#6E2B1C; outline:2px solid #D98B76; outline-offset:1px}
.mobTrashWrap{display:none; margin-bottom:8px}
body.dragging-ev .mobTrashWrap{display:flex; justify-content:flex-start}
.subChips{display:flex; gap:5px; flex-wrap:wrap; margin:4px 0 6px}
.subChip{border:1px solid #E5DECFE6; background:#FAF7F0; color:#5C564A; border-radius:999px; padding:2px 9px; font-size:11.5px; cursor:pointer; line-height:1.4}
.subChip:hover{background:#EFEAE0; border-color:#CFC7B5}
.typeRowWrap{display:flex; flex-direction:column; gap:3px}
.typeSubsInline{display:flex; gap:4px; flex-wrap:wrap; padding:0 4px 3px 30px}
.bRetBtn{margin-top:5px; border:1px dashed #D5CBB8; background:#FAF7F0; color:#6B6457; border-radius:8px; padding:2px 7px; font-size:11px; cursor:pointer; align-self:flex-start}
.bRetBtn:hover{background:#EFEAE0; color:#3D3A33}
.repBox{background:#FAF7F0; border:1px solid #ECE6D9; border-radius:12px; padding:9px 11px; margin-top:10px}
.slotPickGrid{display:grid; grid-template-columns:78px repeat(7,minmax(0,1fr)); gap:5px; margin-top:8px; font-size:11.5px}
.spCell{border:1px dashed #D8D1C2; border-radius:8px; padding:6px 3px; text-align:center; cursor:pointer; background:#FFF; color:#5C564A; font-size:11px}
.spCell.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C; border-style:solid; font-weight:600}
.spCell.occ{background:#F2EFE8; color:#B3AC9D; border-style:solid; cursor:not-allowed}
.inbMd p{margin:0 0 6px}
.inbMd p:last-child{margin-bottom:0}
.inbMd ul,.inbMd ol{margin:4px 0 6px; padding-left:20px}
.inbMd li{margin:2px 0}
.inbMd h1,.inbMd h2,.inbMd h3{font-size:14.5px; font-weight:700; margin:4px 0}
.inbMd code{background:#F3EFE5; border-radius:5px; padding:1px 5px; font-size:12.5px}
.inbMd pre{background:#F3EFE5; border-radius:8px; padding:7px 9px; overflow-x:auto; margin:5px 0; font-size:12px}
.inbMd blockquote{margin:4px 0; padding-left:9px; border-left:2.5px solid #D5CBB8; color:#6F6A5F}
.agRow{cursor:pointer; border-radius:8px; padding:6px 6px}
.agRow:hover{background:#FAF7F0}
.uprow[draggable="true"]:hover{background:#FAF7F0; border-radius:9px}
.touchGrip{display:none}.touchDragging{opacity:.45}.touchGhost{position:fixed;z-index:9999;pointer-events:none;background:#363b36;color:white;border-radius:8px;padding:7px 11px;font-size:13px;box-shadow:0 3px 12px #0005}.touchDrop{outline:3px solid #5b9b73!important;outline-offset:-3px}
@media (pointer:coarse){.touchGrip,.upGrip{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;touch-action:none;user-select:none;cursor:grab;color:#526b5c;font-size:20px}.swipeHint:after{content:" Zum Verschieben ⠿ ziehen oder Karte halten."}}
.upGrip{color:#C1BAAB; cursor:grab; user-select:none; font-size:13px; padding:0 2px}
.wmobile{display:none}
.daychips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px}
.daychips .chip{flex:none}
.daychips .chip.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
.mdayView .slot{min-height:88px; margin-bottom:10px}
.mslotLabel{font-size:12px; color:var(--sub); margin:14px 0 5px; display:flex; gap:7px; align-items:center}

/* ---------- Jahresansicht ---------- */
.ygrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:12px}
.mcard{padding:12px}
.mname{font-weight:600; font-size:13.5px; margin-bottom:7px}
.mrow{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:3px}
.mwd{font-size:9px; color:#A9A394; text-align:center}
.mcell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:10.5px; border-radius:5px; color:#75705F}
.mcell.ph{color:#3D3A33}
.mcell.today{box-shadow:inset 0 0 0 1.6px #8A8578; font-weight:700}
.phchip{display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 13px; background:#FFF; cursor:pointer; margin-bottom:8px; text-align:left}
.phchip:hover{background:#FBF9F4}
.phbar{width:15px; height:15px; border-radius:4.5px; background:var(--c); flex:none}
.phmeta{font-size:11.5px; color:var(--sub)}
.phlist{margin-top:16px}
.swatches{display:flex; gap:5px; flex-wrap:wrap}
.sw{width:19px; height:19px; border-radius:6px; border:none; background:var(--c); cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw.sel{outline:2px solid #4A453C; outline-offset:1.5px}

/* ---------- Bereiche & Projekte ---------- */
.areaGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; margin-bottom:18px}
.area{border-left:3px solid var(--ac); padding:13px 14px}
.ahead{display:flex; align-items:center; gap:9px; margin-bottom:8px}
.aemo{font-size:19px}
.aname{font-weight:600; flex:1}
.acount{font-size:11.5px; color:var(--sub)}
.chip.proj{border-left:3px solid var(--c)}
.pc{color:var(--sub); font-size:11px}
.phead{display:flex; align-items:center; gap:10px; margin-top:2px}
.emoBtn{border:1px solid var(--line); background:#FFF; border-radius:11px; font-size:17px; padding:7px 10px; cursor:pointer}
.tabs{display:flex; gap:6px; margin:12px 0; flex-wrap:wrap}
.tab{border:1px solid var(--line); background:#FFF; border-radius:999px; padding:6px 14px; cursor:pointer; font-size:13px}
.tab.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
.tab.off{color:var(--sub); border-style:dashed; cursor:default; background:transparent}
.trow{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid #F0EBE0; flex-wrap:wrap}
.trow:last-child{border-bottom:none}
.tt{flex:1; min-width:140px}
.xbtn{border:none; background:transparent; color:#B3AC9D; cursor:pointer; font-size:13px; padding:4px 7px; border-radius:8px}
.xbtn:hover{background:#F0EBE0; color:#8A8478}
.note{background:#F7F4EC; border-radius:10px; padding:9px 12px; font-size:13px; margin:10px 0; color:#5C564A}

/* ---------- Kanban ---------- */
.kscroll{overflow-x:auto; padding-bottom:6px}
.kb{display:grid; grid-template-columns:repeat(5,minmax(186px,1fr)); gap:12px; min-width:930px}
.kcol{background:var(--soft); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:150px}
.kcol.drop{outline:2px solid #9BC4A9; outline-offset:2px}
.kname{font-size:12.5px; font-weight:600; color:#6F6A5F; display:flex; justify-content:space-between; padding:0 3px}
.kcard{cursor:grab}
.kadd{background:transparent; border:1px dashed #D9D3C6; border-radius:11px; padding:8px 10px; font:inherit; font-size:13px; color:var(--ink); width:100%}
.chip.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
/* ---------- Gantt ---------- */
.ganttWrap{overflow-x:auto; padding-bottom:8px}
.gantt{min-width:fit-content}
.gcap{font-size:12px; color:var(--sub); margin:8px 0 4px; display:flex; gap:14px; flex-wrap:wrap}
.gcap .gi{display:inline-flex; align-items:center; gap:6px}
.ghead{display:flex; align-items:flex-end}
.gheadLbl{width:220px; flex:none; font-size:11px; color:var(--sub); padding:4px}
.gheadTrack{display:flex}
.gday{width:36px; flex:none; text-align:center; font-size:9.5px; color:#A9A394; padding:3px 0; border-left:1px solid #F0EBE0}
.gday.wknd{background:#F4F1E9}
.gday.today{color:#8A6B5C; font-weight:700}
.grow{display:flex; align-items:center; border-top:1px solid #F0EBE0}
.growLbl{width:220px; flex:none; font-size:12.5px; padding:6px 8px; display:flex; align-items:center; gap:6px; min-height:38px}
.growTrack{position:relative; height:38px}
.gcell{position:absolute; top:0; bottom:0; width:36px; border-left:1px solid #F4F0E7}
.gcell.wknd{background:#F7F4EC}
.gbar{position:absolute; top:8px; height:22px; border-radius:8px; background:#CBB389; cursor:grab; display:flex; align-items:center; padding:0 8px; font-size:11px; color:#3A362D; white-space:nowrap; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.gbar .gbt{pointer-events:none}
.gtoday{position:absolute; top:0; bottom:0; width:2px; background:#C98D76; opacity:.75; pointer-events:none}
.gdue{position:absolute; top:11px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:9px solid #4A453C; pointer-events:none; transform:translateX(-6px)}
.gmove{display:flex; gap:3px; margin-left:auto}
.gmove .xbtn{padding:2px 6px}

/* ---------- Eingangskiste ---------- */
.capCard{padding:14px 16px; margin-bottom:14px}
.capKinds{display:flex; gap:6px; margin-bottom:9px; flex-wrap:wrap}
.capKinds .chip.on{background:#4A453C; color:#FBF9F2; border-color:#4A453C}
.inbItem{margin-bottom:9px}

'use strict';
/* ================= Hilfsfunktionen ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const MONNAMES=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DAYSHORT=['Mo','Di','Mi','Do','Fr','Sa','So'];
function dayIdx(d){return (d.getDay()+6)%7}
function mondayOf(d){const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-dayIdx(x)); return x}
function addDays(d,n){const x=new Date(d); x.setDate(x.getDate()+n); return x}
function fmtDate(d){return DAYSHORT[dayIdx(d)]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'}
function fmtDateLong(d){return DAYSHORT[dayIdx(d)]+', '+d.getDate()+'. '+MONNAMES[d.getMonth()]}
function isoWeek(d){const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+3-dayIdx(x)); const w1=new Date(x.getFullYear(),0,4); return 1+Math.round(((x-w1)/86400000-3+dayIdx(w1))/7)}
function parseISO(s){const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2])}
function uid(){return 'x'+Math.random().toString(36).slice(2,9)}

function timePickHtml(val,attrs,emptyLbl){
  const v=String(val||'').trim();
  const hasCustom=/^\d{2}:\d{2}$/.test(v)&&!/^\d{2}:(00|15|30|45)$/.test(v);
  const cH=hasCustom?+v.slice(0,2):-1;
  const groups=[['🌅 Vormittag',6,11],['☀️ Mittag & Nachmittag',12,17],['🌙 Abend',18,23],['🌌 Nacht',0,5]];
  let h='<select class="inp slim" '+(attrs||'')+'>';
  if(emptyLbl!==false)h+='<option value=""'+(!v?' selected':'')+'>'+(emptyLbl||'— ohne Zeit —')+'</option>';
  for(const g of groups){
    const opts=[];
    for(let hr=g[1];hr<=g[2];hr++){
      for(const mn of [0,15,30,45])opts.push(pad(hr)+':'+pad(mn));
      if(cH===hr)opts.push(v);
    }
    opts.sort();
    h+='<optgroup label="'+g[0]+'">'+opts.map(tm=>'<option value="'+tm+'"'+(tm===v?' selected':'')+'>'+tm+'</option>').join('')+'</optgroup>';
  }
  return h+'</select>';
}

  }
  return x;
}

function renderMd(raw){
  if(!raw)return '';
  const src=String(raw).replace(/\r\n?/g,'\n');
  const codes=[];
  function mdInl(s){
    let x=esc(s);
    x=x.replace(/`([^`\n]+)`/g,(_,c)=>{const i=codes.push('<code>'+c+'</code>')-1; return '\u0002C'+i+'\u0002'});
    x=x.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    x=x.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
    x=x.replace(/~~([^~\n]+)~~/g,'<span class="strike">$1</span>');
    x=x.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g,'$1<i>$2</i>');
    x=x.replace(/\u0002C(\d+)\u0002/g,(_,i)=>codes[+i]||'');
    return x;
  }
  const lines=src.split('\n');
  const out=[];
  let i=0;
  while(i<lines.length){
    const ln=lines[i];
    if(/^```/.test(ln.trim())){
      const buf=[]; i++;
      while(i<lines.length&&!/^```/.test(lines[i].trim())){buf.push(esc(lines[i])); i++}
      if(i<lines.length)i++;
      out.push('<pre><code>'+buf.join('\n')+'</code></pre>');
      continue;
    }
    if(!ln.trim()){i++; continue}
    const hm=ln.match(/^(#{1,3})\s+(.+)$/);
    if(hm){out.push('<h'+hm[1].length+'>'+mdInl(hm[2])+'</h'+hm[1].length+'>'); i++; continue}
    if(/^>\s?/.test(ln)){
      const q=[];
      while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(mdInl(lines[i].replace(/^>\s?/,''))); i++}
      out.push('<blockquote>'+q.join('<br>')+'</blockquote>');
      continue;
    }
    if(/^\s*[-*+]\s+/.test(ln)){
      const items=[];
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){
        let body=lines[i].replace(/^\s*[-*+]\s+/,'');
        if(/^\[[ xX]\]\s+/.test(body)){
          const chk=/^\[[xX]\]/.test(body);
          body=(chk?'☑ ':'☐ ')+body.replace(/^\[[ xX]\]\s+/,'');
        }
        items.push('<li>'+mdInl(body)+'</li>'); i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){
      const items=[];
      while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){
        items.push('<li>'+mdInl(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++;
      }
      out.push('<ol>'+items.join('')+'</ol>');
      continue;
    }
    const p=[];
    while(i<lines.length&&lines[i].trim()&&!/^```/.test(lines[i].trim())&&!/^(#{1,3})\s+/.test(lines[i])&&!/^>\s?/.test(lines[i])&&!/^\s*[-*+]\s+/.test(lines[i])&&!/^\s*\d+\.\s+/.test(lines[i])){
      p.push(mdInl(lines[i])); i++;
    }
    out.push('<p>'+p.join('<br>')+'</p>');
  }
  return out.join('');
}
function phaseBgStyle(phs){
  if(!phs||!phs.length)return '';
  if(phs.length===1)return 'background:'+itemColor(phs[0])+';';
  const n=phs.length;
  const stops=phs.map((p,i)=>itemColor(p)+' '+(i*100/n).toFixed(2)+'% '+((i+1)*100/n).toFixed(2)+'%').join(',');
  return 'background:linear-gradient(135deg,'+stops+');';
}

  const sp=Math.max(1,span||1);

      if(bl&&bl.typeId===tid&&bl.title)pushSug(bl.title,false);
      if(out.length>=max+4)break;
    }
  }
  const aWeeks=Object.keys(S.appts||{}).sort().reverse();
  for(const w of aWeeks){
    const aps=S.appts[w]||{};
    for(const k of Object.keys(aps)){
      const ap=aps[k];
      if(ap&&ap.typeId===tid&&ap.title)pushSug(ap.title,false);
      if(ap&&ap.stack)ap.stack.forEach(sa=>{if(sa&&sa.typeId===tid&&sa.title)pushSug(sa.title,false)});
    }
  }
  return out.slice(0,max);
}
function blockItems(bl){
  if(!bl)return [];
  const out=[], seen={};
  function add(kind,id){
    if(!kind||!id)return;
    const k=kind+':'+id;
    if(seen[k])return;
    seen[k]=1;
    out.push({kind:kind,id:id});
  }
  if(Array.isArray(bl.items))bl.items.forEach(it=>{if(it)add(it.kind,it.id)});
  if(bl.todoId)add('todo',bl.todoId);
  if(bl.taskId)add('task',bl.taskId);
  return out;
}
function resolveBlockItem(it){
  if(!it)return null;
  if(it.kind==='todo'){const f=findTodo(it.id); return f?{kind:'todo',id:it.id,t:f.t,p:f.p}:null}
  if(it.kind==='task'){const t=S.tasks.find(x=>x.id===it.id); return t?{kind:'task',id:it.id,t:t,p:null}:null}
  return null;
}
function hasBlockTodoItems(bl){
  if(!bl||isAsApptBlock(bl))return false;
  return !!(bl.kind==='bundle'||bl.todoId||bl.taskId||(Array.isArray(bl.items)&&bl.items.length));
}
function syncBlockPrimaryFields(bl){
  if(!bl)return [];
  const valid=blockItems(bl).filter(it=>!!resolveBlockItem(it));
  if(!valid.length){
    delete bl.items; bl.todoId=null; bl.taskId=null;
    if(bl.kind==='bundle')bl.kind='typ';
    return [];
  }
  if(valid.length===1&&bl.kind!=='bundle'){
    delete bl.items;
    bl.todoId=valid[0].kind==='todo'?valid[0].id:null;
    bl.taskId=valid[0].kind==='task'?valid[0].id:null;
    const r0=resolveBlockItem(valid[0]);
    if(r0)bl.done=!!r0.t.done;
    return valid;
  }
  bl.items=valid;
  if(valid.length>=2)bl.kind='bundle';
  const fTodo=valid.find(x=>x.kind==='todo'), fTask=valid.find(x=>x.kind==='task');
  bl.todoId=fTodo?fTodo.id:null;
  bl.taskId=(!fTodo&&fTask)?fTask.id:null;
  bl.done=valid.every(it=>{const r=resolveBlockItem(it); return !!(r&&r.t.done)});
  if(bl.kind==='bundle'&&(!bl.title||/^To-do-Bündel(\s*\(\d+\))?$/.test(bl.title)||!bl._customTitle)){
    bl.title='To-do-Bündel ('+valid.length+')';
  }
  return valid;
}
function syncBlockItemsPlanned(w,d,s,bl){
  blockItems(bl).forEach(it=>{
    const r=resolveBlockItem(it);
    if(r)r.t.planned={wk:w,day:+d,slot:+s};
  });
}
function detachItemFromBlock(w,d,s,kind,id){
  const bs=blocksFor(w), key=d+'|'+s, bl=bs[key];
  if(!bl)return;
  const rem=blockItems(bl).filter(it=>!(it.kind===kind&&it.id===id));
  if(!rem.length){
    if(bl.stack&&bl.stack.length){bl.stack.forEach(sa=>placeApptInSlot(w,+d,+s,sa)); delete bl.stack}
    delete bs[key];
    retireLocalBlockUid(w,+d,+s);
    return;
  }
  bl.items=rem;
  if(rem.length===1&&bl.kind==='bundle'&&!bl._customTitle){
    const r0=resolveBlockItem(rem[0]);
    if(r0){
      if(r0.kind==='todo'){bl.kind='projekt'; bl.projectId=r0.p.id; bl.title=r0.p.name}
      else{bl.kind='task'; bl.projectId=null; bl.title=r0.t.title}
    }
  }
  syncBlockPrimaryFields(bl);
}
function detachItemEverywhere(kind,id,skipW,skipD,skipS){
  const r=resolveBlockItem({kind:kind,id:id});
  if(r&&r.t.planned){
    const pl=r.t.planned;
    if(!(pl.wk===skipW&&+pl.day===+skipD&&+pl.slot===+skipS)){
      detachItemFromBlock(pl.wk,pl.day,pl.slot,kind,id);
    }
    r.t.planned=null;
  }
}
function combineItemIntoBlock(w,d,s,dstBl,item){
  if(!dstBl||!item)return false;
  detachItemEverywhere(item.kind,item.id,w,d,s);
  const cur=blockItems(dstBl);
  if(!cur.some(x=>x.kind===item.kind&&x.id===item.id))cur.push({kind:item.kind,id:item.id});
  dstBl.items=cur;
  if(cur.length>=2)dstBl.kind='bundle';
  syncBlockPrimaryFields(dstBl);
  syncBlockItemsPlanned(w,d,s,dstBl);
  return true;
}
function returnOpenFromBlock(w,d,s){
  const bs=blocksFor(w), key=d+'|'+s, bl=bs[key];
  if(!bl)return {returned:0,kept:0};
  const items=blockItems(bl);
  const openIt=[], doneIt=[];
  items.forEach(it=>{
    const r=resolveBlockItem(it);
    if(!r)return;
    if(r.t.done)doneIt.push(it);
    else{r.t.planned=null; openIt.push(it)}
  });
  if(!openIt.length)return {returned:0,kept:doneIt.length};
  if(!doneIt.length){
    if(bl.stack&&bl.stack.length){bl.stack.forEach(sa=>placeApptInSlot(w,+d,+s,sa)); delete bl.stack}
    delete bs[key];
    retireLocalBlockUid(w,+d,+s);
    return {returned:openIt.length,kept:0};
  }
  bl.items=doneIt;
  if(doneIt.length===1&&!bl._customTitle){
    const r0=resolveBlockItem(doneIt[0]);
    if(r0){
      if(r0.kind==='todo'){bl.kind='projekt'; bl.projectId=r0.p.id; bl.title=r0.p.name}
      else{bl.kind='task'; bl.projectId=null; bl.title=r0.t.title}
    }
  }
  syncBlockPrimaryFields(bl);
  bl.done=true;
  return {returned:openIt.length,kept:doneIt.length};
}
function isSlotInPast(w,d,s){
  const dt=iso(addDays(parseISO(w),+d)), td=todayISO();
  if(dt<td)return true;
  if(dt>td)return false;
  const now=new Date(), hm=pad(now.getHours())+':'+pad(now.getMinutes());
  return hm>(slotWin(+s).e||'22:00');
}
function serializeBlockItems(bl){

}
function parseBlockItemsStr(raw){

  for(const t of S.tasks){if((t.due||includeUndated)&&!t.done&&!t.delegated&&!t.planned)out.push({kind:'task',t:t,p:null})}

function slotWin(s){
  const st=(S&&S.settings&&S.settings.slotTimes)||{};
  return st[s]||{s:['09:00','14:00','19:00'][s],e:['12:00','17:00','22:00'][s]};
}
function parseClock(t){
  if(!t)return null;
  const m=String(t).match(/(\d{1,2}):(\d{2})\s*[–—-]\s*(\d{1,2}):(\d{2})/);
  if(m)return [pad(+m[1])+':'+m[2],pad(+m[3])+':'+m[4]];
  const m2=String(t).match(/(\d{1,2}):(\d{2})/);
  if(m2)return [pad(+m2[1])+':'+m2[2],null];
  return null;
}
function toMin(hm){return +hm.slice(0,2)*60+ +hm.slice(3,5)}
function mapSlotForTime(start,end){
  if(!start&&!end)return -1;
  const cs=start?toMin(start):(end?Math.max(0,toMin(end)-60):0);
  const ce=end?toMin(end):Math.min(1440,cs+60);
  let best=-1,bestOv=0;
  for(let s=0;s<3;s++){
    const w=slotWin(s);
    const ov=Math.max(0,Math.min(toMin(w.e),ce)-Math.max(toMin(w.s),cs));
    if(ov>bestOv){bestOv=ov;best=s}
  }
  if(best>=0)return best;
  const mid=(cs+Math.max(cs,ce))/2;
  const b01=toMin(slotWin(0).e);
  const b12=(toMin(slotWin(1).e)+toMin(slotWin(2).s))/2;
  return mid<b01?0:(mid<b12?1:2);
}
function findAppt(id){
  if(!id)return null;
  for(const w in S.appts){
    const aps=S.appts[w];
    for(const k in aps){
      const o=aps[k]; if(!o)continue;
      if(o.id===id)return {ap:o,w:w,key:k,host:null,stackIdx:-1,inBlock:false};
      if(o.stack){const si=o.stack.findIndex(x=>x&&x.id===id); if(si>=0)return {ap:o.stack[si],w:w,key:k,host:o,stackIdx:si,inBlock:false}}
    }
  }
  for(const w in S.blocks){
    const bs=S.blocks[w];
    for(const k in bs){
      const bl=bs[k];
      if(bl&&bl.stack){const si=bl.stack.findIndex(x=>x&&x.id===id); if(si>=0)return {ap:bl.stack[si],w:w,key:k,host:bl,stackIdx:si,inBlock:true}}
    }
  }

}
function detachAppt(f){
  if(!f)return;
  if(f.inBlock){
    if(f.host&&f.host.stack){f.host.stack.splice(f.stackIdx,1); if(!f.host.stack.length)delete f.host.stack}
    return;
  }
  if(f.stackIdx>=0){
    if(f.host&&f.host.stack)f.host.stack.splice(f.stackIdx,1);
    return;
  }
  const aps=apsFor(f.w), cur=aps[f.key];
  if(cur&&cur.stack&&cur.stack.length){
    const nxt=cur.stack.shift();
    if(cur.stack.length)nxt.stack=cur.stack;
    delete cur.stack;
    aps[f.key]=nxt;
  }else{
    delete aps[f.key];
  }
}

function placeApptInSlot(w,d,s,ap){

  }else{

    if(!cur.stack.some(x=>x&&x.id===ap.id)&&cur.id!==ap.id)cur.stack.push(ap);

}

function apRangeMin(ap){
  if(!ap)return null;
  const raw=ap.t0?apTimeStr(ap.t0,ap.t1):String(ap.time||'');
  let m;
  if((m=raw.match(/^bis\s+(\d{1,2}):(\d{2})/i)))return [0,(+m[1])*60+(+m[2])];
  if((m=raw.match(/^ab\s+(\d{1,2}):(\d{2})/i)))return [(+m[1])*60+(+m[2]),1440];
  const pc=parseClock(raw);
  if(!pc||!pc[0])return null;
  const s=toMin(pc[0]), e=pc[1]?toMin(pc[1]):Math.min(1440,s+60);
  return [s,e>s?e:Math.min(1440,s+30)];
}
function apSortMin(ap){
  const r=apRangeMin(ap);
  return r?r[0]:-1;
}
function apptsInSlot(w,d,s){
  const key=d+'|'+s, aps=S.appts[w]||{}, bs=S.blocks[w]||{};
  const primary=aps[key], bl=bs[key], list=[];
  if(primary){list.push(primary); if(primary.stack)primary.stack.forEach(x=>{if(x)list.push(x)})}
  if(bl&&bl.stack)bl.stack.forEach(x=>{if(x)list.push(x)});
  return list.slice().sort((a,b)=>apSortMin(a)-apSortMin(b));
}
function hasTimeOverlap(list){
  const rs=[];
  for(const ap of list){const r=apRangeMin(ap); if(r&&!(r[0]===0&&r[1]===1440))rs.push(r)}
  rs.sort((a,b)=>a[0]-b[0]);
  for(let i=1;i<rs.length;i++){if(rs[i][0]<rs[i-1][1])return true}
  return false;
}

function collectCurrentItemsMap(){
  const map={};
  if(!S)return map;
  for(const w of Object.keys(S.blocks||{})){
    const bs=S.blocks[w]||{};
    for(const k of Object.keys(bs)){
      const bl=bs[k]; if(!bl)continue;
      const p=k.split('|'), d=+p[0], s=+p[1];
      const copy=Object.assign({},bl);
      delete copy.stack;
      const u=itemUid('block',w+'-'+d+'-'+s);
      map[u]={uid:u,kind:'block',payload:{w:w,day:d,slot:s,block:copy}};
    }
  }
  const pushAp=(w,d,s,ap,stacked)=>{
    if(!ap)return;
    if(!ap.id)ap.id=uid();
    const copy=Object.assign({},ap);
    delete copy.stack;
    const u=itemUid('appt',copy.id);
    map[u]={uid:u,kind:'appt',payload:{w:w,day:d,slot:s,stacked:!!stacked,appt:copy}};
  };
  for(const w of Object.keys(S.appts||{})){
    const aps=S.appts[w]||{};
    for(const k of Object.keys(aps)){
      const o=aps[k]; if(!o)continue;
      const p=k.split('|'), d=+p[0], s=+p[1];
      pushAp(w,d,s,o,false);
      if(Array.isArray(o.stack))o.stack.forEach(sa=>pushAp(w,d,s,sa,true));
    }
  }
  for(const d of Object.keys(S.mit||{})){
    const m=S.mit[d];
    if(!m||!m.text)continue;
    const u=itemUid('mit',d);
    map[u]={uid:u,kind:'mit',payload:{date:d,text:m.text,done:!!m.done}};
  }
  for(const ph of (S.phases||[])){
    if(!ph||!ph.id)continue;
    const u=itemUid('phase',ph.id);
    map[u]={uid:u,kind:'phase',payload:{id:ph.id,start:ph.start,end:ph.end,title:ph.title,desc:ph.desc||'',color:ph.color,colorIndex:validColorIndex(ph.colorIndex)?ph.colorIndex:null}};
  }
  for(const p of (S.projects||[])){
    for(const t of (p.todos||[])){
      if(!t||!t.id)continue;
      const u=itemUid('todo',t.id);
      map[u]={uid:u,kind:'todo',payload:{
        id:t.id,scope:'project',projectId:p.id,projectName:p.name||'',
        title:t.title,done:!!t.done,kanban:t.kanban||'offen',due:t.due||null,start:t.start||null,
        firstStep:t.firstStep||'',delegated:t.delegated||'',est:t.est||null,planned:t.planned||null
      }};
    }
  }
  for(const t of (S.tasks||[])){
    if(!t||!t.id)continue;
    const u=itemUid('todo',t.id);
    map[u]={uid:u,kind:'todo',payload:{
      id:t.id,scope:'task',projectId:null,
      title:t.title,done:!!t.done,kanban:t.kanban||'offen',due:t.due||null,start:t.start||null,
      firstStep:t.firstStep||'',delegated:t.delegated||'',est:t.est||null,planned:t.planned||null
    }};
  }
  const capPayload=capsulePayloadFromState();
  map['theo-capsule@theo-app']={uid:'theo-capsule@theo-app',kind:'capsule',payload:capPayload};
  return map;
}

function guessKindFromUid(u){

  return m?m[1]:'meta';

function refreshDirtySignatures(){
  if(!S)return;
  S.itemMeta=S.itemMeta||{};
  const live=collectCurrentItemsMap();
  for(const u of Object.keys(live)){
    if(u==='theo-capsule@theo-app'&&!S.meta.pulled){
      const cp=live[u].payload;
      const isSeedEmpty=!Object.keys(cp.motto||{}).length&&!cp.inbox.length&&!cp.areas.length&&!cp.projects.length&&!Object.keys(cp.focus||{}).length;
      if(isSeedEmpty)continue;
    }
    const sig=JSON.stringify(live[u].payload);
    const cur=S.itemMeta[u];
    if(!cur||cur.deleted||cur.sig!==sig){
      S.itemMeta[u]={sig:sig,updatedAt:nextIsoTs(),deleted:false,dirty:true,kind:live[u].kind};
    }
  }
  for(const u of Object.keys(S.synced||{})){
    if(u==='theo-capsule@theo-app')continue;
    if(!live[u]&&!S.tomb[u]){
      const prevKind=(S.itemMeta[u]&&S.itemMeta[u].kind)||guessKindFromUid(u);
      S.tomb[u]=1;
      S.itemMeta[u]={sig:'__DELETED__',updatedAt:nextIsoTs(),deleted:true,dirty:true,kind:prevKind};
    }
  }
}

function applyLiveItem(u,kind,payload){

    if(Array.isArray(payload.inbox))S.inbox=payload.inbox;
    if(payload.focus&&typeof payload.focus==='object')S.focus=payload.focus;
    if(Array.isArray(payload.areas))S.areas=payload.areas;
    if(Array.isArray(payload.types)&&payload.types.length)S.types=payload.types.map(normalizeType);
    if(Array.isArray(payload.projects)){
      const existingById={};
      (S.projects||[]).forEach(p=>{existingById[p.id]=p});
      S.projects=payload.projects.map(pm=>{
        const oldP=existingById[pm.id];
        return {
          id:pm.id,
          areaId:pm.areaId||null,
          name:pm.name||'Projekt',
          emoji:pm.emoji||'📋',
          note:pm.note||'',
          views:pm.views||{list:true,kanban:true},
          todos:oldP&&Array.isArray(oldP.todos)?oldP.todos:[]
        };
      });
    }
    if(payload.settings){
      if(payload.settings.aids)S.settings.aids=Object.assign({mit:true,focus:true,year:true},payload.settings.aids);
      if(payload.settings.slotTimes)S.settings.slotTimes=payload.settings.slotTimes;
      if(payload.settings.liveSync)S.settings.liveSync=payload.settings.liveSync;
      if(THEMES.some(t=>t[0]===payload.settings.theme))S.settings.theme=payload.settings.theme;
      if(Array.isArray(payload.settings.modules))S.settings.modules=payload.settings.modules.filter(id=>MODULES.some(m=>m.id===id));
      if(Array.isArray(payload.settings.educationDone))S.settings.educationDone=payload.settings.educationDone.filter(id=>typeof id==='string');
      if(typeof payload.settings.educationHidden==='boolean')S.settings.educationHidden=payload.settings.educationHidden;
      if(typeof payload.settings.showUndated==='boolean')S.settings.showUndated=payload.settings.showUndated;
      if(typeof payload.settings.intro==='boolean')S.meta.intro=payload.settings.intro;
    }
    return;
  }
  if(kind==='block'){
    const w=payload.w, d=+payload.day, s=+payload.slot;
    if(!w||!Number.isFinite(d)||!Number.isFinite(s)||!payload.block)return;
    blocksFor(w)[d+'|'+s]=Object.assign({},payload.block);
    return;
  }
  if(kind==='appt'){
    const ap=payload.appt;
    if(!ap||!ap.id||!payload.w)return;
    const oldF=findAppt(ap.id);
    if(oldF)detachAppt(oldF);
    placeApptInSlot(payload.w,+payload.day,+payload.slot,Object.assign({},ap));
    return;
  }
  if(kind==='mit'){
    if(payload.date&&payload.text)S.mit[payload.date]={text:payload.text,done:!!payload.done};
    return;
  }
  if(kind==='phase'){
    if(!payload.id)return;
    const idx=S.phases.findIndex(x=>x.id===payload.id);
    const phObj={id:payload.id,start:payload.start,end:payload.end,title:payload.title,desc:payload.desc||'',color:payload.color||PHC[0]};
    if(validColorIndex(payload.colorIndex))phObj.colorIndex=payload.colorIndex;
    if(idx>=0)S.phases[idx]=phObj;
    else S.phases.push(phObj);
    return;
  }
  if(kind==='todo'){
    if(!payload.id)return;
    const cleanTodo={
      id:payload.id,
      title:payload.title||'Aufgabe',
      done:!!payload.done,
      kanban:payload.kanban||(payload.done?'fertig':'offen'),
      due:payload.due||null,
      start:payload.start||null,
      firstStep:payload.firstStep||'',
      delegated:payload.delegated||'',
      est:payload.est||null,
      planned:payload.planned||null
    };
    if(payload.scope==='project'&&payload.projectId){
      S.tasks=S.tasks.filter(x=>x.id!==payload.id);
      let proj=projOf(payload.projectId);
      if(!proj){
        proj={id:payload.projectId,areaId:null,name:payload.projectName||'Projekt',emoji:'📋',note:'',views:{list:true,kanban:true},todos:[]};
        S.projects.push(proj);
      }
      S.projects.forEach(p=>{if(p.id!==proj.id)p.todos=p.todos.filter(x=>x.id!==payload.id)});
      const ti=proj.todos.findIndex(x=>x.id===payload.id);
      if(ti>=0)proj.todos[ti]=Object.assign(proj.todos[ti],cleanTodo);
      else proj.todos.push(cleanTodo);
    }else{
      S.projects.forEach(p=>{p.todos=p.todos.filter(x=>x.id!==payload.id)});
      const ti=S.tasks.findIndex(x=>x.id===payload.id);
      if(ti>=0)S.tasks[ti]=Object.assign(S.tasks[ti],cleanTodo);
      else S.tasks.push(cleanTodo);
    }
  }
}

function applyDeletedItem(u,kind){
  S.tomb[u]=1;
  if(kind==='block'){
    const m=u.match(/^theo-block-(\d{4}-\d{2}-\d{2})-(\d)-(\d)@theo-app$/);
    if(m&&S.blocks[m[1]])delete S.blocks[m[1]][m[2]+'|'+m[3]];
    return;
  }
  if(kind==='appt'){
    const m=u.match(/^theo-appt-(.+)@theo-app$/);
    if(m){const f=findAppt(m[1]); if(f)detachAppt(f)}
    return;
  }
  if(kind==='mit'){
    const m=u.match(/^theo-mit-(\d{4}-\d{2}-\d{2})@theo-app$/);
    if(m)delete S.mit[m[1]];
    return;
  }
  if(kind==='phase'){
    const m=u.match(/^theo-phase-(.+)@theo-app$/);
    if(m)S.phases=S.phases.filter(x=>x.id!==m[1]);
    return;
  }
  if(kind==='todo'){
    const m=u.match(/^theo-todo-(.+)@theo-app$/);
    if(m){
      const tid=m[1];
      const f=findTodo(tid);
      if(f){
        if(f.t.planned)detachItemFromBlock(f.t.planned.wk,f.t.planned.day,f.t.planned.slot,'todo',tid);
        f.p.todos=f.p.todos.filter(x=>x.id!==tid);
      }
      const tk=S.tasks.find(x=>x.id===tid);
      if(tk&&tk.planned)detachItemFromBlock(tk.planned.wk,tk.planned.day,tk.planned.slot,'task',tid);
      S.tasks=S.tasks.filter(x=>x.id!==tid);
    }
  }
}

async function pushAll(){
  if(ui.demoMode)return {ok:0,fail:0,skipped:true};
  const sb=getDataClient(AUTH.session);
  if(!sb||!AUTH.session||!AUTH.user||!isOnlineNow())return {ok:0,fail:0,offline:true};
  const stateAtStart=S, userAtStart=AUTH.user.id;
  refreshDirtySignatures();
  const live=collectCurrentItemsMap();
  const batch=[];
  for(const u of Object.keys(S.itemMeta||{})){
    const meta=S.itemMeta[u];
    if(!meta||!meta.dirty)continue;
    /* R13b Neugeräte-Schutz: Vor der ersten Server-Lesung niemals die Kapsel überschreiben! */
    if(u==='theo-capsule@theo-app'&&!S.meta.pulled)continue;
    if(meta.deleted||S.tomb[u]){
      batch.push({
        uid:u,
        kind:meta.kind||guessKindFromUid(u),
        payload:{},
        updated_at:meta.updatedAt||nextIsoTs(),
        deleted:true
      });
    }else if(live[u]){
      batch.push({
        uid:u,
        kind:live[u].kind,
        payload:live[u].payload,
        updated_at:meta.updatedAt||nextIsoTs(),
        deleted:false
      });
    }
  }
  if(!batch.length){
    if(S.meta.pulled)S.meta.dirty=false;
    saveQuiet();
    return {ok:0,fail:0};
  }
  const {data,error}=await sb.rpc('upsert_user_items',{p_items:batch});
  if(S!==stateAtStart||!AUTH.user||AUTH.user.id!==userAtStart)return {ok:0,fail:0,canceled:true};
  if(error)return {ok:0,fail:batch.length,error:error.message||'Schreibfehler'};

  const returnedByUid={};
  if(Array.isArray(data))data.forEach(r=>{if(r&&r.uid)returnedByUid[r.uid]=r});
  batch.forEach(b=>{
    const m=S.itemMeta[b.uid];
    if(m&&m.updatedAt===b.updated_at){
      m.dirty=false;
      const srv=returnedByUid[b.uid];
      if(srv&&srv.updated_at)m.updatedAt=srv.updated_at;
    }
    if(b.deleted)delete S.synced[b.uid];
    else S.synced[b.uid]=1;
  });
  const stillDirty=Object.keys(S.itemMeta||{}).some(k=>S.itemMeta[k]&&S.itemMeta[k].dirty&&(S.meta.pulled||k!=='theo-capsule@theo-app'));
  S.meta.dirty=stillDirty;
  saveQuiet();
  return {ok:batch.length,fail:0};
}

async function pullAll(forceFull){
  if(ui.demoMode)return {ok:true,applied:0};
  const sb=getDataClient(AUTH.session);
  if(!sb||!AUTH.session||!AUTH.user||!isOnlineNow())return {ok:false,offline:true,applied:0};
  const stateAtStart=S, userAtStart=AUTH.user.id;
  const wasUnpulled=!S.meta.pulled;
  let query=sb.from('items').select('uid,kind,payload,updated_at,synced_at,deleted');
  if(!wasUnpulled&&!forceFull&&S.meta.lastPullCursor){
    const curMs=Date.parse(S.meta.lastPullCursor);
    if(Number.isFinite(curMs)){
      query=query.gte('synced_at',new Date(Math.max(0,curMs-2000)).toISOString());
    }
  }
  const {data,error}=await query;
  if(S!==stateAtStart||!AUTH.user||AUTH.user.id!==userAtStart)return {ok:false,canceled:true,applied:0};
  if(error)return {ok:false,error:error.message||'Lesefehler',applied:0};

  const rows=Array.isArray(data)?data.slice():[];
  const orderRank={capsule:0,phase:1,mit:2,todo:3,block:4,appt:5,meta:6};
  rows.sort((a,b)=>(orderRank[a.kind]??9)-(orderRank[b.kind]??9));

  let applied=0, maxSynced=S.meta.lastPullCursor||'';
  for(const r of rows){
    if(!r||!r.uid)continue;
    if(r.synced_at&&(!maxSynced||Date.parse(r.synced_at)>Date.parse(maxSynced)))maxSynced=r.synced_at;
    const u=normalizeItemUid(r.uid,r.kind);
    const localM=S.itemMeta&&S.itemMeta[u];
    const srvMs=Date.parse(r.updated_at||0)||0;
    const locMs=localM?(Date.parse(localM.updatedAt||0)||0):0;

    const serverWins=(wasUnpulled&&(!localM||u==='theo-capsule@theo-app'))||!localM||(!localM.dirty&&srvMs>locMs)||(localM.dirty&&srvMs>=locMs);
    if(!serverWins)continue;

    if(r.deleted){
      applyDeletedItem(u,r.kind);
      delete S.synced[u];
      S.itemMeta[u]={sig:'__DELETED__',updatedAt:r.updated_at,deleted:true,dirty:false,kind:r.kind};
      applied++;
    }else{
      const sig=JSON.stringify(r.payload||{});
      const changed=!localM||localM.deleted||localM.sig!==sig;
      applyLiveItem(u,r.kind,r.payload||{});
      S.synced[u]=1;
      S.itemMeta[u]={sig:sig,updatedAt:r.updated_at,deleted:false,dirty:false,kind:r.kind};
      if(changed)applied++;
    }
  }

  S.meta.pulled=true;
  if(maxSynced)S.meta.lastPullCursor=maxSynced;
  const capSig=JSON.stringify(capsulePayloadFromState());
  if(!S.itemMeta['theo-capsule@theo-app']){
    S.itemMeta['theo-capsule@theo-app']={sig:capSig,updatedAt:nextIsoTs(),deleted:false,dirty:rows.every(r=>r.uid!=='theo-capsule@theo-app'),kind:'capsule'};
  }
  saveQuiet();
  return {ok:true,applied:applied,total:rows.length};
}

function schedulePush(){
  if(ui.demoMode)return;
  if(SYNC.pushTimer)clearTimeout(SYNC.pushTimer);
  SYNC.pushTimer=setTimeout(async()=>{
    SYNC.pushTimer=null;
    if(!AUTH.session||!isOnlineNow()){
      SYNC.msg=isOnlineNow()?'Lokale Änderung gespeichert':'📴 Offline im Gerät gespeichert — synchronisiert automatisch bei Verbindung';
      return;
    }
    if(!S.meta.pulled){
      await syncCycle(false);
      return;
    }
    const r=await pushAll();
    if(r&&r.ok>0){
      SYNC.last=new Date(); SYNC.healthy=true;
      SYNC.msg='⏏ direkt synchronisiert ('+r.ok+')';
      safeBgRender();
    }else if(r&&r.fail){SYNC.healthy=false; SYNC.msg='Schreiben fehlgeschlagen'; safeBgRender()}
  },1800);
}

async function syncCycle(forceFull){
  if(ui.demoMode)return;
  if(SYNC.running&&SYNC.promise)return SYNC.promise;
  if(!isOnlineNow()){
    SYNC.msg='📴 Offline — deine Änderungen sind lokal sicher und synchronisieren automatisch, sobald du wieder online bist.';
    safeBgRender();
    return;
  }
  const sb=getSupabaseClient();
  if(!sb||!AUTH.session)return;
  const stateAtStart=S, userAtStart=AUTH.user&&AUTH.user.id;
  const stale=()=>S!==stateAtStart||!AUTH.user||AUTH.user.id!==userAtStart||ui.demoMode;
  SYNC.running=true;
  SYNC.promise=(async()=>{
    try{
      const revBefore=S.capsuleTs||0;
      let parts=[];
      if(S.meta.pulled&&S.meta.dirty){
        const pr=await pushAll();
        if(stale())return;
        if(pr.fail)parts.push('✖ Schreiben fehlgeschlagen');
        else if(pr.ok)parts.push('geschrieben '+pr.ok);
      }
      if((S.capsuleTs||0)!==revBefore){
        SYNC.msg=(parts.join(' · ')||'aktiv')+' · Eingabe aktiv — Abruf wartet kurz';
        return;
      }
      const pl=await pullAll(!!forceFull);
      if(stale())return;
      if(!pl.ok){
        SYNC.healthy=false; SYNC.msg='Abruf pausiert: '+(pl.error||'offline'); safeBgRender();
        return;
      }
      parts.push(pl.applied?('aktualisiert '+pl.applied):'synchron');
      const hasPending=Object.keys(S.itemMeta||{}).some(k=>S.itemMeta[k]&&S.itemMeta[k].dirty);
      if(hasPending){
        const pr2=await pushAll();
        if(stale())return;
        if(pr2.fail)parts.push('✖ Schreiben fehlgeschlagen');
        else if(pr2.ok)parts.push('geschrieben '+pr2.ok);
      }
      SYNC.last=new Date(); SYNC.healthy=!parts.some(x=>x.includes('fehlgeschlagen'));
      SYNC.msg=parts.join(' · ');
      safeBgRender();
    }catch(e){
      SYNC.healthy=false; SYNC.msg='Verbindung wird gleich erneut geprüft'; safeBgRender();
    }finally{
      SYNC.running=false;
      SYNC.promise=null;
      if(stale()&&AUTH.session&&!ui.demoMode)setTimeout(()=>syncCycle(true),0);
    }
  })();
  return SYNC.promise;
}

function syncStatusText(){
  if(ui.demoMode)return 'Lokale Vorschau (nicht mit Server verbunden)';
  if(!isOnlineNow())return 'Offline-Modus aktiv — Änderungen liegen sicher im Browser und synchronisieren automatisch';
  if(!AUTH.session)return 'Nicht angemeldet';
  const t=SYNC.last?pad(SYNC.last.getHours())+':'+pad(SYNC.last.getMinutes())+':'+pad(SYNC.last.getSeconds()):'noch kein Abgleich';
  return 'Frankfurt (EU) · Letzter Abgleich '+t+(SYNC.msg?' · '+SYNC.msg:'');
}

function startSync(){

  if(ls.on&&!ui.demoMode){
    SYNC.timer=setInterval(()=>syncCycle(false),Math.max(15,ls.interval||60)*1000);
  }
}

function bindAuthSession(session){
  const previousOwner=AUTH.user&&AUTH.user.id;
  if(!session||!session.user||session.user.id!==previousOwner){SYNC.healthy=false; SYNC.last=null}
  if((!session||!session.user||session.user.id!==previousOwner)&&globalThis.THEO_ADMIN)globalThis.THEO_ADMIN.reset();
  AUTH.session=session||null;
  AUTH.user=(session&&session.user)||null;
  if(AUTH.user){
    const wasDemo=ui.demoMode;
    ui.demoMode=false;
    if(storeOk&&AUTH.user.email){
      try{localStorage.setItem('theo-last-auth-email',AUTH.user.email); localStorage.setItem('theo-last-auth-id',AUTH.user.id)}catch(e){}
      AUTH.offlineTrustedEmail=AUTH.user.email;
    }
    if(wasDemo||!S||!S.meta||S.meta.ownerId!==AUTH.user.id){
      const legacy=load();
      S=loadUserState(AUTH.user.id)||(legacy&&legacy.meta&&legacy.meta.v===4&&legacy.meta.ownerId===AUTH.user.id?normalizeState(legacy):seed());
    }
    if(storeOk){try{if(localStorage.getItem('theo-profile-owner')!==AUTH.user.id)ui.profile=null}catch(e){ui.profile=null}}
    if(S){
      S.meta.ownerId=AUTH.user.id;
      saveQuiet();
    }
  }
}

async function bootAuthAndSync(){
  if(storeOk){
    try{
      AUTH.offlineTrustedEmail=localStorage.getItem('theo-last-auth-email')||'';
      if(!isOnlineNow()&&AUTH.offlineTrustedEmail){const id=localStorage.getItem('theo-last-auth-id'); const cached=loadUserState(id); if(cached){S=cached;if(globalThis.THEO_ADMIN){try{globalThis.THEO_ADMIN.access=JSON.parse(localStorage.getItem('theo-feature-access-'+id)||'null')}catch(e){}}} else AUTH.offlineTrustedEmail=''}
      const pc=localStorage.getItem('theo-profile-cache');
      if(pc)ui.profile=JSON.parse(pc);
    }catch(e){}
  }

  if(typeof location!=='undefined'){
    try{
      const sp=new URLSearchParams(location.search||'');
      const hp=new URLSearchParams((location.hash||'').replace(/^#/,''));
      if(sp.get('mode')==='register')ui.authMode='register';
      if(sp.get('mode')==='demo'){ui.demoSurvey=true; ui.demoStart=sp.get('start')==='wissen'?'wissen':null}
      const errCode=sp.get('error_code')||hp.get('error_code')||'';
      const errDesc=sp.get('error_description')||hp.get('error_description')||'';
      if(errCode==='otp_expired'||/expired|invalid/i.test(errDesc)){
        ui.authStep='expired';
      }
      if(sp.get('account')==='delete_invalid'||sp.get('account')==='delete_expired'){
        setTimeout(()=>toast('Dieser Lösch-Link ist abgelaufen. Bitte fordere bei Bedarf unter Konfiguration einen neuen an.'),250);
      }
      if(sp.get('billing')==='success'){
        setTimeout(()=>toast('Danke für dein Vertrauen — dein Abo-Status wird gerade aktualisiert.'),300);
      }
    }catch(e){}
  }

  let cfg=globalThis.__THEO_BOOT_CFG__||null;
  if(!cfg&&storeOk){
    try{const raw=localStorage.getItem('theo-pub-cfg'); if(raw)cfg=JSON.parse(raw)}catch(e){}
  }
  if(isOnlineNow()&&typeof fetch==='function'&&typeof location!=='undefined'&&/^https?:$/i.test(location.protocol||'')){
    try{
      const r=await fetch('/api/config',{headers:{'Accept':'application/json'}});
      if(r.ok){
        const fresh=await r.json();
        if(fresh&&fresh.supabaseUrl){
          cfg=fresh;
          if(storeOk){try{localStorage.setItem('theo-pub-cfg',JSON.stringify(fresh))}catch(e){}}
        }
      }
    }catch(e){}
  }
  AUTH.cfg=cfg;

  const sb=isOnlineNow()?getSupabaseClient():null;
  if(sb&&sb.auth){
    try{
      const {data}=await sb.auth.getSession();
      if(data&&data.session)bindAuthSession(data.session);
      sb.auth.onAuthStateChange((_ev,session)=>{
        const previousUser=AUTH.user&&AUTH.user.id;
        bindAuthSession(session);
        render();
        if(session&&session.user&&globalThis.THEO_ADMIN)setTimeout(()=>globalThis.THEO_ADMIN.init(),0);
        if(session&&session.user&&session.user.id!==previousUser){
          fetchAccountProfile();
          syncCycle(true);
          startSync();
        }
      });
    }catch(e){}
  }

  AUTH.ready=true;
  render();
  if(AUTH.session){
    if(globalThis.THEO_ADMIN)globalThis.THEO_ADMIN.init();
    fetchAccountProfile();
    syncCycle(false);
    startSync();
  }
}

function getBlocks(){return S.blocks[wk()]||(S.blocks[wk()]={})}
function getBlocksW(w){return S.blocks[w]||{}}
function getAppts(){return S.appts[wk()]||(S.appts[wk()]={})}
function isAsApptBlock(bl){
  if(!bl||!bl.typeId)return false;
  const t=typeOf(bl.typeId);
  return !!(t&&t.asAppt);
}
function realBlockAt(w,d,s){
  const b=blocksFor(w)[d+'|'+s];
  return (b&&!isAsApptBlock(b))?b:null;
}
function evictAsApptBlock(w,d,s,keepBlockUid){
  const key=d+'|'+s, cur=blocksFor(w)[key];
  if(!cur||!isAsApptBlock(cur))return;
  if(!keepBlockUid)retireLocalBlockUid(w,d,s);
  delete blocksFor(w)[key];
  const tm=cur.t0?apTimeStr(cur.t0,cur.t1):'—';
  const ap={id:cur.id||uid(),day:d,slot:s,title:cur.title||'Termin',time:tm,ampel:cur.ampel||null,src:'Manuell',areaId:null,span:cur.span||1,typeId:cur.typeId||null,fb:cur.fb||null,fbNote:cur.fbNote||cur.note||''};
  if(cur.t0){ap.t0=cur.t0; if(cur.t1)ap.t1=cur.t1}
  placeApptInSlot(w,d,s,ap);
}
function setBlockW(w,d,s,bl){
  if(!isAsApptBlock(bl)){
    for(let k=0;k<(bl.span||1);k++)if(s+k<3)evictAsApptBlock(w,d,s+k,k===0);
  }
  clearTomb(itemUid('block',w+'-'+d+'-'+s));
  blocksFor(w)[d+'|'+s]=bl;
  save();
}
function coveredByW(w,d,s){
  const bs=blocksFor(w),aps=apsFor(w);
  for(let k=1;k<=2;k++){
    const sk=s-k; if(sk<0)break;
    const b=bs[d+'|'+sk]; if(b&&(b.span||1)>k)return {title:b.title||'Block',slot:sk};
    const a=aps[d+'|'+sk]; if(a&&(a.span||1)>k)return {title:a.title,slot:sk};
  }
  return null;
}
function slotOccW(w,d,s){return blocksFor(w)[d+'|'+s]||apsFor(w)[d+'|'+s]||coveredByW(w,d,s)}
function blockOccW(w,d,s){return !!(realBlockAt(w,d,s)||coveredByW(w,d,s))}
function blockSpanRoomW(w,d,s,span,ignoreKey){
  if(s+(span||1)>3)return false;
  for(let k=0;k<(span||1);k++){
    const sk=s+k, key=d+'|'+sk;
    if(key===ignoreKey)continue;
    if(realBlockAt(w,d,sk))return false;
    const cov=coveredByW(w,d,sk);
    if(cov&&(d+'|'+cov.slot)!==ignoreKey)return false;
  }
  return true;
}
function spanRoomW(w,d,s,span){
  for(let k=1;k<span;k++){
    const sk=s+k;
    if(sk>2)return false;
    if(blocksFor(w)[d+'|'+sk]||apsFor(w)[d+'|'+sk])return false;
  }
  return true;
}
function findFreeSlot(w,d,span){
  for(let s=0;s<3;s++){
    if(blocksFor(w)[d+'|'+s]||apsFor(w)[d+'|'+s])continue;
    if(spanRoomW(w,d,s,span))return s;
  }
  return -1;
}
function fmtDaySlotW(w,d,s){const dt=addDays(parseISO(w),d); return fmtDate(dt)+' · '+SLOTS[s].label}
function readSpan(){
  const sel=document.getElementById('f-span');
  return sel?Math.max(1,Math.min(3,parseInt(sel.value,10)||1)):1;
}
function readSpanForType(t){
  const sel=document.getElementById('f-span');
  const v=sel?parseInt(sel.value,10):0;
  if(v>=1)return Math.min(3,v);
  return Math.max(1,Math.min(3,(t&&t.defSpan)||1));
}
function phaseOf(dstr){let best=null; for(const p of S.phases){if(p.start<=dstr&&dstr<=p.end){if(!best||p.start>best.start)best=p}} return best}
/* Alle Phasen, die an einem Tag aktiv sind — Überlappungen sind erlaubt und werden mit „ | “ angezeigt */
function activePhases(dstr){return S.phases.filter(p=>p.start<=dstr&&dstr<=p.end).sort((a,b)=>a.start<b.start?-1:1)}
function fmtDaySlot(d,s){const dt=addDays(ui.anchor,d); return fmtDate(dt)+' · '+SLOTS[s].label}
function fmtPlanChip(pl){const d=addDays(parseISO(pl.wk),pl.day); return DAYSHORT[dayIdx(d)]+' '+d.getDate()+'.'+(d.getMonth()+1)+'. · '+SLOTS[pl.slot].label.split(' ')[0]}
function isCurrentWeek(){return wk()===iso(mondayOf(new Date()))}

function renderGantt(p){
  const items=[];
  for(const t of p.todos){
    if(t.done)continue;
    const E=estDays(t);
    const span=Math.max(1,Math.ceil(E)||1);
    const st=t.start||todayISO();
    const en=iso(addDays(parseISO(st),span-1));
    items.push({t:t,st:st,en:en,du:t.due||null,span:span,E:E});
  }
  const today=todayISO();
  let min=today, max=today;
  items.forEach(it=>{
    if(it.st<min)min=it.st; if(it.en>max)max=it.en;
    if(it.du){if(it.du>max)max=it.du; if(it.du<min)min=it.du}
    if(it.st>max)max=it.st;
  });
  let s0=iso(addDays(parseISO(min),-2)), s1=iso(addDays(parseISO(max),4));
  if(!items.length){s0=iso(addDays(new Date(),-2)); s1=iso(addDays(new Date(),17))}
  const N=Math.min(140,Math.round((parseISO(s1)-parseISO(s0))/86400000)+1);
  const D=36, LW=220;
  let h='<div class="gcap"><span class="gi"><span style="display:inline-block;width:26px;height:10px;border-radius:5px;background:#CBB389"></span> geschätzte Dauer</span><span class="gi" style="color:var(--ink)">▼ Deadline (bleibt fix)</span><span class="gi"><span style="display:inline-block;width:2px;height:12px;background:#C98D76"></span> heute</span><span class="gi">Leiste ziehen (Desktop) oder ‹ › — verschiebt nur den Start.</span></div>';
  h+='<div class="ganttWrap"><div class="gantt" style="width:'+(LW+N*D)+'px">';
  h+='<div class="ghead"><div class="gheadLbl">Vorhaben</div><div class="gheadTrack" style="width:'+(N*D)+'px">';
  for(let i=0;i<N;i++){
    const dstr=iso(addDays(parseISO(s0),i)), dt=parseISO(dstr);
    h+='<div class="gday'+(dayIdx(dt)>=5?' wknd':'')+(dstr===today?' today':'')+'">'+dt.getDate()+'<br>'+DAYSHORT[dayIdx(dt)]+'</div>';
  }
  h+='</div></div>';
  if(!items.length)h+='<div class="grow"><div class="growLbl sub" style="width:'+LW+'px">Noch keine offenen Vorhaben — Zeitachse leer.</div><div class="growTrack" style="width:'+(N*D)+'px"></div></div>';
  items.forEach(it=>{
    const i0=Math.round((parseISO(it.st)-parseISO(s0))/86400000);
    const len=it.span;
    const ar=areaOf(p);
    h+='<div class="grow"><div class="growLbl"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1" title="'+esc(it.t.title)+'">'+esc(it.t.title)+'</span><span class="pc">'+(it.E?'≈'+(Math.round(it.E*10)/10)+' T':'—')+(it.t.delegated?' · ↗':'')+'</span><span class="gmove"><button class="xbtn" data-act="ganttMove" data-pid="'+p.id+'" data-tid="'+it.t.id+'" data-d="-1" title="1 Tag früher">‹</button><button class="xbtn" data-act="ganttMove" data-pid="'+p.id+'" data-tid="'+it.t.id+'" data-d="1" title="1 Tag später">›</button></span></div>'+
      '<div class="growTrack" style="width:'+(N*D)+'px">';
    for(let i=0;i<N;i++){
      const dstr=iso(addDays(parseISO(s0),i));
      h+='<div class="gcell'+(dayIdx(parseISO(dstr))>=5?' wknd':'')+'" style="left:'+(i*D)+'px" data-drop="g" data-date="'+dstr+'"></div>';
    }
    h+='<div class="gbar" style="left:'+(i0*D+2)+'px;width:'+(len*D-4)+'px;background:'+(ar?itemColor(ar):themePalette()[0])+'" draggable="true" data-drag="gtodo:'+p.id+'|'+it.t.id+'" data-act="editTodoSheet" data-kind="todo" data-id="'+it.t.id+'" title="Klicken: Vorhaben bearbeiten · ziehen oder ‹ ›: Start verschieben"><span class="gbt">'+esc(it.t.title.slice(0,Math.max(0,Math.floor((len*D-20)/6.2))))+'</span></div>';
    if(it.du){
      const iD=Math.round((parseISO(it.du)-parseISO(s0))/86400000);
      if(iD>=0&&iD<N)h+='<div class="gdue" style="left:'+((iD+1)*D-8)+'px"></div>';
    }
    if(today>=s0&&today<=s1){
      const iT=Math.round((parseISO(today)-parseISO(s0))/86400000);
      h+='<div class="gtoday" style="left:'+(iT*D+D/2)+'px"></div>';
    }
    h+='</div></div>';

  rawItems.forEach(it=>{
    const ap=it.ap;
    if(ap&&ap.multiTotal>1&&ap.multiId){
      const gk=ap.multiId;
      if(seenMulti[gk])return;
      seenMulti[gk]=1;
      items.push({w:it.w,day:it.day,slot:it.slot,ap:ap,date:ap.multiStart||it.date,endDate:ap.multiEnd||it.date,multiTotal:ap.multiTotal});
    }else{
      items.push(Object.assign({},it,{endDate:it.date}));
    }
  });
  const monEnd=iso(new Date(new Date().getFullYear(),new Date().getMonth()+1,0));

  const inRange=(it,r)=>{

    }else{
      const isMulti=it.endDate&&it.endDate>it.date;

function allApptItems(){
  const out=[];
  for(const w in S.appts){
    const aps=S.appts[w];
    for(const k in aps){
      const ap=aps[k]; if(!ap)continue;
      const date=iso(addDays(parseISO(w),ap.day));
      out.push({w:w,day:ap.day,slot:ap.slot,ap:ap,date:date});
      if(ap.stack)ap.stack.forEach(sa=>{if(sa)out.push({w:w,day:sa.day,slot:sa.slot,ap:sa,date:iso(addDays(parseISO(w),sa.day))})});
    }
  }
  /* Blocktypen mit „wie Termin“-Flag (z. B. 1:1-Termin) erscheinen ebenfalls bei Termine; Legacy-Block-Stacks mitnehmen */
  for(const w in S.blocks){
    const bs=S.blocks[w];
    for(const k in bs){
      const bl=bs[k]; if(!bl)continue;
      if(bl.stack)bl.stack.forEach(sa=>{if(sa)out.push({w:w,day:sa.day,slot:sa.slot,ap:sa,date:iso(addDays(parseISO(w),sa.day))})});
      const ty=bl.typeId?typeOf(bl.typeId):null;
      if(!ty||!ty.asAppt)continue;
      const p=k.split('|');
      const date=iso(addDays(parseISO(w),+p[0]));
      out.push({w:w,day:+p[0],slot:+p[1],bl:bl,date:date});
    }
  }
  out.sort((x,y)=>x.date<y.date?-1:(x.date>y.date?1:(x.slot!==y.slot?x.slot-y.slot:(apSortMin(x.ap)-apSortMin(y.ap)))));
  return out;
}

// Count planned entries by their start date, once per block or appointment (including stacks).
function yearDayCounts(year){
  const out={};
  function add(w,day,item,isAppointment){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(w)||!Number.isInteger(day)||day<0||day>6||!item)return;
    const date=iso(addDays(parseISO(w),day)); if(date.slice(0,4)!==String(year))return;
    const entry=out[date]||(out[date]={rot:0,orange:0,gelb:0,gruen:0,none:0,appointments:0});
    const color=['rot','orange','gelb','gruen'].includes(item.ampel)?item.ampel:'none'; entry[color]++;
    if(isAppointment)entry.appointments++;
  }
  for(const w in S.blocks){for(const key in S.blocks[w]){const bl=S.blocks[w][key]; if(!bl)continue; const day=Number(key.split('|')[0]); add(w,day,bl,isAsApptBlock(bl)); (bl.stack||[]).forEach(ap=>add(w,Number.isInteger(ap.day)?ap.day:day,ap,true))}}
  for(const w in S.appts){for(const key in S.appts[w]){const ap=S.appts[w][key]; if(!ap)continue; const day=Number(key.split('|')[0]); add(w,Number.isInteger(ap.day)?ap.day:day,ap,true); (ap.stack||[]).forEach(x=>add(w,Number.isInteger(x.day)?x.day:day,x,true))}}
  return out;
}

    '<div class="cfgRow"><span class="lbl">Angemeldet als</span><b class="grow">'+esc((AUTH.user&&AUTH.user.email)||AUTH.offlineTrustedEmail||(ui.demoMode?'Lokale Vorschau (nicht angemeldet)':'—'))+'</b>'+

    '</div>'+
    '<label class="checkrow" style="padding:0 10px"><input type="checkbox" data-field="liveOn"'+(ls.on?' checked':'')+'><span>Automatische Hintergrund-Synchronisation zwischen deinen Geräten</span></label>'+
    '<div class="cfgRow"><span class="lbl">Abgleich-Intervall</span><select class="inp slim" data-field="liveInterval">'+[[30,'30 Sekunden'],[60,'60 Sekunden'],[300,'5 Minuten']].map(o=>'<option value="'+o[0]+'"'+((ls.interval||60)===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><button class="btn mini" data-act="syncNow">Jetzt synchronisieren</button></div>'+
    (!ui.demoMode&&AUTH.user?'<div class="cfgRow"><span class="grow">Passwort für die Anmeldung</span><button class="btn mini" data-act="openSetPassword">Passwort setzen / ändern</button></div>':'')+
    '<div class="cfgRow" style="flex-wrap:wrap;gap:10px">'+
      '<span class="lbl">Tarif &amp; Schutz</span>'+
      '<span class="pricePill">🔒 Bestandsschutz: '+lockedEur+' €/Monat · '+(lockedEur*10)+' €/Jahr</span>'+
      '<span class="sub">Status: <b>'+esc(statusLabel)+'</b></span>'+
    '</div>'+
    '<div class="cfgRow" style="flex-wrap:wrap;gap:8px">'+
      '<button class="btn mini primary" data-act="startCheckout" data-interval="month">Monatsabo ('+lockedEur+' €/Monat)</button>'+

  h+='<div class="sheetBtns">'+
    '<button class="btn primary" data-act="exportAccountJson">📦 Gesamten Datenbestand herunterladen (JSON)</button>'+

function openSheet(h){$('#overlay').innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+h+'</div>'; $('#overlay').classList.add('on'); document.body.classList.add('modal-open')}
function closeModal(){document.body.classList.remove('modal-open'); $('#overlay').classList.remove('on'); $('#overlay').innerHTML=''; ui.ampCtx=null; ui.ampSel=null; ui.ampSelK=null}

function sheetTypeAppt(d,s,tid,span,preTitle){
  const t=typeOf(tid); if(!t)return;
  normalizeType(t);
  const sugs=typeSuggestions(tid,5);
  const fitTime=slotTimeFitsSlot(t.defT0,t.defT1,s,span);
  let h='<div class="shead"><h3>'+t.emoji+' '+esc(t.name)+'</h3><div class="sub">'+esc(fmtDaySlot(d,s))+' — dieser Typ verhält sich wie ein Termin: erscheint im Termin-Stil, unten bei Termine, und lässt parallel einen Block im selben Abschnitt zu.</div></div>';
  h+='<label class="f">Titel</label><input class="inp" id="ta-title" value="'+esc(preTitle||t.name)+'">';
  if(sugs.length){
    h+='<div class="subChips"><span class="pc" style="align-self:center">Schnellwahl:</span>'+sugs.map(sg=>'<button type="button" class="subChip" data-act="pickTitleSug" data-target="ta-title" data-val="'+esc(sg.label)+'">'+(sg.pinned?'📌 ':'')+esc(sg.label)+'</button>').join('')+'</div>';
  }
  h+='<label class="f">Notiz / Thema (optional)</label><input class="inp" id="ta-note" value="'+esc(t.defNote||'')+'" placeholder="optional, z. B. Agenda, Ort, Vorbereitung">';
  h+='<label class="f">Uhrzeit im 15-Min-Raster (optional — ohne Angabe zählt das Blockfenster '+slotWin(s).s+'–'+slotWin(s).e+')</label><div class="row2">'+timePickHtml(fitTime?(t.defT0||''):'','id="ta-t0" style="flex:1;min-width:125px"','— Start —')+'<span class="pc">–</span>'+timePickHtml(fitTime?(t.defT1||''):'','id="ta-t1" style="flex:1;min-width:125px"','— Ende —')+'</div>';
  h+='<label class="f">Dauer</label><select class="inp slim" id="ta-span">'+[1,2,3].map(v=>'<option value="'+v+'"'+(v===span?' selected':'')+'>'+(v===1?'1 Block':(v===2?'2 Blöcke':'3 Blöcke — ganzer Tag'))+'</option>').join('')+'</select>';
  h+='<div class="sheetBtns"><button class="btn primary" data-default-submit="1" data-act="typeApptSave" data-day="'+d+'" data-slot="'+s+'" data-tid="'+tid+'">Eintragen</button><button class="btn ghost" data-act="closeModal">Abbrechen</button></div>';
  openSheet(h);
  const el=document.getElementById('ta-title'); if(el){el.focus(); try{if(!preTitle)el.select()}catch(x){}}
}

  const curAps=slotApptDisplayList(W,d,s);
  const hasReal=!!realBlockAt(W,d,s);
  let h='<div class="shead"><h3>'+(hasReal?'Termin ergänzen':'Block oder Termin eintragen')+'</h3><div class="sub">'+esc(fmtDaySlot(d,s))+(curAps.length?' · 📅 '+curAps.length+' Termin'+(curAps.length===1?'':'e')+' im Abschnitt — Block und Termine bleiben beide sichtbar.':' — Vorlage wählen (öffnet danach den Editor, sofern in der Vorlage nicht auf „direkt fertig“ gestellt).')+'</div></div>';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:2px 0 8px"><span class="fh" style="margin:0">'+(hasReal?'Termin-Vorlagen':'Blocktypen &amp; Vorlagen')+'</span><span style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn mini" data-act="quickAddTypeToggle" data-day="'+d+'" data-slot="'+s+'">'+(ui.quickTypeOpen?'✕ Schließen':'＋ Neuer Blocktyp')+'</button><button class="btn mini ghost" data-act="goTypesConfig" title="Blocktypen &amp; Vorlagen in der Konfiguration öffnen">⚙ Konfig</button></span></div>';
  if(ui.quickTypeOpen){
    h+='<div class="card" style="background:var(--soft);margin-bottom:10px;padding:10px 12px"><div class="fh2" style="margin-top:0">Schnell neuen Blocktyp anlegen</div>'+
      '<div class="row2"><input class="inp slim" id="qt-emo" value="🫂" maxlength="4" style="width:54px;text-align:center" title="Emoji"><input class="inp slim grow" id="qt-name" placeholder="Name, z. B. Socializing, Kurs, Sport" style="min-width:140px"><select class="inp slim" id="qt-ampel">'+['none','gruen','gelb','orange','rot'].map(v=>'<option value="'+v+'"'+(v==='gruen'?' selected':'')+'>'+AMP[v].label+'</option>').join('')+'</select></div>'+
      '<div class="row2" style="margin-top:6px"><input class="inp slim grow" id="qt-subs" placeholder="Unterkategorien optional (Komma-getrennt, z. B. Anna, Fanni, Spieleabend)" style="min-width:190px"><label class="checkrow" style="margin:0;white-space:nowrap"><input type="checkbox" id="qt-asappt"'+(hasReal?' checked':'')+'><span>wie Termin</span></label></div>'+
      '<div class="sheetBtns" style="margin-top:8px"><button class="btn primary mini" data-act="quickAddTypeSave" data-day="'+d+'" data-slot="'+s+'" data-use="1">Anlegen &amp; hier einsetzen</button><button class="btn mini" data-act="quickAddTypeSave" data-day="'+d+'" data-slot="'+s+'" data-use="0">Nur anlegen</button></div></div>';
  }
  const availTypes=hasReal?S.types.filter(t=>t.asAppt):S.types;
  if(availTypes.length){
    h+='<div class="stack">'+availTypes.map(t=>{
      normalizeType(t);
      const hints=[];
      if(t.asAppt)hints.push('wie Termin');
      if((t.defSpan||1)>1)hints.push(t.defSpan+' Blöcke');
      if(t.defT0&&slotTimeFitsSlot(t.defT0,t.defT1,s,t.defSpan||1))hints.push(apTimeStr(t.defT0,t.defT1));

function blockSeriesRoom(w,d,s,span,ignoreKey){
  if(!blockSpanRoomW(w,d,s,span,ignoreKey))return false;
  for(let i=0;i<span;i++){const key=d+'|'+(s+i);if(key!==ignoreKey&&blocksFor(w)[key])return false}
  return true;
}
function blockSeriesMembers(id){
  const result=[];if(!id)return result;
  for(const w of Object.keys(S.blocks||{}))for(const key of Object.keys(S.blocks[w]||{})){
    const bl=S.blocks[w][key];if(!bl||bl.seriesId!==id)continue;
    const [day,slot]=key.split('|').map(Number);result.push({w,day,slot,bl,date:iso(addDays(parseISO(w),day))});
  }
  return result.sort((a,b)=>a.date.localeCompare(b.date)||a.slot-b.slot);
}

function slotPickerSheet(title){
  if(!ui.pickerWeek)ui.pickerWeek=wk();
  ui.pickerTitle=title;
  const pw=ui.pickerWeek;
  const realW=iso(mondayOf(new Date()));
  let h='<div class="shead"><h3>'+esc(title)+'</h3><div class="sub">Freie Blöcke — Woche wechseln mit ‹ ›, auch in anderen Wochen und Monaten. Slots mit kurzen Terminen können mitbelegt werden.</div></div>';
  h+='<div class="daychips" style="margin-bottom:8px"><button class="chip" data-act="pickerPrev">‹ eine Woche zurück</button><span class="chip" style="cursor:default">KW '+isoWeek(parseISO(pw))+' · '+fmtDate(parseISO(pw))+' – '+fmtDate(addDays(parseISO(pw),6))+'</span><button class="chip" data-act="pickerNext">eine Woche vor ›</button></div>';
  for(let d=0;d<7;d++){
    const dt=addDays(parseISO(pw),d);
    if(pw===realW&&d<dayIdx(new Date()))continue;
    h+='<div class="daySec"><div class="daySecT">'+fmtDate(dt)+(iso(dt)===todayISO()?' · heute':'')+'</div>';
    for(let s=0;s<3;s++){
      const bl=realBlockAt(pw,d,s), aps=slotApptDisplayList(pw,d,s), cov=coveredByW(pw,d,s);
      const canBundle=bl&&hasBlockTodoItems(bl)&&ui.pickCtx&&(ui.pickCtx.type==='todo'||ui.pickCtx.type==='task');
      h+='<div class="pickRow"><span class="lbl">'+SLOTS[s].ico+' '+SLOTS[s].label+'</span>';
      if(canBundle)h+='<span class="st">☑️ '+esc(bl.title||'Aufgabenblock')+'</span><button class="btn mini" data-act="pickSlotCombine" data-week="'+pw+'" data-day="'+d+'" data-slot="'+s+'">＋ dazupacken</button>';
      else if(bl)h+='<span class="st">Block: '+esc(bl.title||'')+'</span>';
      else if(cov&&!isAsApptBlock(cov))h+='<span class="st">belegt durch „'+esc(cov.title)+'“</span>';
      else if(aps.length)h+='<span class="st">📅 '+aps.length+' Termin'+(aps.length===1?' ('+esc(aps[0].title)+')':'e')+'</span><button class="btn mini" data-act="pickSlot" data-week="'+pw+'" data-day="'+d+'" data-slot="'+s+'">→ dazu einplanen</button>';
      else h+='<button class="btn mini" data-act="pickSlot" data-week="'+pw+'" data-day="'+d+'" data-slot="'+s+'">→ hier einplanen</button>';
      h+='</div>';
    }
    h+='</div>';
  }
  h+='<div class="sheetBtns"><button class="btn ghost" data-act="closeModal">Abbrechen</button></div>';
  openSheet(h);
}

/* ================= Logik ================= */
function nextFree(day,slot){
  const curW=wk(), cur=isCurrentWeek(), tI=dayIdx(new Date());
  for(let off=0;off<4;off++){
    const w=iso(addDays(parseISO(curW),7*off));
    for(let d=0;d<7;d++){
      if(off===0&&cur&&d<tI)continue;
      let s0=0;
      if(off===0&&d===day)s0=slot+1;
      for(let s=s0;s<3;s++){if(!slotOccW(w,d,s))return {week:w,day:d,slot:s}}
    }
  }
  return null;
}
function offerRegen(day,slot){
  const t=nextFree(day,slot);
  if(!t){toast('Keine freien Blöcke mehr diese Woche — Regeneration gern nächste Woche einplanen 🌿'); return}
  ui.suggestion={target:t};
}
function toggleTodo(id,val){
  const f=findTodo(id); if(!f)return;
  f.t.done=val;
  f.t.kanban=val?'fertig':(f.t.kanban==='fertig'?'offen':f.t.kanban);
  if(f.t.planned){
    const bl=getBlocksW(f.t.planned.wk)[f.t.planned.day+'|'+f.t.planned.slot];
    if(bl){
      if(blockItems(bl).length>=2||bl.kind==='bundle')syncBlockPrimaryFields(bl);
      else bl.done=val;
    }
  }
  save();
}
function setBlock(d,s,bl){getBlocks()[d+'|'+s]=bl; save()}
function applySheetBlockEdits(W,d,s){
  const bl=blocksFor(W)[d+'|'+s]; if(!bl)return null;
  const tt=document.getElementById('b-title');
  if(tt&&tt.value.trim()){
    const nv=tt.value.trim();
    if(nv!==bl.title)bl._customTitle=true;
    bl.title=nv;
  }
  const nt=document.getElementById('b-note');
  if(nt)bl.note=nt.value.trim();
  const spEl=document.getElementById('b-span');
  if(spEl){
    const wantSp=Math.max(1,Math.min(3,parseInt(spEl.value,10)||1));
    if(wantSp!==(bl.span||1)&&wantSp<=3-s&&blockSpanRoomW(W,d,s,wantSp,d+'|'+s))bl.span=wantSp;
  }
  const tyEl=document.getElementById('b-type');
  if(tyEl){
    bl.typeId=tyEl.value||null;
    if(bl.typeId&&(!bl.ampel||bl.ampel==='none')){const ty2=typeOf(bl.typeId); if(ty2&&ty2.ampel&&ty2.ampel!=='none')bl.ampel=ty2.ampel}
  }
  const t0el=document.getElementById('b-t0'), t1el=document.getElementById('b-t1');
  if(t0el){
    if(t0el.value){bl.t0=t0el.value; if(t1el&&t1el.value)bl.t1=t1el.value; else delete bl.t1}
    else{delete bl.t0; delete bl.t1}
  }
  if(ui.ampSel!=null&&ui.ampSelK==='block')bl.ampel=ui.ampSel==='none'?null:ui.ampSel;
  const fn=document.getElementById('b-fbnote');
  if(fn)bl.fbNote=fn.value.trim();
  return bl;
}
function cloneBlockClean(bl){
  const c={id:uid(),kind:(bl.kind==='projekt'?'projekt':'typ'),projectId:bl.projectId||null,typeId:bl.typeId||null,title:bl.title||'Block',ampel:bl.ampel||null,note:bl.note||'',done:false,span:bl.span||1};
  if(bl.t0){c.t0=bl.t0; if(bl.t1)c.t1=bl.t1}
  if(bl._customTitle)c._customTitle=true;
  return c;
}

  autoSplitDay(a){
    const W=a.w||wk(), d=+a.day;
    const all=[].concat(apptsInSlot(W,d,0),apptsInSlot(W,d,1),apptsInSlot(W,d,2));
    if(all.length<2)return;
    let moved=0;
    all.forEach(ap=>{
      const r=apRangeMin(ap);
      let ns=-1;
      if(r&&!(r[0]===0&&r[1]===1440)){
        const sh=pad(Math.floor(r[0]/60))+':'+pad(r[0]%60), eh=pad(Math.floor(r[1]/60))+':'+pad(r[1]%60);
        ns=mapSlotForTime(sh,eh);
      }
      if(ns>=0&&ns!==ap.slot){moveApptTo(ap.id,W,d,ns,true); moved++}
    });
    /* Liegen trotz Zeit-Zuordnung weiterhin alle im selben Slot (z. B. 6 Vormittags-Termine), gleichmäßig auf 0/1/2 verteilen */
    if(!moved){
      const sorted=all.slice().sort((x,y)=>apSortMin(x)-apSortMin(y));
      sorted.forEach((ap,idx)=>{
        const ns=Math.min(2,Math.floor(idx*3/sorted.length));

        else ui.authErr='Die Anmeldung ist gerade nicht verfügbar. Bitte prüfe deine Verbindung und versuche es erneut.';

function closestEl(target,sel){
  const el=target&&typeof target.closest==='function'?target:(target&&target.parentElement);
  return el&&typeof el.closest==='function'?el.closest(sel):null;
}
function moveApptTo(apId,dstW,td,ts,quiet){
  const f=findAppt(apId); if(!f)return false;
  const ap=f.ap, srcW=f.w, oldDay=ap.day, oldSlot=ap.slot;
  if(srcW===dstW&&oldDay===td&&oldSlot===ts)return false;
  moveApptClean(f,dstW,td,ts);

  save(); render();
  if(!quiet)toast('Termin verschoben nach '+fmtDaySlotW(dstW,td,ts));
  return true;
}
