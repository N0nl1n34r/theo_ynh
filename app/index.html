// A grip starts dragging immediately; holding a card starts dragging after a short delay.
// Before that delay we preserve taps and implement scroll because touch-action:none
// prevents the browser from taking over the pointer and cancelling an active drag.
let touchDrag=null;
function touchTarget(x,y){return closestEl(document.elementFromPoint(x,y),'[data-drop]')}
function touchUpdate(){
  if(!touchDrag||!touchDrag.active)return;
  const t=touchDrag;
  t.ghost.style.left=(t.x+12)+'px'; t.ghost.style.top=(t.y+12)+'px';
  const next=touchTarget(t.x,t.y);
  if(t.target!==next){if(t.target)t.target.classList.remove('touchDrop');t.target=next;if(next)next.classList.add('touchDrop')}
}
function touchScroll(){
  if(!touchDrag||!touchDrag.active)return;
  const t=touchDrag, edge=70;
  if(t.y<edge)window.scrollBy(0,-12); else if(t.y>window.innerHeight-edge)window.scrollBy(0,12);
  const scroller=document.querySelector('.mobileDays,.kscroll');
  if(scroller){const r=scroller.getBoundingClientRect();if(t.y>=r.top&&t.y<=r.bottom){if(t.x<r.left+35)scroller.scrollLeft-=10;else if(t.x>r.right-35)scroller.scrollLeft+=10}}
  touchUpdate(); t.frame=requestAnimationFrame(touchScroll);
}
function activateTouchDrag(t){
  if(touchDrag!==t||t.active||t.scrolling)return;
  t.active=true;mobileTouch=null;t.source.classList.add('touchDragging');
  t.ghost=document.createElement('div');t.ghost.className='touchGhost';t.ghost.textContent='Verschieben';document.body.appendChild(t.ghost);
  touchUpdate();t.frame=requestAnimationFrame(touchScroll);
}
document.addEventListener('touchstart',e=>{
  const grip=closestEl(e.target,'.touchGrip,.upGrip');
  const source=closestEl(e.target,'[data-drag]');
  if(!source||e.touches.length!==1||(!grip&&closestEl(e.target,'button,input,select,textarea,a,label')))return;
  const p=e.touches[0], cell=closestEl(source,'.mdayView[data-mobile-week]');
  const t=touchDrag={id:p.identifier,x:p.clientX,y:p.clientY,startX:p.clientX,startY:p.clientY,source:source,data:source.dataset.drag,week:cell?cell.dataset.mobileWeek:(source.dataset.dragWeek||wk()),active:false,grip:!!grip,scrolling:false};
  if(grip){mobileTouch=null;e.preventDefault()}else t.timer=setTimeout(()=>activateTouchDrag(t),400);
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(!touchDrag)return;
  const p=Array.from(e.touches).find(x=>x.identifier===touchDrag.id);if(!p)return;
  const t=touchDrag, prevX=t.x, prevY=t.y;t.x=p.clientX;t.y=p.clientY;
  const dx=t.x-t.startX,dy=t.y-t.startY;
  if(!t.active&&Math.hypot(dx,dy)>8){
    if(t.grip)activateTouchDrag(t);
    else {clearTimeout(t.timer);t.scrolling=true}
  }
  if(t.active){e.preventDefault();touchUpdate()}
  else if(t.scrolling){
    e.preventDefault();
    if(Math.abs(dy)>Math.abs(dx))window.scrollBy(0,prevY-t.y);
    else {const scroll=closestEl(t.source,'.kscroll');if(scroll)scroll.scrollLeft+=prevX-t.x}
  }
},{passive:false});
function finishTouchDrag(e,cancelled){
  if(!touchDrag)return;
  const t=touchDrag, p=Array.from(e.changedTouches).find(x=>x.identifier===t.id);if(!p&&!cancelled)return;
  clearTimeout(t.timer);if(p){t.x=p.clientX;t.y=p.clientY}
  if(t.frame)cancelAnimationFrame(t.frame);
  if(t.active)touchUpdate();
  const target=t.target;
  if(target)target.classList.remove('touchDrop');
  t.source.classList.remove('touchDragging');if(t.ghost)t.ghost.remove();
  touchDrag=null;
  if(t.active||t.scrolling||t.grip)dragEndTs=Date.now();
  if(t.active&&!cancelled&&target)performDrop(target,t.data,t.week);
}

  if(el){e.preventDefault(); if(e.dataTransfer)e.dataTransfer.dropEffect='move'; el.classList.add('drop')}
});
document.addEventListener('dragleave',e=>{
  const el=closestEl(e.target,'[data-drop]');
  if(el&&(!e.relatedTarget||typeof el.contains!=='function'||!el.contains(e.relatedTarget)))el.classList.remove('drop');
});
document.addEventListener('drop',e=>{
  const el=closestEl(e.target,'[data-drop]');
  if(!el)return;
  e.preventDefault();
  const data=(e.dataTransfer&&e.dataTransfer.getData&&e.dataTransfer.getData('text/plain'))||dragPayload;
  performDrop(el,data,dragSourceWeek);
});
let dragSourceWeek='';
function performDrop(el,data,sourceWeek){
  el.classList.remove('drop');
  try{document.body.classList.remove('dragging-ev')}catch(x){}
  dragPayload='';
  if(!data)return;
  const mobileDest=closestEl(el,'.mdayView[data-mobile-week]');
  const destWeek=mobileDest?mobileDest.dataset.mobileWeek:wk();
  const drop=el.dataset.drop;
  if(drop==='trash'){
    if(data.startsWith('block:')){
      const p=data.slice(6).split('|'), fd=+p[0], fs=+p[1], W=sourceWeek||wk();
      const bl=blocksFor(W)[fd+'|'+fs];
      if(bl){
        blockItems(bl).forEach(it=>{const r=resolveBlockItem(it); if(r)r.t.planned=null});
        if(bl.stack&&bl.stack.length){bl.stack.forEach(sa=>placeApptInSlot(W,fd,fs,sa)); delete bl.stack}
        retireLocalBlockUid(W,fd,fs);
        delete blocksFor(W)[fd+'|'+fs];
        save(); render(); toast('🗑 Block direkt gelöscht.');
      }
    }else if(data.startsWith('appt:')){
      ACT.apptDel({id:data.slice(5)});
    }
    return;
  }
  if(drop[0]==='w'&&data.startsWith('block:')){
    const from=data.slice(6).split('|');
    const to=drop.slice(1).match(/(\d)s(\d)/);
    if(!to)return;
    const fd=+from[0], fs=+from[1], td=+to[1], ts=+to[2];
    const W=sourceWeek||wk(), DW=destWeek, srcKey=fd+'|'+fs, dstKey=td+'|'+ts;
    if(W===DW&&fd===td&&fs===ts)return;
    const bl=blocksFor(W)[srcKey]; if(!bl)return;
    const spn=bl.span||1;
    const dstBl=blocksFor(DW)[dstKey];
    if(isAsApptBlock(bl)){
      if(spn>3-ts){toast('Ab hier sind nur '+(3-ts)+' Blöcke frei.'); return}
      if(bl.stack&&bl.stack.length){bl.stack.forEach(sa=>placeApptInSlot(W,fd,fs,sa)); delete bl.stack}
      delete blocksFor(W)[srcKey];
      retireLocalBlockUid(W,fd,fs);
      if(!dstBl){
        clearTomb(itemUid('block',DW+'-'+td+'-'+ts));
        blocksFor(DW)[dstKey]=bl;
      }else{
        const apN={id:bl.id||uid(),day:td,slot:ts,title:bl.title||'Termin',time:apTimeStr(bl.t0||'',bl.t1||''),ampel:bl.ampel&&bl.ampel!=='none'?bl.ampel:null,src:'Manuell',areaId:null,span:spn,typeId:bl.typeId||null};
        if(bl.t0){apN.t0=bl.t0; if(bl.t1)apN.t1=bl.t1}
        if(bl.note||bl.fbNote)apN.fbNote=bl.fbNote||bl.note;
        if(bl.fb)apN.fb=bl.fb;
        placeApptInSlot(DW,td,ts,apN);
      }
      save(); render(); toast('Termin verschoben nach '+fmtDaySlotW(DW,td,ts));
      return;
    }
    if(dstBl&&hasBlockTodoItems(bl)&&hasBlockTodoItems(dstBl)){
      const srcItems=blockItems(bl);
      if(bl.stack&&bl.stack.length){bl.stack.forEach(sa=>placeApptInSlot(W,fd,fs,sa)); delete bl.stack}
      delete blocksFor(W)[srcKey];
      retireLocalBlockUid(W,fd,fs);
      srcItems.forEach(it=>{
        const r=resolveBlockItem(it); if(r)r.t.planned=null;
        combineItemIntoBlock(DW,td,ts,dstBl,it);
      });
      save(); render(); toast('☑️ Aufgaben zu einem Bündel kombiniert ('+blockItems(dstBl).length+' im Block).');
      return;
    }
    if(dstBl&&!isAsApptBlock(dstBl)&&spn===1&&(dstBl.span||1)===1){
      blocksFor(W)[srcKey]=dstBl;
      blocksFor(DW)[dstKey]=bl;
      clearTomb(itemUid('block',W+'-'+fd+'-'+fs)); clearTomb(itemUid('block',DW+'-'+td+'-'+ts));
      syncBlockItemsPlanned(DW,td,ts,bl);
      syncBlockItemsPlanned(W,fd,fs,dstBl);
      save(); render(); toast('Blöcke getauscht: '+fmtDaySlot(fd,fs)+' ⇄ '+fmtDaySlotW(DW,td,ts));
      return;
    }
    if(spn>3-ts){toast('Ab hier sind nur '+(3-ts)+' Blöcke frei.'); return}
    if(!blockSpanRoomW(DW,td,ts,spn,W===DW?srcKey:null)){toast('Zielblock belegt.'); return}
    if(bl.stack&&bl.stack.length){bl.stack.forEach(sa=>placeApptInSlot(W,fd,fs,sa)); delete bl.stack}
    delete blocksFor(W)[srcKey];
    retireLocalBlockUid(W,fd,fs);
    setBlockW(DW,td,ts,bl);
    syncBlockItemsPlanned(DW,td,ts,bl);
    save(); render(); toast('Verschoben nach '+fmtDaySlotW(DW,td,ts));
  }else if(drop[0]==='w'&&data.startsWith('appt:')){
    const to=drop.slice(1).match(/(\d)s(\d)/);
    if(!to)return;
    moveApptTo(data.slice(5),destWeek,+to[1],+to[2],false);
  }else if(drop[0]==='w'&&data.startsWith('todo:')){
    const to=drop.slice(1).match(/(\d)s(\d)/);
    if(!to)return;
    const tid=data.slice(5).split('|')[1], td=+to[1], ts=+to[2], W=destWeek;
    const f=findTodo(tid); if(!f)return;
    const dstBl=realBlockAt(W,td,ts);
    if(dstBl&&hasBlockTodoItems(dstBl)){
      combineItemIntoBlock(W,td,ts,dstBl,{kind:'todo',id:tid});
      save(); render(); toast('☑️ „'+f.t.title+'“ zum Block-Bündel kombiniert ('+blockItems(dstBl).length+' Aufgaben).');
      return;
    }
    if(blockOccW(W,td,ts)){toast('Zielblock belegt.'); return}
    detachItemEverywhere('todo',tid,W,td,ts);
    f.t.planned={wk:W,day:td,slot:ts};
    setBlockW(W,td,ts,{id:uid(),kind:'projekt',projectId:f.p.id,todoId:tid,title:f.p.name,ampel:'gelb',note:f.t.firstStep||'',done:false});
    save(); render(); toast('„'+f.t.title+'“ geplant: '+fmtDaySlotW(W,td,ts));
  }else if(drop[0]==='w'&&data.startsWith('task:')){
    const to=drop.slice(1).match(/(\d)s(\d)/);
    if(!to)return;
    const taskId=data.slice(5), td=+to[1], ts=+to[2], W=destWeek;
    const t=S.tasks.find(x=>x.id===taskId); if(!t)return;
    const dstBl=realBlockAt(W,td,ts);
    if(dstBl&&hasBlockTodoItems(dstBl)){
      combineItemIntoBlock(W,td,ts,dstBl,{kind:'task',id:taskId});
      save(); render(); toast('☑️ „'+t.title+'“ zum Block-Bündel kombiniert ('+blockItems(dstBl).length+' Aufgaben).');
      return;
    }
    if(blockOccW(W,td,ts)){toast('Zielblock belegt.'); return}
    detachItemEverywhere('task',taskId,W,td,ts);
    t.planned={wk:W,day:td,slot:ts};
    setBlockW(W,td,ts,{id:uid(),kind:'task',taskId:t.id,typeId:null,title:t.title,ampel:'none',note:t.firstStep||'',done:!!t.done});
    save(); render(); toast('„'+t.title+'“ geplant: '+fmtDaySlotW(W,td,ts));
  }else if(drop==='g'&&data.startsWith('gtodo:')){
    const tid=data.slice(6).split('|')[1];
    const f=findTodo(tid);
    if(f){
      f.t.start=el.dataset.date;
      save(); render(); toast('Start verschoben: '+fmtDate(parseISO(el.dataset.date))+' — die Deadline (▼) bleibt fix.');
    }
  }else if(drop.startsWith('k')&&data.startsWith('todo:')){
    const tid=data.slice(5).split('|')[1];
    const col=drop.slice(1);
    ACT.kanMove({tid:tid,c:col});
  }else if(drop.startsWith('reorder:')&&data.startsWith('reorder:')){
    const tp=drop.split(':'), sp=data.split(':');
    if(tp[1]===sp[1]){
      const map={area:'areas',type:'types'};
      const arr=S[map[tp[1]]]; if(!arr)return;
      const from=+sp[2], to=+tp[2];
      if(from!==to&&from>=0&&to>=0&&from<arr.length&&to<arr.length){
        const mv=arr.splice(from,1)[0];
        arr.splice(to,0,mv);
        save(); render();
      }
    }
  }
}


/* ================= Start ================= */
const savedState=load();
S=(savedState&&savedState.meta&&savedState.meta.v===4)?normalizeState(savedState):seedFrom(savedState);
ui.standaloneAdmin=typeof location!=='undefined'&&/^\/admin\/?$/.test(location.pathname||'');
if(ui.standaloneAdmin)ui.route={view:'admin'};
ui.year=new Date().getFullYear();
ui.mobileDay=dayIdx(new Date());
render();
bootAuthAndSync();
</script>
