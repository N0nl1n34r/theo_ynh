#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "theo"
name = "Theo"
description.en = "Calm personal planning — week grid, projects, phases and two-way CalDAV sync"
description.de = "Ruhige Planung — Wochenraster, Projekte, Phasen und CalDAV-Sync in beide Richtungen"
version = "0.13~ynh1"
maintainers = ["denis"]

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "5M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.nextcloud]
    ask.en = "Base URL of your Nextcloud (CalDAV target)"
    ask.de = "Basis-URL deiner Nextcloud (CalDAV-Ziel)"
    type = "url"
    default = "https://kai.nl.tab.digital"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.ports]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "python3"
